<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FFF 教練登入</title>

<!--
  ═══════════════════════════════════════════════════════════════════
  staff.html — 教練的身分頁（第 38 步）

  教練從 LINE 開這一頁 → liff-auth.js 換到一張 Supabase 憑證 →
  這一頁拿 auth.uid() 去 employees 對一次。

    對得到  → 顯示「Peter · 教練」，這支手機以後就是他的識別
    對不到  → 顯示「登入代號」，請他把那串給 Jerec，Jerec 跑一行 SQL 開通

  ☢️ 這一頁不要放進客人的圖文選單。
     開通用的網址單獨發給六個人：
     https://liff.line.me/2011063116-QOxXN30h/staff.html

  ⚠️ 就算網址被客人拿到也不會外洩任何東西 ——
     employees 的政策是 is_staff()，沒開通的人查到的是 0 列。
     「不放進選單」是為了不讓客人困惑，不是安全機制。
  ═══════════════════════════════════════════════════════════════════
-->

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0E2A3B; --ink2:#1C4257; --blue:#2E86AB; --teal:#6FBAC9;
    --bg:#F4F8FA; --surface:#FFFFFF; --surface2:#EDF4F7;
    --line:#DCE8EE; --dim:#587589; --faint:#93AEBD;
    --ok:#2F6B54; --ok-bg:#E4F0EA; --ok-line:#B9D8C8;
    --warn:#B4661F; --warn-bg:#FBEFE2; --warn-line:#EBC4A0;
    --err:#A4211A; --err-bg:#FBE9E7; --err-line:#F3C9C5;
  }
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.65;padding:24px 16px 56px;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto}

  header{margin-bottom:20px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--faint)}
  h1{font-size:23px;font-weight:800;letter-spacing:.02em;margin-top:4px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:3px;
    padding:22px 20px;margin-bottom:14px}

  /* 狀態塊 */
  .state{display:flex;align-items:flex-start;gap:13px}
  .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;line-height:1;margin-top:1px}
  .s-wait .dot{background:var(--surface2);color:var(--dim)}
  .s-ok   .dot{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .s-warn .dot{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .s-err  .dot{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
  .st{font-size:18px;font-weight:800;letter-spacing:.02em}
  .s-ok   .st{color:var(--ok)}
  .s-warn .st{color:var(--warn)}
  .s-err  .st{color:var(--err)}
  .ss{font-size:13px;color:var(--dim);margin-top:3px}
  .role{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;
    letter-spacing:.12em;padding:3px 9px;border-radius:2px;
    background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}

  /* 登入代號 */
  .lbl{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--faint);
    margin:20px 0 7px}
  .code{font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--ink);
    background:var(--surface2);border:1px solid var(--line);border-radius:3px;
    padding:13px 14px;word-break:break-all;user-select:all;-webkit-user-select:all}
  .btn{display:block;width:100%;margin-top:10px;padding:13px;
    font-size:15px;font-weight:700;letter-spacing:.04em;font-family:inherit;
    background:var(--ink);color:#fff;border:none;border-radius:3px;cursor:pointer}
  .btn:active{background:var(--ink2)}
  .btn.done{background:var(--ok)}
  a.btn{display:block;text-align:center;text-decoration:none;margin-top:18px}
  a.btn.go{background:var(--ok)}
  .note{font-size:13px;color:var(--dim);margin-top:14px}
  .note b{color:var(--ink)}

  .hint{background:var(--surface2);border-left:3px solid var(--teal);
    padding:13px 15px;font-size:13px;color:var(--ink2);border-radius:0 3px 3px 0}
  .hint b{font-weight:700}

  code{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;
    background:var(--surface2);padding:1px 5px;border-radius:2px}
  .foot{font-size:11px;color:var(--faint);text-align:center;margin-top:26px;letter-spacing:.04em}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">FUSION FORCE FITNESS</div>
    <h1>教練登入</h1>
  </header>

  <section class="card">
    <div class="state s-wait" id="box">
      <div class="dot" id="dot">◌</div>
      <div>
        <div class="st" id="title">正在辨識…</div>
        <div class="ss" id="sub">跟資料庫確認你是誰</div>
        <span class="role" id="role" hidden></span>
      </div>
    </div>

    <!-- 還沒開通才會出現 -->
    <div id="claim" hidden>
      <div class="lbl">你的登入代號</div>
      <div class="code" id="uid">—</div>
      <button type="button" class="btn" id="copy">複製代號</button>
      <div class="note">
        把這一串傳給 <b>Jerec</b>，他開通之後你重新整理這一頁就會看到自己的名字。<br>
        這串<b>不是密碼</b>，傳給誰都不會被拿去做什麼。
      </div>
    </div>

    <!-- 已開通才會出現 -->
    <div id="go" hidden>
      <a class="btn go" href="checkin.html">進入點名核銷 ›</a>
      <a class="btn go" href="staff-tools.html" style="margin-top:9px">教練後台（新增客人・綁定問題）›</a>
      <div class="note">
        建議把這一頁<b>加到手機主畫面</b>或釘選在 LINE 的聊天室，
        下課前開一下就好。
      </div>
    </div>

    <!-- 沒在 LINE 裡開才會出現 -->
    <div id="needline" hidden>
      <div class="hint">
        這一頁要<b>從 LINE 裡面開</b>才認得出你是誰。<br>
        請在 LINE 的聊天室點 Jerec 給你的那個連結，不要複製到瀏覽器貼上。
      </div>
    </div>
  </section>

  <p class="foot">第 38 步 · 教練帳號</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="liff-auth.js"></script>

<script>
(function () {
  'use strict';

  var box   = document.getElementById('box');
  var dot   = document.getElementById('dot');
  var title = document.getElementById('title');
  var sub   = document.getElementById('sub');
  var role  = document.getElementById('role');
  var claim = document.getElementById('claim');
  var need  = document.getElementById('needline');
  var uidEl = document.getElementById('uid');
  var btn   = document.getElementById('copy');
  var go    = document.getElementById('go');

  var ROLE = { owner:'負責人', coach:'教練', staff:'櫃檯', admin:'管理' };

  function show(cls, icon, t, s) {
    box.className = 'state ' + cls;
    dot.textContent = icon;
    title.textContent = t;
    sub.textContent = s || '';
    sub.hidden = !s;
  }

  // ☢️ 錯誤和「查無資料」在 supabase-js 裡長得不一樣，但很容易寫成一樣：
  //    const { data } = await ... 會把 error 整個吞掉，
  //    然後 data 是 null，看起來就跟「這個人不是員工」一模一樣。
  //    意思剛好相反 —— 一個是「系統壞了」，一個是「你還沒開通」。
  //    所以這裡一定要把 error 接出來單獨處理。（規則 14）
  function lookup(uid) {
    return window.fffDB
      .from('employees')
      .select('display_name, role, is_active')
      .eq('auth_user_id', uid)
      .then(function (res) {
        if (res.error) throw new Error(res.error.message || 'query_failed');
        return (res.data && res.data.length) ? res.data[0] : null;
      });
  }

  function fillCode(uid) {
    uidEl.textContent = uid;
    claim.hidden = false;
    btn.onclick = function () {
      var ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(uid);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 桌機／舊版 WebView 的退路（第 34 步踩過同一個坑）
        try {
          var ta = document.createElement('textarea');
          ta.value = uid;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e2) { ok = false; }
      }
      btn.textContent = ok ? '已複製 ✓' : '複製不了，請長按上面那串選取';
      if (ok) btn.classList.add('done');
    };
  }

  function run() {
    if (!window.FFF_AUTH || !window.FFF_AUTH.ready) {
      show('s-err', '✕', '身分程式沒載進來', 'liff-auth.js 沒跑起來');
      return;
    }

    window.FFF_AUTH.ready.then(function () {
      var st = window.FFF_AUTH.state;

      if (st === 'browsing') {
        show('s-warn', '○', '還沒認出你', '不是從 LINE 開的');
        need.hidden = false;
        return;
      }
      if (st === 'error') {
        show('s-err', '✕', '辨識失敗', window.FFF_AUTH.error || '');
        return;
      }

      // 到這裡代表 LINE 認過了，資料庫也發了憑證。
      // 接下來要問的是「這張憑證在 employees 裡對得到人嗎」。
      if (!window.fffDB) {
        show('s-err', '✕', '資料庫連線沒建立', 'no_fffDB');
        return;
      }

      window.fffDB.auth.getUser().then(function (res) {
        if (res.error || !res.data || !res.data.user) {
          show('s-err', '✕', '拿不到登入身分', (res.error && res.error.message) || 'no_user');
          return;
        }
        var uid = res.data.user.id;

        lookup(uid).then(function (me) {
          if (!me) {
            show('s-warn', '●', '還沒開通', '你的 LINE 認出來了，但還沒對到員工名單');
            fillCode(uid);
            return;
          }
          if (me.is_active === false) {
            show('s-err', '✕', me.display_name + '　已停用', '如果這是誤設，請找 Jerec');
            return;
          }
          show('s-ok', '✓', me.display_name, '這支手機以後就認得你了');
          role.textContent = ROLE[me.role] || me.role;
          role.hidden = false;
          go.hidden = false;
        }, function (e) {
          // 查詢真的壞掉，不能假裝成「還沒開通」
          show('s-err', '✕', '查不到員工名單', String(e && e.message || e));
        });
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
</body>
</html>
