<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>服務登記 · FFF</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  服務登記 —— 第 71 步 · 2026-08-19

  網址：https://liff.line.me/2011063116-QOxXN30h/service.html

  這一頁登記「已經發生的」PT／PGT／外派／諧動活動／企業包班。
  規則文件第六篇 4 的「共用結算紀錄」，就是這一頁在填。

  ☢️ GT 不在這裡。GT 走點名核銷（checkin.html），已經在線上跑了。

  ☢️ 畫面上的試算【只是給人看的】。真正的金額由資料庫的 add_service()
     算完回傳 —— 送出後看到的數字才是存進去的那個。
     前端算好再送過來的話，改一下網頁原始碼就能塞任何金額進帳。
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0E2A3B; --ink2:#1C4257; --blue:#2E86AB; --teal:#6FBAC9;
    --bg:#F4F8FA; --surface:#FFF; --surface2:#EDF4F7;
    --line:#DCE8EE; --dim:#587589; --faint:#93AEBD;
    --ok:#2F6B54; --ok-bg:#E4F0EA; --ok-line:#B9D8C8;
    --warn:#B4661F; --warn-bg:#FBEFE2; --warn-line:#EBC4A0;
    --err:#A4211A; --err-bg:#FBE9E7; --err-line:#F3C9C5;
  }
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:44px}

  .top{background:var(--ink);color:#fff;padding:13px;display:flex;align-items:center;gap:6px}
  /* ☢️ 標題那一塊沒有 min-width:0 的話【不會縮】—— flex 項目的最小尺寸
     預設是內容寬度，所以標題會把右邊的功能鈕擠出畫面外，
     而且擠出去的部分【沒有捲軸、看不到也點不到】。 */
  .top>div:first-child{min-width:0}
  .who{font-size:16px;font-weight:800;letter-spacing:.03em}
  .sub{font-size:11px;color:#A9C6D4;margin-top:1px}
  .sp{flex:1}
  .who,.sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ar{display:inline-block;flex:0 0 auto;width:9px;height:9px;
    border-right:2.6px solid currentColor;border-top:2.6px solid currentColor;
    border-radius:1.5px;transform:rotate(45deg);font-size:0;line-height:0;
    vertical-align:middle;margin:0 3px 1px 5px}
  .iconbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;
    padding:9px 10px;font-family:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;flex:0 0 auto;
    cursor:pointer;line-height:1.5}
  .iconbtn:active{background:rgba(255,255,255,.25)}

  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px;margin-bottom:12px}
  .h{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint);margin:16px 3px 8px}

  /* ── 服務類型 ── */
  .types{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .ty{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
    padding:10px 11px;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink)}
  .ty .t{font-size:14px;font-weight:800}
  .ty .d{font-size:11px;color:var(--dim);margin-top:1px}
  .ty.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .ty.on .d{color:#A9C6D4}

  /* ── 表單 ── */
  .f{margin-bottom:11px}
  .f:last-child{margin-bottom:0}
  .f label{display:block;font-size:11.5px;font-weight:800;color:var(--dim);
    letter-spacing:.04em;margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--blue);background:#fff}
  .f textarea{min-height:60px;resize:vertical}
  .f .hint{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.5}
  /* ☢️ 「這位客人沒有卡」不是提示，是一句要看得到的話 ——
        它代表這一筆【不會扣到任何堂數】。用一般的淡灰色說出來等於沒說。 */
  .f .hint.warn{background:var(--warn-bg);border:1px solid var(--warn-line);
    color:#7C420E;border-radius:9px;padding:8px 10px;font-size:11.5px;margin-top:6px}
  .f .hint.warn b{font-weight:800}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill:disabled{opacity:.4;cursor:default}

  /* ── 客人搜尋 ── */
  .hit{border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;display:flex;
    align-items:baseline;gap:7px}
  .hit:first-child{border-top:0}
  .hit .nm{font-size:14px;font-weight:800}
  .hit .tl{font-size:11.5px;color:var(--faint);
    font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .hit .bl{margin-left:auto;font-size:11.5px;color:var(--dim)}
  .picked{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:9px;
    padding:9px 10px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
  .picked button{margin-left:auto;background:none;border:0;color:var(--dim);
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}

  /* ── 試算 ── */
  .calc{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px}
  .cl{display:flex;font-size:13px;padding:2px 0}
  .cl .k{color:var(--dim)}
  .cl .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .cl.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-size:15px}
  .cl.tot .v{font-weight:800;color:var(--ok)}
  .cl.perf .v{color:var(--blue)}

  .btn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:11px;
    padding:14px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .btn:active{background:var(--ink2)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--line);
    font-size:13.5px;padding:11px;margin-top:10px}

  /* ── 清單 ── */
  .row{border-top:1px solid var(--line);padding:9px 2px}
  .row:first-child{border-top:0}
  .r1{display:flex;align-items:baseline;gap:7px}
  .nm{font-size:14px;font-weight:800}
  .amt{margin-left:auto;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .r2{font-size:11.5px;color:var(--dim);margin-top:1px}
  .r3{margin-top:6px;display:flex;gap:6px}
  .r3 button{font-family:inherit;font-size:12px;font-weight:800;padding:6px 12px;
    border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
  .r3 button.go{background:var(--ok);border-color:var(--ok);color:#fff}
  .row.void{opacity:.55}
  .row.void .amt{text-decoration:line-through;color:var(--err)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    border:1px solid var(--line);background:var(--surface2);color:var(--ink2);margin-left:5px}
  .tag.fin{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .tag.pen{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

  /* 第 94 步：整月認列。☢️ 類別名一律 fm- 開頭 —— 動手前搜過整份檔案確定沒撞名。 */
  .fm-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding:9px 10px;margin-bottom:9px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--line)}
  .fm-bar>span{font-size:12.5px;font-weight:700;color:var(--dim)}
  .fm-bar input{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;flex:1;min-width:120px}
  .fm-see{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 13px;
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .fm-see:disabled{opacity:.5}
  .fm-r{width:100%;font-size:13px;color:var(--ink2)}
  .fm-r b{font-size:14px}
  /* ☢️ 用 #8F5017 不是 var(--warn) —— 後者壓在 --warn-bg 上量出來只有 3.82:1。 */
  .fm-left{width:100%;padding:8px 10px;border-radius:9px;font-size:12.5px;
    background:var(--warn-bg);border:1px solid var(--warn-line);color:#8F5017}
  .fm-left b{display:block;font-size:13px}
  .fm-go{width:100%;background:var(--ok);color:#fff;border:0;border-radius:9px;
    padding:11px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .fm-go:disabled{opacity:.5}

  /* 第 94 步收尾：補金額／改金額。☢️ 類別名一律 amt- 開頭（搜過沒撞名）。
     ☢️ .amt 已經被用掉了（清單右邊的金額），所以是 amt- 不是 amt。 */
  .amt-f{margin-top:8px;padding:11px;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;display:grid;gap:7px}
  .amt-hd{font-size:13px;font-weight:800;color:var(--ink)}
  .amt-warn{padding:8px 10px;border-radius:9px;font-size:12.5px;
    background:var(--warn-bg);border:1px solid var(--warn-line);color:#8F5017}
  .amt-f label{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em}
  .amt-f input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  .amt-go{background:var(--ok);color:#fff;border:0;border-radius:9px;padding:11px;
    font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .amt-go:disabled{opacity:.5}
  .amt-no{background:none;border:0;color:var(--dim);font-family:inherit;font-size:12px;
    cursor:pointer;padding:4px}

  .note{font-size:11.5px;color:var(--dim);margin-top:8px}
  /* 待確認專區。☢️ 這一區【不受 20 筆上限影響】—— 沒認列的紀錄不會進薪資，
     被清單長度藏起來的話，那筆錢就永遠沒有人去處理。 */
  .h.pend{color:var(--warn)}
  .card.pend{border-color:var(--warn-line);border-left:4px solid var(--warn)}
  /* ☢️ var(--warn) 壓在白底上量出來只有 4.32:1，這裡是 11.5px 的一般字（要 4.5:1）。
     壓深到 #8F5017（6.31:1）。原本就偏淡，順手一起修。 */
  .card.pend .note{color:#8F5017}
  .loaderr{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err);
    border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:8px}

  /* 第 90 步：收款。☢️ 前綴 pay- —— 動手前在整份檔案搜過，沒有撞名。 */
  .h.pay{color:var(--err)}
  .card.pay{border-color:var(--err-line);border-left:4px solid var(--err)}
  .card.pay .note{color:var(--err)}
  .paytag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    border:1px solid var(--line);background:var(--surface2);color:var(--ink2);margin-left:5px}
  .paytag.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .paytag.wait{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .paytag.no{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
  /* ☢️ 「這一堂本來就不在現場收錢」要跟「還沒開始收」長得不一樣。
     兩種都留白的話，20 筆裡有 15 筆是空的 —— 看起來像功能壞了。 */
  .r2.paydim{color:var(--faint)}
  .paybox{margin-top:8px;border:1px solid var(--line);background:var(--surface2);
    border-radius:10px;padding:10px}
  .paybox .f{margin-bottom:8px}
  .paybox .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .paybox .acts{display:flex;gap:6px;margin-top:8px}
  .paybox .acts button{flex:1;font-family:inherit;font-size:13px;font-weight:800;padding:9px;
    border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2)}
  .paybox .acts button.go{background:var(--ok);border-color:var(--ok);color:#fff}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:16px 4px}
  .gate{padding:56px 20px;text-align:center}
  .gate .g1{font-size:17px;font-weight:800;color:var(--ink)}
  .gate.err .g1{color:var(--err)}
  .gate .g2{font-size:12.5px;color:var(--dim);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;
    font-size:13px;font-weight:600;max-width:88%;text-align:center;z-index:50}
  .toast.bad{background:var(--err)}
  [hidden]{display:none !important}

  /* ══ 桌機 ══ 跟 checkin.html 同一套（第 59 步）══ */
  @media (min-width:1000px){
    :root{--col:640px}
    .top,.wrap{zoom:1.22}
    .wrap{max-width:var(--col)}
    .top{padding-inline:max(13px, calc((100% - var(--col)) / 2 + 14px))}
  }
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="who" id="who">服務登記</div>
    <div class="sub" id="whoSub">辨識中…</div>
  </div>
  <div class="sp"></div>
  <a class="iconbtn" href="staff-tools.html">後台</a>
  <button type="button" class="iconbtn" id="reload">重新整理</button>
</div>

<div class="wrap">
  <div id="gate" class="gate"><div class="g1">辨識中…</div><div class="g2">跟資料庫確認你是誰</div></div>
  <div id="main" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="liff-auth.js"></script>

<script>
(function () {
  'use strict';

  var DB = null, ME = null, BUSY = false;
  var PRICES = { PT: [], PGT: [], CORP: [] };
  var COACHES = [], LIST = [], STAFF = [], PEND = [], LOAD_ERR = '';
  // 第 94 步：整月認列。FMM＝要處理的月份、FMR＝「先看看」的結果。
  var FMM = '', FMR = null, FMBUSY = false;
  // 第 90 步：收款。PAYS 是 service_id → 收款彙總；UNPAID 是「還沒收齊」那一區。
  var PAYS = {}, UNPAID = [];
  var PAYOPEN = null, PAYBUSY = false;
  // 第 94 步收尾：改金額。AMTOPEN ＝ 哪一筆的金額表單被打開了。
  var AMTOPEN = null, AMTBUSY = false;
  var PAYF = { method:'cash', amount:'', paid:true, payer:'', note:'' };
  var SVC_COLS = 'id,service_type,done_date,done_time,customer_name,company_name,headcount,' +
                 'billed_hours,revenue_amount,travel_fee,perf_amount,total_amount,' +
                 'fin_status,voided,void_reason,coach_names,created_by_name,note,manual_note,charge_method';
  var elGate = document.getElementById('gate');
  var elMain = document.getElementById('main');
  var elWho  = document.getElementById('who');
  var elSub  = document.getElementById('whoSub');

  /* 表單狀態。☢️ 只放「人填的原始輸入」，不放算出來的金額 ——
     金額由資料庫算，前端算的那份只是給人看的。 */
  var F = {
    type: 'PT', customer: null, headcount: 1, product_code: '',
    charge: 'single', attended: '', hours: '', area: '', area_kind: '', corpHead: '',
    company: '', tax_id: '', booked_hours: '', approved_headcount: '',
    scope: '', transport: '', approver_id: '', approved_on: '',
    amount: '', note: '', coaches: [],
    // 第 93 步：扣預收要指定【從哪一張卡扣】
    plan_id: ''
  };

  /* ══ 這位客人有哪幾張卡 ═══════════════════════════════════════
     ☢️ CARDS 是【非同步】拿回來的，而 render() 是同步的 ——
        所以畫面要能處理「還在讀」這個狀態，不能假設拿到了。
        沒處理的話，選完客人的那一瞬間卡片區是空的，看起來像「沒有卡」，
        而「沒有卡」在這一頁是一個【有意義的結論】（可以直接登記）。
     ☢️ CARDS_KEY 記的是「這份卡片是誰的、哪個產品別的」。
        沒有它的話，換客人之後舊客人的卡還會留在畫面上 —— 而且可以按。 */
  var CARDS = [], CARDS_KEY = '', CARDS_BUSY = false;

  var TYPES = [
    { k:'PT',      t:'私人教練課',   d:'PT · 1~2 人' },
    { k:'PT_OUT',  t:'PT 外派',      d:'課程費 ＋ 交通 500' },
    { k:'PGT',     t:'私人團體班',   d:'PGT · 3~6 人' },
    { k:'PGT_OUT', t:'PGT 外派',     d:'課程費 ＋ 交通 500' },
    { k:'EVENT',   t:'諧動外派活動', d:'鐘點制 · 最多 2 位教練' },
    { k:'CORP',    t:'企業包班',     d:'地區 × 時數費率' }
  ];
  function typeName(k) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].k === k) return TYPES[i].t;
    return k;
  }
  var isPT   = function (k) { return k === 'PT' || k === 'PT_OUT'; };
  var isPGT  = function (k) { return k === 'PGT' || k === 'PGT_OUT'; };
  var isOut  = function (k) { return k === 'PT_OUT' || k === 'PGT_OUT'; };
  var isCourse = function (k) { return isPT(k) || isPGT(k); };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function money(n) { return 'NT$' + Number(n || 0).toLocaleString('en-US'); }
  function gate(cls, t1, t2) {
    elGate.className = 'gate' + (cls ? ' ' + cls : '');
    elGate.innerHTML = '<div class="g1">' + esc(t1) + '</div><div class="g2">' + esc(t2||'') + '</div>';
    elGate.hidden = false; elMain.hidden = true;
  }
  var tT;
  function toast(msg, bad) {
    var d = document.querySelector('.toast');
    if (d) d.remove();
    d = document.createElement('div');
    d.className = 'toast' + (bad ? ' bad' : '');
    d.textContent = msg;
    document.body.appendChild(d);
    clearTimeout(tT);
    tT = setTimeout(function () { d.remove(); }, bad ? 5200 : 2600);
  }

  // 台北時間的「現在」，塞進 datetime-local
  function nowLocal() {
    var s = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Taipei' });
    return s.slice(0, 16).replace(' ', 'T');
  }
  /* ☢️ 月份一律用【台北時間的今天】算，不是 toISOString()。
        toISOString() 給的是 UTC —— 每個月 1 號的凌晨 0 點到 8 點之間，
        它會回上個月，而那正好是「月初來結上個月」最可能發生的時段。 */
  function twMonth() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }).slice(0, 7);
  }


  /* ══ 試算 ══════════════════════════════════════════════════════
     ☢️ 這裡算的數字【只是給人看的】，送出後以資料庫回傳為準。
        兩邊的公式必須一致 —— 不一致的話畫面會騙人。 */
  function priceOf(code) {
    var all = PRICES.PT.concat(PRICES.PGT).concat(PRICES.CORP);
    for (var i = 0; i < all.length; i++) if (all[i].code === code) return all[i].price;
    return 0;
  }
  // 企業包班的每小時費率。☢️ 從資料庫的 products 來，不寫死在畫面裡。
  function corpRate() {
    return F.area_kind ? priceOf('CORP-' + F.area_kind) : 0;
  }
  function calc() {
    var t = F.type, rev = 0, travel = 0, perf = 0, hours = null;
    if (isCourse(t)) {
      rev = F.charge === 'free' ? 0
          : (F.product_code ? priceOf(F.product_code) : Number(F.amount || 0));
      travel = isOut(t) ? 500 : 0;
      perf = rev + travel;
    } else if (t === 'EVENT') {
      var raw = Number(F.hours || 0);
      hours = raw > 0 ? Math.ceil(raw) : 0;            // 無條件進位
      var n = F.coaches.length || 0;
      rev = (n * hours * 600) + (hours * 600);
      travel = hours > 0 ? 500 : 0;
      perf = 0;                                        // 活動走鐘點費
    } else {
      // 企業包班：地區 × 時數（每小時費用已含交通費，所以不再加 500）
      rev = Math.round(corpRate() * Number(F.hours || 0));
      perf = rev;
    }
    return { rev: rev, travel: travel, perf: perf, hours: hours, total: rev + travel,
             coachPay: t === 'EVENT' ? (hours || 0) * 600 : null };
  }

  /* ══ 畫面 ══════════════════════════════════════════════════════ */
  function typeBlock() {
    return '<div class="h">這是哪一種服務</div><div class="card"><div class="types">' +
      TYPES.map(function (x) {
        return '<button type="button" class="ty' + (F.type === x.k ? ' on' : '') +
          '" data-ty="' + x.k + '"><div class="t">' + x.t + '</div>' +
          '<div class="d">' + x.d + '</div></button>';
      }).join('') + '</div></div>';
  }

  function customerBlock() {
    if (!isCourse(F.type)) return '';
    var body = F.customer
      ? '<div class="picked">' + esc(F.customer.name) +
        '<span style="font-weight:400;color:var(--dim);font-size:12px">' +
        esc(F.customer.phone_tail || '') + '</span>' +
        '<button type="button" id="unpick">換一個</button></div>'
      : '<input id="q" type="search" placeholder="打名字或手機末三碼" autocomplete="off">' +
        '<div id="hits" style="margin-top:8px"></div>';
    return '<div class="f"><label>客人</label>' + body + '</div>';
  }

  function headBlock() {
    if (!isCourse(F.type)) return '';
    var lo = isPT(F.type) ? 1 : 3, hi = isPT(F.type) ? 2 : 6, out = '';
    for (var n = lo; n <= hi; n++) {
      out += '<button type="button" class="pill' + (F.headcount === n ? ' on' : '') +
             '" data-head="' + n + '">' + n + ' 人</button>';
    }
    return '<div class="f"><label>購買商品人數規格</label><div class="pills">' + out + '</div>' +
      '<div class="hint">人數只算學員，不含教練。' +
      (isPT(F.type) ? 'PT 只有 1 人或 2 人。' : 'PGT 只有 3 到 6 人。') + '</div></div>';
  }

  /* ══ 扣預收：從哪一張卡扣 ═════════════════════════════════════
     ☢️ 這一塊是第 93 步的核心。以前選「扣預收」只是把四個字記下來，
        客人的卡【一堂都沒有少】—— 買十堂、上十堂、系統還是說有十堂。
     ☢️ 為什麼要人選，不讓系統挑：一個人可能同時有一對一和一對二兩張卡，
        而兩張的每堂價值不一樣（15,000÷10 vs 20,000÷10）。
        挑錯 → 業績錯 → 抽成錯 → 薪水錯，而且畫面上完全正常。 */
  function cardKey() {
    return (F.customer ? F.customer.id : '') + '/' + (isPT(F.type) ? 'PT' : 'PGT');
  }

  function loadCards() {
    var key = cardKey();
    if (!F.customer || !isCourse(F.type)) { CARDS = []; CARDS_KEY = key; return; }
    if (CARDS_KEY === key) return;              // 已經是這個人的了，不用再查
    CARDS_KEY = key; CARDS = []; CARDS_BUSY = true;
    DB.from('staff_pickable_plans')
      .select('plan_id,product,headcount,total_credits,remaining,per_credit,basis_status,label')
      .eq('customer_id', F.customer.id)
      .eq('product', isPT(F.type) ? 'PT' : 'PGT')
      .order('opened_at')
      .then(function (r) {
        CARDS_BUSY = false;
        // ☢️ 回來的時候人可能已經換掉了。不比對 key 就會把別人的卡畫上去。
        if (CARDS_KEY !== key) return;
        CARDS = (r.error ? [] : (r.data || []));
        // 剛好一張就先幫他選起來 —— 資料庫仍然要求明確指定，
        // 這裡只是省掉一次沒有資訊量的點擊。
        if (CARDS.length === 1) F.plan_id = CARDS[0].plan_id;
        render();
      }, function () { CARDS_BUSY = false; });
  }

  function cardBlock() {
    if (!isCourse(F.type) || F.charge !== 'plan') return '';
    if (!F.customer) {
      return '<div class="f"><label>從哪一張卡扣</label>' +
        '<div class="hint">先選客人，才知道他有哪幾張卡。</div></div>';
    }
    if (CARDS_BUSY) {
      return '<div class="f"><label>從哪一張卡扣</label>' +
        '<div class="hint">正在查他的卡…</div></div>';
    }
    if (!CARDS.length) {
      // ☢️ 這是【現況】不是錯誤：私人課的期初餘額還沒匯進來，全店 0 張卡。
      //    這時候擋下來等於今天就把服務登記整個弄壞。
      return '<div class="f"><label>從哪一張卡扣</label>' +
        '<div class="hint warn">☢️ 這位客人在系統裡<b>一張卡都沒有</b>，' +
        '所以這一筆<b>不會扣到任何堂數</b>。<br>' +
        '照樣登記得起來（業績、抽成都算），它會進「待補扣」清單，' +
        '等私人課的期初餘額匯進來之後再回頭補。</div></div>';
    }
    var pills = CARDS.map(function (c) {
      var bad = (c.headcount != null && F.headcount != null && c.headcount !== F.headcount);
      return '<button type="button" class="pill' + (F.plan_id === c.plan_id ? ' on' : '') +
        '" data-card="' + esc(c.plan_id) + '"' + (bad ? ' disabled' : '') + '>' +
        esc(c.label) + (bad ? '（人數不符）' : '') + '</button>';
    }).join('');
    return '<div class="f"><label>從哪一張卡扣</label><div class="pills">' + pills + '</div>' +
      '<div class="hint">☢️ 一張卡扣<b>一堂</b>。' +
      '人數不符的卡按不下去 —— 一對一和一對二每堂價值不一樣，不能互扣。</div></div>';
  }

  function planBlock() {
    if (!isCourse(F.type)) return '';
    var pool = (isPT(F.type) ? PRICES.PT : PRICES.PGT).filter(function (p) {
      return p.headcount === F.headcount;
    });
    var opts = '<option value="">（不是檯面方案 —— 自己填業績金額）</option>' +
      pool.map(function (p) {
        return '<option value="' + esc(p.code) + '"' +
          (F.product_code === p.code ? ' selected' : '') + '>' +
          esc(p.label) + '　' + money(p.price) + '</option>';
      }).join('');
    var charge =
      ['single','plan','free'].map(function (k) {
        var lab = k === 'single' ? '單堂現收' : k === 'plan' ? '扣預收' : '體驗／贈課';
        return '<button type="button" class="pill' + (F.charge === k ? ' on' : '') +
               '" data-charge="' + k + '">' + lab + '</button>';
      }).join('');

    var manual = (!F.product_code && F.charge !== 'free')
      ? '<div class="f"><label>這一堂的業績金額</label>' +
        '<input id="fAmount" type="number" min="0" step="1" value="' + esc(F.amount) + '" ' +
        'placeholder="預付方案＝實收總額 ÷ 固定堂數"><div class="hint">' +
        '☢️ 歷史方案與扣預收要填這一格。規則是「該筆已確認實收總額 ÷ 固定堂數」，' +
        '不可以拿現在的檯面價回推。</div></div>'
      : '';

    return '<div class="f"><label>銷課方式</label><div class="pills">' + charge + '</div></div>' +
      '<div class="f"><label>檯面方案</label><select id="fPlan">' + opts + '</select>' +
      (F.charge === 'free' ? '<div class="hint">體驗／贈課不認列課程收入。</div>' : '') +
      '</div>' + manual;
  }

  function coachBlock() {
    var max = F.type === 'EVENT' ? 2 : 1;
    var pills = COACHES.map(function (c) {
      var on = F.coaches.indexOf(c.id) >= 0;
      // ☢️ 只有「最多 2 位」的活動才鎖。單人的類型按另一位＝【換人】，
      //    鎖住的話要先取消原本那位才能改，多一個沒必要的步驟。
      var full = !on && max > 1 && F.coaches.length >= max;
      return '<button type="button" class="pill' + (on ? ' on' : '') +
        '" data-coach="' + esc(c.id) + '"' + (full ? ' disabled' : '') + '>' +
        esc(c.display_name) + '</button>';
    }).join('');
    return '<div class="f"><label>授課教練' + (max > 1 ? '（最多 2 位）' : '') + '</label>' +
      '<div class="pills">' + pills + '</div>' +
      (F.type === 'EVENT'
        ? '<div class="hint">每位教練各拿「計費時數 × 600」，跟派幾位無關。</div>'
        : F.type === 'CORP'
          ? '<div class="hint">企業包班單次至多 1 位主導教練。</div>' : '') +
      '</div>';
  }

  function eventBlock() {
    if (F.type !== 'EVENT') return '';
    return '<div class="two">' +
      '<div class="f"><label>活動時數</label>' +
      '<input id="fHours" type="number" min="0.1" step="0.1" value="' + esc(F.hours) + '" placeholder="例：2.2"></div>' +
      '<div class="f"><label>服務地區</label>' +
      '<input id="fArea" type="text" value="' + esc(F.area) + '" placeholder="例：台北市信義區"></div></div>' +
      '<div class="f"><div class="hint">☢️ 時數<b>無條件進位</b>：0.5→1、1.5→2、2.2→3。' +
      '限大台北地區、限工作室外場。</div></div>';
  }

  function corpBlock() {
    if (F.type !== 'CORP') return '';
    // ☢️ 核准人用【全體職員】，不是授課教練清單 ——
    //    核准跟授課是兩件事，顧問／股東也可能是核准人。
    var apr = '<option value="">（選核准人）</option>' + STAFF.map(function (c) {
      return '<option value="' + esc(c.id) + '"' +
        (F.approver_id === c.id ? ' selected' : '') + '>' + esc(c.display_name) + '</option>';
    }).join('');
    // 地區決定費率（正式補全版第二篇 4）。費率從 products 讀，不寫死。
    var kinds = [['TPE','大台北地區'], ['OUT','非大台北地區']];
    var areaPills = kinds.map(function (k) {
      var rate = priceOf('CORP-' + k[0]);
      return '<button type="button" class="pill' + (F.area_kind === k[0] ? ' on' : '') +
        '" data-akind="' + k[0] + '">' + k[1] +
        (rate ? '　' + money(rate) + '／小時' : '') + '</button>';
    }).join('');

    return '<div class="two">' +
        '<div class="f"><label>公司名稱</label><input id="fCompany" type="text" value="' + esc(F.company) + '"></div>' +
        '<div class="f"><label>統一編號</label><input id="fTax" type="text" value="' + esc(F.tax_id) + '"></div>' +
      '</div>' +
      '<div class="f"><label>服務地區</label><div class="pills">' + areaPills + '</div>' +
        '<div class="hint">每小時費用<b>已含交通費</b>，不會再另外加 500。</div></div>' +
      '<div class="two">' +
        '<div class="f"><label>服務時數</label>' +
          '<input id="fHours" type="number" min="0.5" step="0.5" value="' + esc(F.hours) + '"></div>' +
        '<div class="f"><label>開班人數</label>' +
          '<input id="fCorpHead" type="number" min="7" step="1" value="' + esc(F.corpHead) + '" placeholder="7 人以上"></div>' +
      '</div>' +
      '<div class="f"><label>地點（哪裡，選填）</label><input id="fArea" type="text" value="' + esc(F.area) + '" placeholder="例：內湖科學園區 ○○ 大樓"></div>' +
      '<div class="f"><label>專案內容</label><textarea id="fScope">' + esc(F.scope) + '</textarea></div>' +
      '<div class="f"><label>交通安排</label><input id="fTransport" type="text" value="' + esc(F.transport) + '"></div>' +
      '<div class="two">' +
        '<div class="f"><label>核准人（選填）</label><select id="fApprover">' + apr + '</select></div>' +
        '<div class="f"><label>核准日期（選填）</label><input id="fApprovedOn" type="date" value="' + esc(F.approved_on) + '"></div>' +
      '</div>' +
      '<div class="f"><div class="hint">☢️ 企業包班<b>不套用 PT／PGT 人數規格</b>，<b>7 人（含）以上開班、人數不限</b>。' +
      '時數<b>不進位</b> —— 無條件進位是諧動外派活動的規則，這裡沒有。</div></div>';
  }

  function calcBlock() {
    var c = calc();
    var lines = '';
    if (F.type === 'EVENT') {
      var n = F.coaches.length || 0;
      lines =
        '<div class="cl"><span class="k">計費時數（進位後）</span><span class="v">' +
          (c.hours || 0) + ' 小時</span></div>' +
        '<div class="cl"><span class="k">教練費（' + n + ' 位 × ' + (c.hours||0) + ' 小時 × 600）</span>' +
          '<span class="v">' + money(n * (c.hours||0) * 600) + '</span></div>' +
        '<div class="cl"><span class="k">活動費（' + (c.hours||0) + ' 小時 × 600）</span>' +
          '<span class="v">' + money((c.hours||0) * 600) + '</span></div>' +
        '<div class="cl"><span class="k">交通費</span><span class="v">' + money(c.travel) + '</span></div>' +
        '<div class="cl tot"><span class="k">客人付</span><span class="v">' + money(c.total) + '</span></div>' +
        '<div class="cl perf"><span class="k">每位教練鐘點</span><span class="v">' +
          money(c.coachPay) + '</span></div>' +
        '<div class="cl"><span class="k">進 PT＋PGT 抽成</span><span class="v">不進（走鐘點費）</span></div>';
    } else if (F.type === 'CORP') {
      lines =
        '<div class="cl"><span class="k">每小時費用（含交通費）</span><span class="v">' +
          (corpRate() ? money(corpRate()) : '（先選地區）') + '</span></div>' +
        '<div class="cl"><span class="k">服務時數</span><span class="v">' +
          (Number(F.hours || 0) || 0) + ' 小時</span></div>' +
        '<div class="cl tot"><span class="k">客人付</span><span class="v">' + money(c.total) + '</span></div>' +
        '<div class="cl perf"><span class="k">進這位教練的 PT＋PGT 業績</span><span class="v">' +
          money(c.perf) + '</span></div>';
    } else {
      lines =
        '<div class="cl"><span class="k">課程費</span><span class="v">' + money(c.rev) + '</span></div>' +
        (c.travel ? '<div class="cl"><span class="k">交通費（外派固定）</span><span class="v">' +
          money(c.travel) + '</span></div>' : '') +
        '<div class="cl tot"><span class="k">客人付</span><span class="v">' + money(c.total) + '</span></div>' +
        '<div class="cl perf"><span class="k">進這位教練的 PT＋PGT 業績</span><span class="v">' +
          money(c.perf) + '</span></div>';
    }
    return '<div class="calc">' + lines + '</div>' +
      '<div class="note">☢️ 這是畫面上的試算。<b>送出後以資料庫算的為準</b> —— 存進去的金額由資料庫決定。</div>';
  }

  /* 還缺什麼才能送。
     ☢️ 這【不是】驗證 —— 真正的規則在資料庫的 add_service()，
        就算跳過這一段，資料庫照樣會擋。這裡只是不要讓人白按一次。 */
  function missing() {
    if (!F.coaches.length) return '要選授課教練';
    if (isCourse(F.type)) {
      if (!F.customer) return '要選客人';
      if (!F.product_code && F.charge !== 'free' && !Number(F.amount || 0))
        return '要選檯面方案，或自己填業績金額';
      // ☢️ 有卡卻不選是最危險的一種：登記得起來，但客人的堂數永遠不會減。
      //    資料庫也會擋（why=pick_plan），這裡只是不要讓人白按一次。
      if (F.charge === 'plan' && CARDS.length && !F.plan_id) return '要選從哪一張卡扣';
    }
    if (F.type === 'EVENT' && !(Number(F.hours || 0) > 0)) return '要填活動時數';
    if (F.type === 'CORP') {
      if (!F.area_kind) return '要選服務地區';
      if (!(Number(F.hours || 0) > 0)) return '要填服務時數';
      if (!(Number(F.corpHead || 0) >= 7)) return '企業包班要 7 人以上';
    }
    return '';
  }

  function formBlock() {
    return '<div class="h">' + typeName(F.type) + '</div><div class="card">' +
      '<div class="f"><label>完成日期與時間</label>' +
      '<input id="fDone" type="datetime-local" value="' + esc(F.done || nowLocal()) + '">' +
      '<div class="hint">☢️ 這一欄決定薪資算在哪個月，不看收款日。填「已經上完」的時間。</div></div>' +
      customerBlock() + headBlock() + planBlock() + cardBlock() +
      eventBlock() + corpBlock() + coachBlock() +
      (isCourse(F.type)
        ? '<div class="f"><label>當日實際出席人數</label>' +
          '<input id="fAtt" type="number" min="0" step="1" value="' + esc(F.attended) + '" ' +
          'placeholder="沒到齊就填實際人數"></div>' : '') +
      '<div class="f"><label>原始備註</label><textarea id="fNote" placeholder="現場狀況、特殊情形…">' +
        esc(F.note) + '</textarea></div>' +
      calcBlock() +
      '<button type="button" class="btn" id="save" style="margin-top:12px"' +
        (missing() ? ' disabled' : '') + '>' + (missing() || '登記這一筆') + '</button>' +
    '</div>';
  }

  function rowHtml(x) {
    var fin = x.fin_status === 'final';
    return '<div class="row' + (x.voided ? ' void' : '') + '">' +
      '<div class="r1"><span class="nm">' + esc(typeName(x.service_type)) + '</span>' +
        '<span class="tag ' + (fin ? 'fin' : 'pen') + '">' +
          (fin ? '已認列' : '待確認') + '</span>' +
        (x.voided ? '<span class="tag">已作廢</span>' : '') +
        '<span class="amt">' + money(x.total_amount) + '</span></div>' +
      '<div class="r2">' + esc(x.done_date) + ' ' + esc(x.done_time) +
        '　·　' + esc(x.coach_names || '—') +
        (x.customer_name ? '　·　' + esc(x.customer_name) : '') +
        (x.company_name ? '　·　' + esc(x.company_name) : '') +
        (x.billed_hours ? '　·　' + x.billed_hours + ' 小時' : '') +
        (x.headcount ? '　·　' + x.headcount + ' 人' : '') +
        '　·　業績 ' + money(x.perf_amount) +
        '　·　' + esc(x.created_by_name || '') + ' 登的' +
        (x.voided && x.void_reason ? '<br>作廢原因：' + esc(x.void_reason) : '') +
        // 待確認的那幾筆一定要看得到「為什麼待確認」—— 那就是要你決定的東西
        (x.fin_status !== 'final' && !x.voided && x.note ? '<br>' + esc(x.note) : '') +
        (x.fin_status !== 'final' && !x.voided && x.manual_note ? '<br>' + esc(x.manual_note) : '') +
      '</div>' +
      payLine(x) +
      (PAYOPEN === x.id ? payBox(x) : '') +
      (AMTOPEN === x.id ? amtBox(x) : '') +
      (ME && ME.can_finance
        ? (x.voided
            // ☢️ 作廢在畫面上原本是【單行道】。2026-08-21 真的被誤按了一次
            //    （原因欄填「爽」），只能進資料庫改 —— 所以補這一顆。
            //    它一樣要寫原因，而且作廢的歷史不會被抹掉。
            ? '<div class="r3"><button type="button" data-undo="' + esc(x.id) + '">還原</button></div>'
            : '<div class="r3">' +
              // ☢️ 業績 0 的不能一鍵認列 —— 0 表示【這一堂不會進任何人的薪資】。
              //    2026-08-22 踩過：8/21 有一筆流水帳金額欄空白，匯進來就是 0，
              //    而畫面上按「最終認列」【沒有地方可以填金額】，
              //    所以只能認列成 0（安靜地少發薪水）或者不認列。兩條都是錯的。
              (fin ? ''
                   : (Number(x.perf_amount) > 0
                      ? '<button type="button" class="go" data-fin="' + esc(x.id) + '">最終認列</button>'
                      : '<button type="button" class="go" data-amt="' + esc(x.id) + '">填金額後認列</button>')) +
              // 已經認列的還是要能改 —— 改完會留一列在異動紀錄裡，而且
              // ☢️ 已經月結的月份改不動（要先重開），那是月結存在的理由。
              (fin ? '<button type="button" data-amt="' + esc(x.id) + '">改金額</button>' : '') +
              '<button type="button" data-void="' + esc(x.id) + '">作廢</button>' +
              (PAYOPEN === x.id ? '' : '<button type="button" data-pay="' + esc(x.id) + '">記收款</button>') +
              '</div>')
        : '') +
    '</div>';
  }

  /* ══ 補金額 / 改金額（第 94 步收尾）════════════════════════════
     ☢️ 還沒認列的走 finalize_service(p_perf)：填完金額直接認列，一步到位。
        已經認列的走 set_service_perf()：要寫原因，而且會留一列異動紀錄。
     ☢️ 兩條路都【不能繞過月結】—— 已經結算的月份改不動，
        要改就先重開。那是月結存在的理由。 */
  function amtBox(x) {
    var fin = x.fin_status === 'final';
    return '<div class="amt-f">' +
      '<div class="amt-hd">' + (fin ? '改金額' : '填金額後認列') + '</div>' +
      (Number(x.perf_amount) > 0 ? '' :
        '<div class="amt-warn">☢️ 這一筆的業績是 <b>0</b> —— 匯進來的時候原始資料就沒有金額。' +
        '認列成 0 的話，這一堂<b>不會進任何人的薪資</b>。</div>') +
      '<div><label>業績金額</label>' +
        '<input type="number" id="amtP" inputmode="numeric" min="0" value="' +
          esc(Number(x.perf_amount) || '') + '" placeholder="例：1500"></div>' +
      '<div><label>收入金額（留白＝不動）</label>' +
        '<input type="number" id="amtR" inputmode="numeric" min="0" value="' +
          esc(Number(x.revenue_amount) || '') + '"></div>' +
      (fin ? '<div><label>為什麼要改</label>' +
             '<input type="text" id="amtW" placeholder="例：流水帳金額欄空白，同卡前兩堂都是 1500"></div>' +
             '<div class="note">☢️ 這會動到教練的薪水。原因會跟舊金額一起留在異動紀錄裡，' +
             '三個月後查得出來。</div>'
           : '<div class="note">填完會<b>直接認列</b>這一筆。</div>') +
      '<button type="button" class="amt-go" data-amtgo="' + esc(x.id) + '">' +
        (fin ? '存起來' : '填好了，認列') + '</button>' +
      '<button type="button" class="amt-no" data-amtno="1">取消</button>' +
    '</div>';
  }

  function doAmt(id) {
    if (AMTBUSY) return;
    var row = null;
    PEND.concat(LIST).forEach(function (r) { if (r.id === id && !row) row = r; });
    var fin = row && row.fin_status === 'final';
    var p = parseInt((document.getElementById('amtP') || {}).value, 10);
    var rv = (document.getElementById('amtR') || {}).value;
    var w = ((document.getElementById('amtW') || {}).value || '').trim();
    if (!(p >= 0)) { toast('業績金額要填', true); return; }
    if (fin && w.length < 4) { toast('改已認列的要寫原因，至少四個字', true); return; }
    AMTBUSY = true;
    var call = fin
      ? DB.rpc('set_service_perf', { p_id: id, p_perf: p,
          p_revenue: rv === '' ? null : parseInt(rv, 10), p_why: w })
      : DB.rpc('finalize_service', { p_id: id, p_note: null, p_perf: p });
    call.then(function (r) {
      AMTBUSY = false;
      if (r.error) throw new Error(r.error.message);
      // ☢️ RPC 成功不等於做成功 —— 回 {ok:false} 是【規則擋下來】，不是錯誤。
      if (r.data && r.data.ok === false) { toast(r.data.msg || '做不了', true); return; }
      AMTOPEN = null;
      toast(fin ? '金額已更新' : '已填金額並認列');
      return load();
    }).catch(function (e) {
      AMTBUSY = false; toast(String(e && e.message || e), true);
    });
  }

  /* ══ 收款（第 90 步）════════════════════════════════════════════
     ☢️ 「該付」對扣預收和體驗課是 0 —— 錢不是在這一堂收的，
        是購課的時候就收了。硬要在這裡再記一次，收入會被算兩遍。
     ☢️ 一筆可以有多個付款人：Usports 那種「客人付 14,500、政府付 500」。 */
  function payLine(x) {
    var p = PAYS[x.id];
    if (!p) return '';
    var gap = p.due_amount - p.paid_amount;
    var bits = [];
    if (p.due_amount > 0) bits.push('該付 ' + money(p.due_amount));
    if (p.paid_amount > 0) bits.push('已記 ' + money(p.paid_amount));
    if (p.pending_amount > 0) bits.push('<b>待入帳 ' + money(p.pending_amount) + '</b>');
    var tag = gap > 0 ? '<span class="paytag no">還差 ' + money(gap) + '</span>'
            : p.pending_amount > 0 ? '<span class="paytag wait">錢還沒到</span>'
            : p.paid_amount > 0 ? '<span class="paytag ok">已收齊</span>' : '';
    if (!bits.length && !tag) {
      if (x.charge_method === 'plan') return '<div class="r2 paydim">預收扣抵 —— 這一堂不在現場收錢</div>';
      if (x.charge_method === 'free') return '<div class="r2 paydim">體驗／贈課 —— 不收費</div>';
      return '';
    }
    return '<div class="r2">' + bits.join('　·　') + (bits.length && tag ? '　' : '') + tag + '</div>';
  }

  function payBox(x) {
    var p = PAYS[x.id] || { due_amount:0, paid_amount:0 };
    var gap = Math.max(0, p.due_amount - p.paid_amount);
    var ms = [['cash','現金'], ['transfer','匯款'], ['subsidy','補助'], ['other','其他']];
    return '<div class="paybox">' +
      '<div class="f"><label>收款方式</label><div class="pills">' +
        ms.map(function (m) {
          return '<button type="button" class="pill' + (PAYF.method === m[0] ? ' on' : '') +
            '" data-paym="' + m[0] + '">' + m[1] + '</button>';
        }).join('') + '</div></div>' +
      '<div class="row2">' +
        '<div class="f"><label>金額</label><input id="payAmt" type="number" min="1" step="1" ' +
          'value="' + esc(PAYF.amount !== '' ? PAYF.amount : (gap || '')) + '"></div>' +
        '<div class="f"><label>到帳了嗎</label><div class="pills">' +
          '<button type="button" class="pill' + (PAYF.paid ? ' on' : '') + '" data-payin="1">已到帳</button>' +
          '<button type="button" class="pill' + (!PAYF.paid ? ' on' : '') + '" data-payin="0">還沒</button>' +
        '</div></div>' +
      '</div>' +
      (PAYF.method === 'subsidy'
        ? '<div class="f"><label>付款人</label><input id="payWho" type="text" ' +
          'value="' + esc(PAYF.payer) + '" placeholder="例：Usports">' +
          '<div class="hint">☢️ 補助一定要寫是誰付的 —— 不然不知道這筆錢要跟誰要。</div></div>' : '') +
      (p.due_amount === 0
        ? '<div class="f"><label>原因（必填）</label><input id="payNote" type="text" ' +
          'value="' + esc(PAYF.note) + '" placeholder="例：上次付款未找零，這次補收">' +
          '<div class="hint">☢️ 這一堂是扣預收或體驗課，錢應該在購課時就收了。要記收款請寫原因。</div></div>'
        : '<div class="f"><label>備註（選填）</label><input id="payNote" type="text" value="' + esc(PAYF.note) + '"></div>') +
      '<div class="acts">' +
        '<button type="button" data-paycancel="1">取消</button>' +
        '<button type="button" class="go" data-paygo="' + esc(x.id) + '">記下這筆收款</button>' +
      '</div></div>';
  }

  // ☢️ 按方式或到帳的 pill 會整頁重畫 —— 不先把輸入框的值收起來，
  //    使用者剛打好的金額和備註會憑空消失。（第 48 步同一個坑）
  function keepPayInputs() {
    var a = document.getElementById('payAmt');
    var w = document.getElementById('payWho');
    var n = document.getElementById('payNote');
    if (a) PAYF.amount = a.value;
    if (w) PAYF.payer = w.value;
    if (n) PAYF.note = n.value;
  }

  function openPay(id) {
    PAYOPEN = id;
    var p = PAYS[id] || { due_amount:0, paid_amount:0 };
    PAYF = { method:'cash', amount:'', paid:true, payer:'', note:'' };
    render();
    var a = document.getElementById('payAmt'); if (a) a.focus();
  }

  function submitPay(id) {
    if (PAYBUSY) return;
    var amt = Number((document.getElementById('payAmt') || {}).value || 0);
    var who = ((document.getElementById('payWho') || {}).value || '').trim();
    var nt  = ((document.getElementById('payNote') || {}).value || '').trim();
    if (!(amt > 0)) { toast('金額要大於 0', true); return; }
    PAYBUSY = true;
    DB.rpc('add_service_payment', { p_service:id, p_method:PAYF.method, p_amount:Math.round(amt),
                                    p_paid:!!PAYF.paid, p_payer:who || null, p_note:nt || null })
      .then(function (r) {
        PAYBUSY = false;
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (d.ok === false) throw new Error(d.msg || d.why || '記不起來');
        PAYOPEN = null;
        toast(d.gap > 0 ? ('記好了，還差 ' + money(d.gap)) : '記好了，這筆收齊了');
        return load();
      })
      .catch(function (e) { PAYBUSY = false; toast(String(e && e.message || e), true); });
  }

  /* 還沒收齊專區。☢️ 跟「待確認」同一個道理：
     被 20 筆上限藏起來的錢，等於沒有人會去收。 */
  function unpaidBlock() {
    if (!UNPAID.length) return '';
    var sum = UNPAID.reduce(function (a, x) {
      var p = PAYS[x.id] || {};
      return a + Math.max(0, (p.due_amount || 0) - (p.paid_amount || 0)) + (p.pending_amount || 0);
    }, 0);
    return '<div class="h pay">還沒收齊（' + UNPAID.length + '）· 合計 ' + money(sum) + '</div>' +
      '<div class="card pay">' + UNPAID.map(rowHtml).join('') +
      '<div class="note">☢️ 這一區<b>不受「最近 20 筆」限制</b> —— 錢被清單長度藏起來，就等於沒有人會去收。</div></div>';
  }

  /* 待確認專區。
     ☢️ 2026-08-21 匯入 231 筆之後才發現的洞：清單只抓 20 筆，
        那一筆待確認的排在第 100 多名，畫面上<b>根本找不到</b>——
        而找不到就等於那筆錢永遠不會進薪資。所以待確認自己一區、不設上限。 */
  function pendBlock() {
    if (!PEND.length) return '';
    return '<div class="h pend">待確認（' + PEND.length + '）· 還沒進薪資</div>' +
      '<div class="card pend">' + finMonthBar() + PEND.map(rowHtml).join('') +
      '<div class="note">☢️ 這些<b>沒有</b>算進任何人的薪資。按「最終認列」才會進去。</div></div>';
  }

  /* ══ 整月認列（第 94 步）══════════════════════════════════════════
     ☢️ 這不是「全部照准」。業績金額是 0 的那幾筆會【留下來不動】，
        而且列出來 —— 那幾筆要一筆一筆看，那才是財務該花時間的地方。
        做成一顆「全部認列」的鍵，最終認列就變成蓋章，而月結整套機制
        正好是靠那個檢查才有意義的。
     ☢️ 一定要先「看看會做什麼」再做。認列之後薪資就跟著變，沒有一鍵還原。
     ☢️ 這一支是【按月】的，上面那張待確認清單是【全部】的。
        不是同一個範圍 —— 所以要把「有幾筆不在這個月」寫出來，
        否則看起來像「按下去就全部清空」。 */
  function finMonthBar() {
    if (!(ME && ME.can_finance)) return '';
    var m = FMM || twMonth();
    var out = PEND.filter(function (x) {
      return String(x.done_date || '').slice(0, 7) !== m;
    }).length;
    var r = FMR;
    return '<div class="fm-bar">' +
      '<span>整月一次認列</span>' +
      '<input type="month" id="fmM" value="' + esc(m) + '" max="' + esc(twMonth()) + '">' +
      '<button type="button" class="fm-see" id="fmSee"' + (FMBUSY ? ' disabled' : '') + '>' +
        (FMBUSY ? '處理中…' : '先看看') + '</button>' +
      (out ? '<div class="fm-r">☢️ 上面 ' + PEND.length + ' 筆裡有 <b>' + out +
             '</b> 筆不在 ' + esc(m) + ' —— <b>這個動作不會碰到它們</b>。</div>' : '') +
      (r ? '<div class="fm-r">' + esc(r.ym) + '：<b>' + esc(r.msg) + '</b>' +
           (r.n_no_draw ? '　（其中 ' + r.n_no_draw + ' 筆是「扣預收但還沒扣到卡」——' +
             '那是堂數的問題不是錢的問題，會一起認列）' : '') + '</div>' +
           (r.skipped || []).map(function (x) {
             return '<div class="fm-left"><b>留下不動：' + esc(x.when) + '　' +
               esc(x.coach) + '　' + esc(x.what) + '</b>' + esc(x.why) + '</div>';
           }).join('') +
           // ☢️ 只有「先看看」的結果才長出這顆鍵。做完之後那份結果的 n_done
           //    還是 24，不擋的話畫面會再邀你按一次同一顆鍵。
           (r.dry_run && r.n_done > 0
             ? '<button type="button" class="fm-go" id="fmGo"' + (FMBUSY ? ' disabled' : '') +
               '>確定認列這 ' + r.n_done + ' 筆</button>'
             : '')
         : '') +
      '<div class="note" style="margin-top:0">「先看看」<b>不會動到任何資料</b>。' +
      '☢️ 認列之後薪資就跟著變，<b>沒有一鍵還原</b>（要一筆一筆作廢重登）。</div>' +
    '</div>';
  }

  /* ☢️ 兩趟都叫同一支函式，差別只在 dry_run。分成兩支的話
        「先看看說 24 筆、真的做卻做了 25 筆」這種事查不出來。 */
  function finMonth(dry) {
    if (FMBUSY) return;
    var m = (document.getElementById('fmM') || {}).value || FMM || twMonth();
    FMM = m;
    if (!dry) {
      if (!FMR || !FMR.n_done) { toast('先按「先看看」', true); return; }
      if (!window.confirm(m + ' 要認列 ' + FMR.n_done + ' 筆。\n' +
            '認列之後薪資會跟著變，而且沒有一鍵還原。確定嗎？')) return;
    }
    FMBUSY = true; render();
    DB.rpc('finalize_month', { p_ym: m + '-01', p_dry_run: dry })
      .then(function (res) {
        FMBUSY = false;
        if (res.error) throw new Error(res.error.message);
        if (!res.data) throw new Error('回來的是空的');
        FMR = res.data;
        if (!dry) { toast(FMR.msg); return load(); }
        render();
      })
      .catch(function (e) {
        FMBUSY = false; FMR = null; render();
        toast(String(e && e.message || e), true);
      });
  }

  function listBlock() {
    var err = LOAD_ERR ? '<div class="loaderr">☢️ 清單讀取失敗：' + esc(LOAD_ERR) +
              '<br>畫面上的「沒有紀錄」<b>不代表真的沒有</b>，先把這句話截給工程師。</div>' : '';
    if (!LIST.length) {
      return '<div class="h">最近登記</div><div class="card">' +
             (err || '<div class="empty">還沒有任何服務紀錄</div>') + '</div>';
    }
    return '<div class="h">最近登記（最近 ' + LIST.length + ' 筆）</div><div class="card">' +
      LIST.map(rowHtml).join('') + err +
      '<div class="note">☢️「最終認列」只有財務按得動。沒有認列的紀錄<b>不會進薪資</b>。<br>' +
      '這一區只列<b>最近 20 筆</b>（照上課時間排，新的在上面）—— 要找更早的請用對帳報表。</div></div>';
  }

  function render() {
    elGate.hidden = true; elMain.hidden = false;
    elMain.innerHTML = typeBlock() + formBlock() + unpaidBlock() + pendBlock() + listBlock();
    wire();
    // ☢️ 放在 render 之後：查卡片是非同步的，查回來會再 render() 一次。
    //    放在前面的話那一次 render 會被這一次蓋掉。
    //    loadCards() 自己會擋掉重複查詢（比對 CARDS_KEY），不會迴圈。
    loadCards();
  }

  /* ══ 綁事件 ══════════════════════════════════════════════════ */
  function on(id, ev, fn) { var e = document.getElementById(id); if (e) e[ev] = fn; }
  function each(sel, fn) {
    Array.prototype.forEach.call(elMain.querySelectorAll(sel), fn);
  }

  /* 只重畫試算和送出鍵。
     ☢️ 不能整頁 render() —— 那會把游標踢走、輸入到一半的字消失。
        會改變版面的欄位（類型、人數、銷課方式、教練、方案）才 render()。 */
  function refreshCalc() {
    var box = document.querySelector('.calc');
    if (box) box.outerHTML = calcBlock().split('<div class="note">')[0];
    var b = document.getElementById('save');
    if (b) {
      var m = missing();
      b.disabled = !!m;
      b.textContent = m || '登記這一筆';
    }
  }

  function wire() {
    each('[data-ty]', function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-ty');
        if (k === F.type) return;
        F.type = k;
        F.headcount = isPT(k) ? 1 : isPGT(k) ? 3 : F.headcount;
        F.product_code = '';
        F.plan_id = '';            // PT 的卡不能拿去扣 PGT 的課
        F.coaches = F.coaches.slice(0, k === 'EVENT' ? 2 : 1);
        render();
      };
    });
    each('[data-head]', function (b) {
      b.onclick = function () {
        F.headcount = Number(b.getAttribute('data-head'));
        F.product_code = '';       // 換人數就換方案，舊的代號不再適用
        // ☢️ 也要把卡清掉。一對一改成一對二之後，原本選的那張卡人數就不符了，
        //    留著的話會送出一個資料庫一定會擋的組合。
        F.plan_id = '';
        render();
      };
    });
    each('[data-charge]', function (b) {
      b.onclick = function () {
        F.charge = b.getAttribute('data-charge');
        if (F.charge !== 'plan') F.plan_id = '';
        render();
      };
    });
    each('[data-card]', function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-card');
        F.plan_id = (F.plan_id === id) ? '' : id;   // 再按一次取消
        render();
      };
    });
    each('[data-coach]', function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-coach'), i = F.coaches.indexOf(id);
        var max = F.type === 'EVENT' ? 2 : 1;
        if (i >= 0) F.coaches.splice(i, 1);
        else { if (F.coaches.length >= max) F.coaches.shift(); F.coaches.push(id); }
        render();
      };
    });

    on('fPlan', 'onchange', function (e) { F.product_code = e.target.value; render(); });
    on('fDone', 'onchange', function (e) { F.done = e.target.value; });

    // ☢️ 這幾格【不重畫】—— 重畫會把游標踢走、輸入到一半的字消失。
    //    只有會改變版面的欄位（類型、人數、銷課方式、教練、方案）才 render()。
    var live = { fAmount:'amount', fHours:'hours', fArea:'area', fNote:'note',
                 fAtt:'attended', fCompany:'company', fTax:'tax_id',
                 fCorpHead:'corpHead',
                 fScope:'scope', fTransport:'transport', fApprovedOn:'approved_on' };
    Object.keys(live).forEach(function (id) {
      on(id, 'oninput', function (e) {
        F[live[id]] = e.target.value;
        refreshCalc();
      });
    });
    on('fApprover', 'onchange', function (e) { F.approver_id = e.target.value; refreshCalc(); });
    // 地區換了費率就換，整塊重畫（費率會顯示在按鈕上）
    each('[data-akind]', function (b) {
      b.onclick = function () { F.area_kind = b.getAttribute('data-akind'); render(); };
    });

    on('unpick', 'onclick', function () { F.customer = null; F.plan_id = ''; render(); });
    var q = document.getElementById('q');
    if (q) {
      var timer;
      q.oninput = function () {
        clearTimeout(timer);
        var v = q.value.trim();
        if (v.length < 1) { document.getElementById('hits').innerHTML = ''; return; }
        timer = setTimeout(function () { search(v); }, 260);
      };
    }

    on('save', 'onclick', save);

    each('[data-fin]', function (b) {
      b.onclick = function () { finalize(b.getAttribute('data-fin')); };
    });
    each('[data-void]', function (b) {
      b.onclick = function () { voidOne(b.getAttribute('data-void')); };
    });

    // ── 整月認列（第 94 步）──────────────────────────────
    var fmM = document.getElementById('fmM');
    if (fmM) fmM.onchange = function () {
      FMM = fmM.value;
      FMR = null;      // ☢️ 換月份一定要清掉舊結果 —— 不清的話畫面會拿
      render();        //    八月的「確定認列 24 筆」去做九月。
    };
    on('fmSee', 'onclick', function () { finMonth(true); });
    on('fmGo',  'onclick', function () { finMonth(false); });
    each('[data-undo]', function (b) {
      b.onclick = function () { restoreOne(b.getAttribute('data-undo')); };
    });
    each('[data-amt]', function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-amt');
        AMTOPEN = (AMTOPEN === id) ? null : id;
        render();
      };
    });
    each('[data-amtno]', function (b) {
      b.onclick = function () { AMTOPEN = null; render(); };
    });
    each('[data-amtgo]', function (b) {
      b.onclick = function () { doAmt(b.getAttribute('data-amtgo')); };
    });
    each('[data-pay]', function (b) {
      b.onclick = function () { openPay(b.getAttribute('data-pay')); };
    });
    each('[data-paym]', function (b) {
      b.onclick = function () { keepPayInputs(); PAYF.method = b.getAttribute('data-paym'); render(); };
    });
    each('[data-payin]', function (b) {
      b.onclick = function () { keepPayInputs(); PAYF.paid = b.getAttribute('data-payin') === '1'; render(); };
    });
    each('[data-paycancel]', function (b) {
      b.onclick = function () { PAYOPEN = null; render(); };
    });
    each('[data-paygo]', function (b) {
      b.onclick = function () { submitPay(b.getAttribute('data-paygo')); };
    });
  }

  /* ══ 客人搜尋 ══════════════════════════════════════════════════
     ☢️ 姓名和暱稱各查一次再合併，不用 or() —— 名字裡有逗號或括號會把網址拆壞
        （跟 staff-tools.html 同一個理由）。 */
  function search(v) {
    var hits = document.getElementById('hits');
    if (!hits) return;
    var digits = /^\d+$/.test(v);
    var COLS = 'id,name,nickname,phone_tail,balance,is_active';
    var qy = digits
      ? DB.from('staff_customers').select(COLS).limit(8).like('phone', '%' + v)
      : Promise.all([
          DB.from('staff_customers').select(COLS).limit(8).ilike('name', '%' + v + '%'),
          DB.from('staff_customers').select(COLS).limit(8).ilike('nickname', '%' + v + '%')
        ]).then(function (rs) {
          var bad = rs.filter(function (r) { return r.error; })[0];
          if (bad) return { error: bad.error, data: null };
          var seen = {}, out = [];
          rs.forEach(function (r) {
            (r.data || []).forEach(function (c) {
              if (seen[c.id]) return; seen[c.id] = 1; out.push(c);
            });
          });
          return { error: null, data: out.slice(0, 8) };
        });

    qy.then(function (r) {
      if (r.error) { hits.innerHTML = '<div class="empty">查不動：' + esc(r.error.message) + '</div>'; return; }
      var d = r.data || [];
      if (!d.length) { hits.innerHTML = '<div class="empty">沒有這個人</div>'; return; }
      hits.innerHTML = d.map(function (c) {
        return '<div class="hit" data-pick="' + esc(c.id) + '" data-name="' + esc(c.name) +
          '" data-tail="' + esc(c.phone_tail || '') + '">' +
          '<span class="nm">' + esc(c.name) + '</span>' +
          '<span class="tl">' + esc(c.phone_tail || '') + '</span>' +
          '<span class="bl">GT 剩 ' + (c.balance == null ? '—' : c.balance) + ' 堂</span></div>';
      }).join('');
      Array.prototype.forEach.call(hits.querySelectorAll('[data-pick]'), function (el) {
        el.onclick = function () {
          F.customer = { id: el.getAttribute('data-pick'),
                         name: el.getAttribute('data-name'),
                         phone_tail: el.getAttribute('data-tail') };
          F.plan_id = '';          // 換人就換卡
          render();
        };
      });
    }, function (e) {
      hits.innerHTML = '<div class="empty">查不動：' + esc(e && e.message || e) + '</div>';
    });
  }

  /* ══ 送出 ══════════════════════════════════════════════════════ */
  function save() {
    if (BUSY) return;
    var btn = document.getElementById('save');
    var done = (document.getElementById('fDone') || {}).value || F.done;
    if (!done) { toast('要填完成日期與時間', true); return; }

    var payload = {
      service_type: F.type,
      done_at: done + ':00+08:00',
      coach_ids: F.coaches,
      charge_method: isCourse(F.type) ? F.charge : 'single',
      note: F.note
    };
    if (isCourse(F.type)) {
      payload.customer_id    = F.customer ? F.customer.id : '';
      payload.headcount      = F.headcount;
      payload.attended_count = F.attended;
      payload.product_code   = F.product_code;
      payload.revenue_amount = F.amount;
      payload.plan_id        = (F.charge === 'plan') ? F.plan_id : '';
    } else if (F.type === 'EVENT') {
      payload.hours = F.hours;
      payload.area  = F.area;
    } else {
      // 企業包班：只送【原始輸入】，金額由資料庫用 地區 × 時數 算
      payload.area_kind    = F.area_kind;
      payload.hours        = F.hours;
      payload.headcount    = F.corpHead;
      payload.company_name = F.company;
      payload.tax_id       = F.tax_id;
      payload.area         = F.area;
      payload.scope        = F.scope;
      payload.transport    = F.transport;
      payload.approver_id  = F.approver_id;
      payload.approved_on  = F.approved_on;
    }

    BUSY = true; btn.disabled = true; btn.textContent = '登記中…';
    DB.rpc('add_service', { p_data: payload })
      .then(function (r) {
        BUSY = false;
        if (r.error) throw new Error(r.error.message);
        // ☢️ 規則擋下來不是錯誤，走 ok:false。訊息是資料庫寫的，直接給人看。
        if (!r.data || r.data.ok === false) {
          throw new Error((r.data && r.data.msg) || '登記不成功');
        }
        // ☢️ 扣了幾堂、還剩幾堂要講出來。這是這一頁唯一會【改變客人餘額】
        //    的動作，不講的話沒有人知道它到底扣了沒 ——
        //    而「以為扣了其實沒扣」正是這一步要修的那個洞。
        var extra = r.data.drew
          ? '　·　已扣 1 堂，卡剩 ' + r.data.plan_left + ' 堂'
          : (r.data.no_card ? '　·　☢️ 沒有卡可扣，已列入待補扣' : '');
        toast('登記好了：客人付 ' + money(r.data.total) + '　業績 ' + money(r.data.perf) + extra);
        // 清掉這一筆的內容，類型和教練留著（通常會連續登記同一種）
        F.customer = null; F.attended = ''; F.note = '';
        F.hours = ''; F.amount = ''; F.scope = ''; F.corpHead = ''; F.done = nowLocal();
        // ☢️ 卡片快取一定要清。剛剛扣掉一堂，畫面上的「剩 N 堂」已經過期了；
        //    不清的話下一筆會看到舊數字，而那個數字看起來完全正常。
        F.plan_id = ''; CARDS = []; CARDS_KEY = '';
        return load();
      })
      .catch(function (e) {
        BUSY = false;
        toast(String(e && e.message || e), true);
        var b = document.getElementById('save');
        if (b) { b.disabled = false; b.textContent = '登記這一筆'; }
      });
  }

  function finalize(id) {
    if (BUSY) return;
    BUSY = true;
    DB.rpc('finalize_service', { p_id: id })
      .then(function (r) {
        BUSY = false;
        if (r.error) throw new Error(r.error.message);
        if (!r.data || r.data.ok === false) throw new Error((r.data && r.data.msg) || '認列不成功');
        toast('已最終認列');
        return load();
      })
      .catch(function (e) { BUSY = false; toast(String(e && e.message || e), true); });
  }

  function voidOne(id) {
    if (BUSY) return;
    var why = window.prompt('作廢原因（會留在紀錄上）');
    if (why == null) return;
    if (!why.trim()) { toast('要寫作廢原因', true); return; }
    BUSY = true;
    DB.rpc('void_service', { p_id: id, p_reason: why.trim() })
      .then(function (r) {
        BUSY = false;
        if (r.error) throw new Error(r.error.message);
        if (!r.data || r.data.ok === false) throw new Error((r.data && r.data.msg) || '作廢不成功');
        toast('已作廢');
        return load();
      })
      .catch(function (e) { BUSY = false; toast(String(e && e.message || e), true); });
  }

  // ☢️ 還原【也要寫原因】。作廢要理由、還原不用的話，帳上就會出現
  //    「有人作廢了，然後不知道為什麼又回來了」—— 那比原本的錯更難查。
  function restoreOne(id) {
    if (BUSY) return;
    var why = window.prompt('還原原因（會跟原本的作廢紀錄一起留著）');
    if (why == null) return;
    if (!why.trim()) { toast('要寫還原原因', true); return; }
    BUSY = true;
    DB.rpc('restore_service', { p_id: id, p_why: why.trim() })
      .then(function (r) {
        BUSY = false;
        if (r.error) throw new Error(r.error.message);
        if (!r.data || r.data.ok === false) throw new Error((r.data && r.data.msg) || '還原不成功');
        toast('已還原，這筆會回到薪資裡');
        return load();
      })
      .catch(function (e) { BUSY = false; toast(String(e && e.message || e), true); });
  }

  /* ══ 讀資料 ══════════════════════════════════════════════════ */
  function load() {
    LOAD_ERR = '';   // 每次重讀都要清掉，不然修好了還一直掛著紅字
    // ☢️ 價格與教練名單讀不到，不該讓整頁掛掉 —— 但要讓人看得出少了東西。
    return Promise.all([
      DB.rpc('list_prices', { p_product: 'PT' })
        .then(function (r) { PRICES.PT = (!r.error && r.data) ? r.data : []; },
              function () { PRICES.PT = []; }),
      DB.rpc('list_prices', { p_product: 'PGT' })
        .then(function (r) { PRICES.PGT = (!r.error && r.data) ? r.data : []; },
              function () { PRICES.PGT = []; }),
      DB.rpc('list_prices', { p_product: 'CORP' })
        .then(function (r) { PRICES.CORP = (!r.error && r.data) ? r.data : []; },
              function () { PRICES.CORP = []; }),
      // ☢️ 授課教練只列【實際會站上課堂】的人（can_teach）。
      //    職稱是教練不代表他授課 —— 簡基城是顧問／股東，role 是 coach 但不上課。
      DB.from('employees').select('id,display_name,role')
        .eq('is_active', true).eq('can_teach', true)
        .order('display_name')
        .then(function (r) { COACHES = (!r.error && r.data) ? r.data : []; },
              function () { COACHES = []; }),
      // 核准人用得到全體職員
      DB.from('employees').select('id,display_name,role').eq('is_active', true)
        .order('display_name')
        .then(function (r) { STAFF = (!r.error && r.data) ? r.data : []; },
              function () { STAFF = []; }),
      // ☢️ 不能用 created_at 排序。批次匯入的 231 筆【共用同一個 created_at】
      //    （同一個交易裡的 now() 是同一個值），所以它們之間的先後是<b>沒有定義</b>的，
      //    實測回來的是 8/01 那批 —— 看起來像「最近登記」，其實是最舊的 20 筆。
      //    照 done_date／done_time 排才是人腦裡的「最近」。
      DB.from('staff_services').select(SVC_COLS)
        .order('done_date', { ascending: false })
        .order('done_time', { ascending: false })
        .limit(20)
        .then(function (r) {
          LIST = r.data || [];
          if (r.error) LOAD_ERR = r.error.message;   // ☢️ 錯誤不吞：空清單和讀不到長得一樣
        }, function (e) { LIST = []; LOAD_ERR = String(e && e.message || e); }),
      // 待確認自己撈一次，不受上面那 20 筆的限制
      // 收款彙總。☢️ 這一支【不設上限】—— 還沒收齊的錢被清單長度藏起來，
      //    就等於沒有人會去收。第 86 步的「待確認」踩過同一個坑。
      DB.from('staff_service_pay').select('service_id,due_amount,paid_amount,in_amount,pending_amount,n_payments,methods')
        .then(function (r) {
          PAYS = {};
          (r.data || []).forEach(function (x) { PAYS[x.service_id] = x; });
          if (r.error) LOAD_ERR = r.error.message;
        }, function (e) { PAYS = {}; LOAD_ERR = String(e && e.message || e); }),
      DB.from('staff_services').select(SVC_COLS)
        .neq('fin_status', 'final').eq('voided', false)
        .order('done_date', { ascending: false })
        .order('done_time', { ascending: false })
        .limit(200)
        .then(function (r) {
          PEND = r.data || [];
          if (r.error) LOAD_ERR = r.error.message;
        }, function (e) { PEND = []; LOAD_ERR = String(e && e.message || e); })
    ]).then(function () {
      if (!F.done) F.done = nowLocal();
      // ☢️ 「還沒收齊」不能從上面那 20 筆裡挑 —— 那正好會漏掉
      //    「三週前那筆企業包班匯款」，而那是這一整步要解決的問題。
      //    所以獨立查一次：先從收款彙總挑出有缺口的 id，再去撈那幾筆的明細。
      //    ☢️ 這一段【不設上限】。錢被清單長度藏起來，就等於沒有人會去收。
      //    「該收的還沒記完」是漏收，「記了但還沒到帳」是錢還在路上 —— 兩種都要追。
      var ids = Object.keys(PAYS).filter(function (k) {
        var p = PAYS[k];
        return (p.due_amount - p.paid_amount) > 0 || p.pending_amount > 0;
      });
      UNPAID = [];
      if (!ids.length) { render(); return; }
      return DB.from('staff_services').select(SVC_COLS)
        .in('id', ids).eq('voided', false)
        .order('done_date', { ascending: false })
        .order('done_time', { ascending: false })
        .limit(200)
        .then(function (r) {
          UNPAID = r.data || [];
          if (r.error) LOAD_ERR = r.error.message;
          render();
        }, function (e) { LOAD_ERR = String(e && e.message || e); render(); });
    });
  }

  /* ══ 開場 ══════════════════════════════════════════════════════ */
  function boot() {
    if (!window.FFF_AUTH || !window.FFF_AUTH.ready) {
      gate('err', '身分程式沒載進來', 'liff-auth.js 沒跑起來'); return;
    }
    window.FFF_AUTH.ready.then(function () {
      var st = window.FFF_AUTH.state;
      if (st === 'browsing') {
        elSub.textContent = '未登入';
        gate('err', '要先登入', '請從教練登入頁進來（staff.html）'); return;
      }
      // ☢️ state 還停在 checking 代表正要跳去 LINE 重新登入。
      //    不擋的話會把整頁畫出來、看起來已登入，但查詢全部回空（第 62 步）。
      if (st === 'checking') {
        elSub.textContent = '重新登入中';
        gate('', '正在重新登入…', '登入過期了，馬上跳到 LINE 幫你換一張'); return;
      }
      if (st === 'error') {
        elSub.textContent = '辨識失敗';
        if (window.FFF_AUTH.canLogin) {
          gate('', '登入過期了',
               (window.FFF_AUTH.errorNote || '按下面重新登入就好。') +
               '（' + (window.FFF_AUTH.error || '') + '）');
          var rb = document.createElement('button');
          rb.type = 'button'; rb.className = 'btn';
          rb.style.cssText = 'max-width:280px;margin:18px auto 0';
          rb.textContent = '重新登入';
          rb.onclick = function () {
            rb.textContent = '正在開啟 LINE 登入…'; rb.disabled = true;
            if (!window.FFF_AUTH.login()) {
              rb.textContent = '開不起來，請改從 LINE 裡面開'; rb.disabled = false;
            }
          };
          elGate.appendChild(rb);
          return;
        }
        gate('err', '辨識失敗',
             (window.FFF_AUTH.errorNote ? window.FFF_AUTH.errorNote + '　' : '') +
             (window.FFF_AUTH.error || '')); return;
      }
      if (!window.fffDB) { gate('err', '資料庫連線沒建立', 'no_fffDB'); return; }
      DB = window.fffDB;

      DB.auth.getUser().then(function (u) {
        if (u.error || !u.data || !u.data.user) {
          gate('err', '拿不到登入身分', (u.error && u.error.message) || 'no_user'); return;
        }
        return DB.from('employees')
          .select('id,display_name,role,is_active,can_finance')
          .eq('auth_user_id', u.data.user.id)
          .then(function (r) {
            if (r.error) throw new Error(r.error.message);
            if (!r.data || !r.data.length) {
              elSub.textContent = '未開通';
              gate('err', '你的帳號還沒開通', '先開 staff.html 把登入代號給 Jerec'); return;
            }
            ME = r.data[0];
            if (ME.is_active === false) {
              gate('err', ME.display_name + '　已停用', '如果這是誤設，請找 Jerec'); return;
            }
            elWho.textContent = ME.display_name;
            elSub.textContent = '服務登記';
            return load();
          }, function (e) {
            gate('err', '查不到員工名單', String(e && e.message || e));
          });
      });
    });
  }

  document.getElementById('reload').onclick = function () { if (DB) load(); };
  window.FFF_AUTH.onResume = function () { if (DB && ME) load(); };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
