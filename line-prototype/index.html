<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>諧動空間 Fusion Force</title>
<!--
  ═══════════════════════════════════════════════════════════
  這一頁是 LIFF 的端點（Endpoint URL 指向這個資料夾）。
  它只做一件事：把人送到他真正要去的那一頁。

  ☢️ 2026-08-11 踩過的坑（第 34 步）
  ─────────────────────────────────────────
  第一版的這一頁直接 location.replace('A-entry.html')，
  結果不管客人開的是哪一個 LIFF 網址，全部被丟到入口頁。

  原因：LIFF 網址後面接的路徑，LINE 是用 ?liff.state= 這個
  查詢參數送到端點來的，然後由 liff.init() 讀出來、再轉一次。
  我在 SDK 載入之前就跳走，那個參數整個被吃掉。

  不會報錯，只是每個人都到錯的地方 —— 又是一次「安靜的錯」。

  所以：有 liff.state 就交給 SDK 處理；沒有才自己去入口頁。
  ═══════════════════════════════════════════════════════════
-->
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
    background:#F4F8FA;color:#587589;
    font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;
    font-size:.86rem;letter-spacing:.04em;text-align:center;padding:20px}
  a{color:#2E86AB;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div id="msg">正在前往…　<a href="A-entry.html">點這裡</a></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011063116-QOxXN30h';
  var ENTRY = 'A-entry.html';

  // ☢️ 不能用 URLSearchParams.get('liff.state') 之後就丟掉 ——
  //    要判斷「有沒有」，處理權交給 SDK。
  var hasState = /[?&]liff\.state=/.test(location.search);

  if (!hasState) { location.replace(ENTRY); return; }

  // 有 liff.state：liff.init() 會自己讀出來，再把人轉到正確的子路徑。
  function manual() {
    // SDK 沒動作時的退路：自己把 liff.state 解出來轉過去。
    try {
      var m = /[?&]liff\.state=([^&]*)/.exec(location.search);
      var p = m ? decodeURIComponent(m[1]) : '';
      p = p.replace(/^\/+/, '');
      location.replace(p || ENTRY);
    } catch (e) { location.replace(ENTRY); }
  }

  if (!window.liff) { manual(); return; }

  var done = false;
  window.liff.init({ liffId: LIFF_ID })
    .then(function () { done = true; })
    .catch(function () { manual(); });

  // SDK 正常時會在這之前就把頁面轉走。還在這裡就代表它沒轉，自己來。
  setTimeout(function () { if (!done || document.getElementById('msg')) manual(); }, 2500);
})();
</script>
</body>
</html>
