<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FFF 教練後台</title>

<!--
  ═══════════════════════════════════════════════════════════════════
  staff-tools.html — 教練後台（第 48 步 · 2026-08-17）

  網址：https://liff.line.me/2011063116-QOxXN30h/staff-tools.html

  起因：2026-08-17 林正明綁不上，查了半天才發現「他根本不在名單裡」。
        真正花時間的不是建一筆資料，是【查出他為什麼綁不上】。
        那一步做成畫面，教練自己三秒就看得懂。

  ☢️ 這一頁【完全不碰堂數】。
     Jerec 2026-08-17 的決定（原話）：「舊系統……不只新增客人還直接可選
     購買方案，這會有『先上車，但不一定會補票』的問題，所以我選 1
     不碰堂數，只建人」。
     建出來的客人固定 0 堂，堂數走購課流程（C 第二期）。
     ☢️ 這同時守住第 39 步：動到錢的入口只有一個。

  三塊：
    ① 綁不上的人 —— 卡在哪，以及下一步該做什麼
    ② 新增客人   —— 姓名 ＋ 暱稱 ＋ 手機
    ③ 查客人     —— 剩幾堂、綁定了沒
  ═══════════════════════════════════════════════════════════════════
-->

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0E2A3B; --ink2:#1C4257; --blue:#2E86AB; --teal:#6FBAC9;
    --bg:#F4F8FA; --surface:#FFF; --surface2:#EDF4F7;
    --line:#DCE8EE; --dim:#587589; --faint:#93AEBD;
    --ok:#2F6B54; --ok-bg:#E4F0EA; --ok-line:#B9D8C8;
    --warn:#B4661F; --warn-bg:#FBEFE2; --warn-line:#EBC4A0;
    --err:#A4211A; --err-bg:#FBE9E7; --err-line:#F3C9C5;
  }
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:44px}

  /* ☢️ flex-wrap 不能省。第 71 步這一列變成 5~6 顆鍵，
        360px 的手機一列放不下 —— 而 flex 預設 nowrap，
        放不下的不是換行，是【被切在畫面外】，連捲軸都沒有。 */
  .top{background:var(--ink);color:#fff;padding:13px;display:flex;align-items:center;
    gap:6px;flex-wrap:wrap;row-gap:9px}
  .idw{min-width:0;flex:0 1 auto}
  /* 鍵包成一組：寬螢幕貼右邊排成一列，窄螢幕整組掉到第二列、自己再換行 */
  .nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-left:auto;justify-content:flex-end}
  /* 窄機把鍵上的字縮短，六顆才排得回一列。
     ☢️ 用兩個 span 切換，不要寫兩份 HTML —— 兩份遲早只改到一份。
     ☢️☢️ 名字一定要加 nv- 前綴。第一版用了 .lg／.sm ——
           而這個檔案第 301 行【早就有一個 .lg】（「綁不上的人」那張卡片，
           有 padding 和邊框）。結果按鍵裡的「核銷」兩個字被套上卡片樣式，
           整顆鍵變成兩行高、頂欄從 87px 漲到 183px。
           <b>撞名不會報錯</b>，只會讓版面莫名其妙壞掉。加名字前先搜一次。 */
  .nv-short{display:none}
  @media (max-width:430px){
    .nv-long{display:none}
    .nv-short{display:inline}
    /* 手機上再省一點：內距縮一格、頂欄的箭頭拿掉。
       ☢️ 箭頭只是裝飾，字本身已經說清楚要去哪 ——
          留著多佔 14px × 3 顆，剛好就是排不下的那一點。
       ☢️ 選擇器一定要寫 .top，不然會把畫面其他地方的箭頭一起關掉。 */
    .top .iconbtn{padding:8px 9px}
    .top .iconbtn .ar{display:none}
  }
  .who{font-size:16px;font-weight:800;letter-spacing:.03em}
  .sub{font-size:11px;color:#A9C6D4;margin-top:1px}
  .sp{flex:1}
  /* ══ 箭頭 ═══════════════════════════════════════════════
     ☢️ 2026-08-17 Jerec 反應：箭頭太小太細，看起來像圖片上的雜訊。
     原本是「›」這個字元 —— 細、又受字型擺布。改成用兩條邊框畫的 V 形，
     粗細自己說了算，放大也不會糊。
     ☢️ 顏色不要用 var(--faint) —— 它對白底只有 2.47:1，圖形最低要 3:1。
     ═══════════════════════════════════════════════════════ */
  .ar{display:inline-block;flex:0 0 auto;width:9px;height:9px;
    border-right:2.6px solid currentColor;border-top:2.6px solid currentColor;
    border-radius:1.5px;transform:rotate(45deg);
    font-size:0;line-height:0;vertical-align:middle;margin:0 3px 1px 5px}

  .iconbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;
    padding:9px 10px;font-family:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;flex:0 0 auto;
    /* ☢️ line-height 要寫死。<button> 的預設是 normal、<a> 會繼承 body 的 1.65 ——
       兩種標籤混在同一列時，高度差 2px，看起來就是「有一顆沒對齊」。 */
    line-height:1.5}
  /* 窄機（360px）三顆鍵擠在一起時，名字先讓位 */
  .who,.sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 0}
  .sec{margin:22px 0 9px;font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--faint)}
  .sec:first-child{margin-top:6px}
  .sec.hot{color:var(--err)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:9px}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:22px 10px}

  /* ── 綁不上的人 ── */
  .sg{border-left:4px solid var(--line)}
  .sg.no_phone{border-left-color:var(--err)}
  .sg.retry{border-left-color:var(--ok)}
  .sg.name_mismatch{border-left-color:var(--warn)}
  .sg.taken,.sg.inactive{border-left-color:var(--dim)}
  .sg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sg-n{font-size:15px;font-weight:800}
  .sg-p{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .sg-t{margin-left:auto;font-size:11px;color:var(--faint)}
  .sg-why{margin-top:7px;font-size:12.5px;line-height:1.7;padding:8px 10px;border-radius:9px}
  .sg.no_phone .sg-why{background:var(--err-bg);color:#7E1A15}
  .sg.name_mismatch .sg-why{background:var(--warn-bg);color:#7C420E}
  .sg.taken .sg-why,.sg.inactive .sg-why{background:var(--surface2);color:var(--ink2)}
  .sg.retry .sg-why{background:var(--ok-bg);color:#1F4A3A}
  .sg-why b{font-weight:800}
  .sg-act{margin-top:9px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;
    padding:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  /* 一鍵通知。☢️ 用外框鍵不是實心鍵 —— 同一張卡上「建客人」才是主要動作，
     兩顆都做成實心的話，教練會不知道該按哪一顆。 */
  .sg-tell{margin-top:8px;width:100%;background:#fff;color:var(--ink2);
    border:1.5px solid var(--line);border-radius:10px;padding:9px;
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}
  .sg-tell .ar{color:var(--blue)}
  .tellbox{margin-top:8px}
  .tellt{background:var(--surface2);border-radius:10px;padding:10px 11px;
    font-size:12px;line-height:1.8;color:var(--ink2);white-space:normal}
  .tella{display:flex;gap:7px;margin-top:7px}
  .tellb{flex:1;text-align:center;background:var(--ink);color:#fff;border:0;border-radius:9px;
    padding:10px 8px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .tellb.cp{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}

  /* ── 表單 ── */
  label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin:9px 0 4px;
    letter-spacing:.04em}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:15px;color:var(--ink);background:#fff}
  /* ☢️ 提示字的對比要過 AA（4.5:1）。淺灰 placeholder 在手機戶外看不見。 */
  input::placeholder{color:#526E7E}
  input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,134,171,.13)}
  .hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  /* 必填標記。☢️ 用文字不用只用顏色 —— 色盲的人看不出紅色代表什麼。 */
  .req{font-style:normal;font-size:10.5px;font-weight:700;color:var(--err);letter-spacing:.04em}
  .hint b{color:var(--ink2)}
  .btn{margin-top:13px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:11px;
    padding:13px;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.04em;cursor:pointer}
  .btn:disabled{opacity:.5}
  .res{margin-top:10px;font-size:12.5px;line-height:1.7;padding:10px 12px;border-radius:10px}
  .res.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .res.bad{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
  /* 建完客人 → 十之八九下一步就是幫他購課，直接給一顆鍵，不要叫人自己往上捲 */
  .gobuy{margin-top:8px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;
    padding:10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}

  /* ── 查客人 ── */
  /* ☢️ 2026-08-18 加了暱稱之後，原本擠在同一行的五個東西（姓名／暱稱／尾碼／
     綁定狀態／剩幾堂／購課鍵）在 390px 的手機上開始各自折行 ——
     「已綁定」被拆成「已綁／定」，看起來就是壞掉。改成上下兩行：
       第一行：姓名（暱稱）
       第二行：尾碼 · 綁定狀態 · 剩幾堂
     購課鍵永遠靠右、永遠在垂直中間。 */
  .hit{width:100%;display:flex;align-items:center;gap:9px;background:#fff;
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;
    font-family:inherit;text-align:left}
  .hit .hl{flex:1;min-width:0}
  .hit .hn{display:block;font-size:14px;font-weight:700}
  /* 暱稱：同名的兩個人靠這個分辨。☢️ 用 var(--dim)，對白底 4.86:1，不能再淡。 */
  .hit .nk{font-style:normal;font-weight:500;font-size:12px;color:var(--dim);margin-left:5px}
  .hit .nk::before{content:'（'}
  .hit .nk::after{content:'）'}
  .hit .hm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
  .hit .tl{font-size:11.5px;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
  .hit .bal{font-size:12px;font-weight:700;background:var(--surface2);
    color:var(--ink2);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .hit .bal.low{background:var(--err-bg);color:var(--err)}
  .hit .bd{font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .hit .bd.y{background:var(--ok-bg);color:var(--ok)}
  .hit .bd.n{background:var(--warn-bg);color:#7C420E}

  /* ══ 提醒條 ═══════════════════════════════════════════════
     ☢️ 2026-08-17 Jerec：「購課區似乎藏的太深，介面似乎不太直覺」。
        原本順序是 待入帳 → 綁不上的人 → 新增客人 → 最近的購課 → 查客人／購課，
        購課落在 2600px 以下 —— 櫃檯【最常做】的事被排在最後一個。
        改成購課放最上面。但警示不能因此被埋掉，所以用這一條頂在最上面：
        一行講完還有幾件事，按下去直接捲到那一區。 */
  .alerts{display:flex;align-items:center;gap:9px;
    background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;
    padding:9px 11px;margin:2px 0 12px;font-size:12.5px;font-weight:700;color:#7C420E}
  .alerts span{flex:1;min-width:0}
  .algo{flex:0 0 auto;background:#7C420E;color:#fff;border:0;border-radius:8px;
    padding:6px 10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center}

  /* ══ 主要動作區：購課 ═════════════════════════════════════ */
  /* ── 導覽磚（第 92 步之後改的）──
     ☢️ 兩欄，而且每一塊底下一定要有一句「進去做什麼」。
        只寫「對帳」「支出」的話，不是每天用的人分不出差別 ——
        他會兩個都點開看一次，那就等於沒有分組。 */
  .navg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{display:flex;flex-direction:column;justify-content:center;gap:2px;
    background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;text-decoration:none;color:var(--ink);min-height:60px}
  .tile:active{background:var(--surface2)}
  .tile b{font-size:14.5px;font-weight:800;display:flex;align-items:center;line-height:1.35}
  .tile i{font-size:11px;color:var(--dim);font-style:normal;line-height:1.5}
  .tile.wide{grid-column:1 / -1}

  /* 調整堂數的表單（沿用沖銷那一套 .vf） */
  .vf .vfi + .vfi{margin-top:6px}
  .adjb{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:2px 8px;font-family:inherit;font-size:11px;
    font-weight:700;cursor:pointer;margin-left:4px}
  .adjb:active{background:var(--surface2)}

  .lead{background:var(--surface);border:1.5px solid var(--blue);border-radius:16px;
    padding:14px;margin-bottom:10px;box-shadow:0 6px 18px -12px rgba(46,134,171,.75)}
  .lead h2{font-size:15.5px;font-weight:800;letter-spacing:.03em}
  .lead .lh{font-size:11.5px;color:var(--dim);margin:3px 0 10px;line-height:1.6}
  /* ☢️ 輸入框不能小於 16px —— iOS 會自動把整頁放大，教練會以為畫面壞了 */
  .lead input{font-size:16px;padding:13px}

  /* ══ 摺疊區塊 ═════════════════════════════════════════════ */
  details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:9px}
  details.fold > summary{list-style:none;cursor:pointer;padding:13px 14px;
    font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary .cap{font-size:11px;font-weight:600;color:var(--dim);
    margin-left:auto;text-align:right}
  details.fold > summary .ar{color:var(--blue);transform:rotate(135deg);margin-bottom:4px}
  details.fold[open] > summary .ar{transform:rotate(-45deg);margin-bottom:0}
  .foldb{padding:0 14px 14px}

  /* 課程轉讓（第 74 步）。
     ☢️ 名字都加 xf- / 2 的後綴，先搜過確定這個檔案裡沒有同名的 ——
        第 72 步就是因為 .lg 撞名，把按鍵撐成兩行高。 */
  .picked2{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:9px;
    padding:9px 10px;display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800}
  .picked2 span{font-weight:400;color:var(--dim);font-size:12px}
  .picked2 button{margin-left:auto;background:none;border:0;color:var(--dim);
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
  .xfhits{margin-top:7px}
  .xfhit{border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;
    display:flex;align-items:baseline;gap:7px;font-size:14px}
  .xfhit:first-child{border-top:0}
  .xfhit b{font-weight:800}
  .xfhit span{font-size:11.5px;color:var(--faint)}
  .xfhit i{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--dim)}
  .xfp{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-top:7px;
    font-size:13px;cursor:pointer;background:var(--surface2)}
  .xfp.on{border-color:var(--blue);background:#fff;box-shadow:inset 0 0 0 1px var(--blue)}
  .xfp i{display:block;font-style:normal;font-size:11px;color:var(--warn);margin-top:2px}

  /* ══ 待入帳 ═══════════════════════════════════════════════ */
  .up{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .up:last-of-type{border-bottom:0}
  .upl{flex:1;min-width:0}
  .upl b{font-size:14px;font-weight:800}
  .upl span{font-size:11.5px;color:var(--faint);letter-spacing:.06em;margin-left:5px}
  .upl i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
  .upb{flex:0 0 auto;background:var(--ok);color:#fff;border:0;border-radius:9px;
    padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}

  /* ══ 購課 ═════════════════════════════════════════════════ */
  .hitwrap{margin-bottom:7px}
  .hit{margin-bottom:0}
  .hitbuy{flex:0 0 auto;background:var(--ink);color:#fff;border:0;border-radius:9px;
    padding:7px 11px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .buywrap{border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px;
    background:var(--surface2);padding:10px}
  /* ☢️ 原本是 2 欄 4 顆，方案名寫兩次、付款方式縮在小字第二行 ——
     一眼掃過去四顆長得幾乎一樣，要讀完小字才知道差別在哪。
     改成【列＝方案、欄＝付款方式】，欄頭寫一次就好，按哪一顆一目瞭然。 */
  .buy{display:grid;grid-template-columns:auto 1fr 1fr;gap:7px;align-items:stretch}
  .bhd{font-size:11.5px;font-weight:800;color:var(--dim);text-align:center;align-self:end;
    letter-spacing:.06em}
  .brl{display:flex;flex-direction:column;justify-content:center;padding-right:2px}
  .brl b{font-size:13px;font-weight:800;line-height:1.35}
  .brl i{font-style:normal;font-size:10.5px;color:var(--dim)}
  .buyb{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 6px;
    font-family:inherit;text-align:center;cursor:pointer;color:var(--ink);
    font-size:13px;font-weight:800;letter-spacing:.02em}
  /* 選中的那一顆要一眼看得出來 —— 這是動到錢的地方 */
  .buyb.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .buyc{grid-column:1 / -1;margin-top:3px}
  /* 品項分組標題。☢️ 團體課 400 元和私人課 20,000 元排在同一串裡，
     眼睛會滑過去 —— 而按錯的代價是一筆五位數的帳。 */
  .bgrp{grid-column:1 / -1;margin:9px 0 -1px;font-size:10.5px;font-weight:800;
    letter-spacing:.16em;color:var(--faint)}
  .bgrp:first-of-type{margin-top:4px}
  .buysum{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-size:12.5px;line-height:1.7;color:var(--ink2)}
  .warn2{color:#7C420E;font-size:11.5px}
  .buygo{width:100%;margin-top:7px;background:var(--ok);color:#fff;border:0;border-radius:10px;
    padding:11px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .buygo:disabled{opacity:.55}
  /* ══ 最近的購課 ＋ 沖銷（只有 owner 看得到）═══════════════ */
  /* ☢️「什麼時候該用」要在按鈕旁邊，不是在手冊裡。 */
  .whenuse{background:var(--surface2);border-radius:11px;padding:11px 12px;margin-bottom:11px;
    font-size:11.5px;line-height:1.75;color:var(--ink2)}
  /* ☢️ 只有【直接放在 .whenuse 底下】的粗體才獨佔一行（那兩個小標題）。
     原本寫成 .whenuse b，連句子中間的粗體也被迫換行 ——
     最後那句「沖銷是在說『這件事根本沒發生過』」的引號被拆成三行。 */
  .whenuse > summary{list-style:none;cursor:pointer;font-size:12px;font-weight:800;
    color:#7C420E;display:flex;align-items:center}
  .whenuse > summary::-webkit-details-marker{display:none}
  .whenuse[open] > summary{margin-bottom:8px;padding-bottom:7px;
    border-bottom:1px dashed var(--line)}
  .whenuse > b{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
  .whenuse > b.no{margin-top:9px;color:#7E1A15}
  .whenuse ul{margin:0 0 0 16px;padding:0}
  .whenuse li{margin:1px 0}
  .whenuse .mini{display:block;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
    color:var(--dim)}

  .pv{display:flex;align-items:flex-start;gap:9px;padding:9px 0;
    border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .pv:last-child{border-bottom:0}
  .pv.off{opacity:.62}
  .pvl{flex:1;min-width:0}
  .pvl b{font-size:13.5px;font-weight:800}
  .pvl span{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-left:5px}
  .pvl i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px;
    line-height:1.6}
  .pvl u{display:block;text-decoration:none;font-size:10.5px;color:#7E1A15;margin-top:3px}
  .pvb{flex:0 0 auto;background:#fff;border:1px solid var(--err-line);color:var(--err);
    border-radius:9px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:800;
    cursor:pointer}
  .pvx{flex:0 0 auto;font-size:11px;color:var(--faint);padding:6px 4px}

  .vf{flex:0 0 100%;margin-top:8px;background:var(--err-bg);border:1px solid var(--err-line);
    border-radius:11px;padding:10px 11px}
  .vfh{font-size:12.5px;font-weight:800;color:#7E1A15;margin-bottom:7px}
  .vfi{width:100%;padding:9px 10px;border:1px solid var(--err-line);border-radius:9px;
    font-family:inherit;font-size:14px;background:#fff}
  .vfi::placeholder{color:#8A5B56}
  .vfa{display:flex;gap:7px;margin-top:8px}
  .vfno{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--ink2);
    border-radius:9px;padding:9px 15px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .vfgo{flex:1;background:var(--err);color:#fff;border:0;border-radius:9px;padding:9px;
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
  .vfgo:disabled{opacity:.55}
  .vfr .res{margin-top:8px}
  .cpb{margin-top:7px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;
    padding:8px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .cp{display:block;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:7px;
    padding:7px 8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    color:var(--ink2);word-break:break-all;line-height:1.6}
  /* ══ 封存堂數 ═════════════════════════════════════════════ */
  .lg{background:#FFF9EC;border:1px solid #EBC4A0;border-radius:12px;padding:11px 12px;margin-top:9px}
  .lg.done{background:var(--ok-bg);border-color:var(--ok-line)}
  .lgh{font-size:13px;color:#7C420E;font-weight:700}
  .lgh b{font-size:15px;font-weight:800;color:var(--ink)}
  .lgh span{float:right;background:#fff;border:1px solid #EBC4A0;border-radius:999px;
    padding:2px 9px;font-size:12px;font-weight:800;color:#7C420E}
  .lgm{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  .lga{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .lgb{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:9px 10px;
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .lgb:disabled{opacity:.55}
  .lgnote{font-size:11.5px;color:var(--ink2);background:#fff;border:1px dashed #EBC4A0;
    border-radius:9px;padding:8px 10px;line-height:1.7}
  .lgr .res{margin-top:8px}
  .gate{text-align:center;padding:60px 20px;color:var(--dim)}
  .gate .g1{font-size:17px;font-weight:800;color:var(--ink)}
  .gate.err .g1{color:var(--err)}
  .gate .g2{font-size:12.5px;margin-top:6px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;
    font-size:13px;font-weight:600;max-width:88%;text-align:center;z-index:50}
  .toast.bad{background:var(--err)}

  /* ☢️☢️ 2026-08-18 這一行【本來沒有】，而它是必要的。
     HTML 的 hidden 屬性靠瀏覽器預設的 [hidden]{display:none} 生效，
     但那是【最低優先權】—— 任何一條 class 規則都壓得過它。
     .iconbtn 寫了 display:inline-flex，所以
     <a class="iconbtn" hidden> 【照樣看得見】。
     ☢️ 今天差一點就出事：新加的「對帳」入口是這樣藏的 ——
        沒有這一行的話，【每一位教練都會看到那顆按鈕】。
        （資料還是拿不到，資料庫那一關擋著；但按鈕本身不該出現。）
     ☢️ 它不會報錯、不會壞掉，只是「藏起來的東西沒藏住」——
        只有真的打開頁面看才會發現。checkin/staff/report 三頁本來就有這一行，
        唯獨這一頁漏了。 */
  [hidden]{display:none !important}

  /* ══ 桌機 ══════════════════════════════════════════════════════
     ☢️ 2026-08-18 Jerec：「留白很多，字體很小，右上角的連結按鈕太遠」。
        理由和做法跟 checkin.html 完全一樣，兩邊要一起改 ——
        只改一邊的話，教練在兩頁之間切換會看到字忽大忽小。
        （完整說明寫在 checkin.html 的同一段）

     ☢️ 這一頁的頂欄有三顆（官網／點名核銷／重新整理），是最明顯的那個 ——
        內容在正中央，鍵在最右邊，中間隔著一整片空白。
     ══════════════════════════════════════════════════════════════ */
  @media (min-width:1000px){
    :root{--col:600px}
    .top,.wrap{zoom:1.22}
    .wrap{max-width:var(--col)}
    /* ☢️ 要再加 14px —— .wrap 自己有 padding:…14px，卡片的邊在那之後。 */
    .top{padding-inline:max(13px, calc((100% - var(--col)) / 2 + 14px))}
  }
</style>
</head>
<body>

<div class="top">
  <div class="idw">
    <div class="who" id="who">教練後台</div>
    <div class="sub" id="whoSub">辨識中…</div>
  </div>
  <!-- ☢️ 2026-08-19：這幾顆鍵一定要包在 .nav 裡。
       第 71 步多了「服務登記」之後變成 5~6 顆，手機一列排不下 ——
       而 flex 預設【不換行】，排不下的那幾顆是直接被切在畫面外，
       不會有捲軸、也不會有任何提示。Jerec 就是這樣按不到「重新整理」的。
       包起來之後：寬螢幕一列排完，窄螢幕整組掉到第二列自己排。 -->
  <div class="nav">
    <!-- ☢️ 2026-08-22：這裡【只留兩顆】。
         第 92 步之後頁面變成七個，全部塞進頂部列有八顆鍵 ——
         手機一列排不下、換行之後又佔掉快兩百像素，
         而其中六顆是「一天按一次」的導覽，不是「隨時要按」的操作。
         導覽改成內容區的分組磚（navBlock），照【用途】分，
         每一塊底下寫一句「進去做什麼」。
         頂部列只留真正隨時會按的：重新整理、登出。 -->
    <a class="iconbtn" href="https://jerecyu.github.io/Fusion_Force_Fitness/"
       target="_blank" rel="noopener">官網</a>
    <button type="button" class="iconbtn" id="reload"><span class="nv-long">重新整理</span><span class="nv-short">重整</span></button>
    <!-- ☢️ 只在瀏覽器裡出現。在 LINE App 裡按了會自動登入回來，等於沒作用。 -->
    <button type="button" class="iconbtn" id="logout" hidden>登出</button>
  </div>
</div>

<div class="wrap">
  <div id="gate" class="gate"><div class="g1">辨識中…</div><div class="g2">跟資料庫確認你是誰</div></div>
  <div id="main" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="liff-auth.js"></script>

<script>
(function () {
  'use strict';

  var DB = null, ME = null;
  // ☢️ 重畫（render）會把 <details> 打回預設的收合狀態 ——
  //    建完客人剛好會重畫一次，成功訊息就跟著被收進去看不見了。
  //    這個變數負責讓它記得剛剛是開著的。
  var NEWOPEN = false;

  /* 課程轉讓（第 74 步）。☢️ 只有財務看得到 ——
     一張 12 堂的方案換人＝把 NT$4,000 的權益移過去，那不是任何一位教練該按的。
     真正的牆在資料庫（transfer_plan 檢查 is_finance），這裡只是不要讓人白按。 */
  var XFOPEN = false;
  var XF = { from: null, plans: [], plan: null, to: null, busy: false };
  var SIGNUPS = [];
  var UNPAID = [], PRODUCTS = [], OVER = [];
  var RECENT = [];          // 最近的購課（只有 owner 看得到，也是沖銷的入口）
  var HITS = [];

  var elGate = document.getElementById('gate');
  var elMain = document.getElementById('main');
  var elWho  = document.getElementById('who');
  var elSub  = document.getElementById('whoSub');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function gate(cls, t1, t2) {
    elGate.className = 'gate' + (cls ? ' ' + cls : '');
    elGate.innerHTML = '<div class="g1">' + esc(t1) + '</div><div class="g2">' + esc(t2||'') + '</div>';
    elGate.hidden = false; elMain.hidden = true;
  }

  /* ☢️ 2026-08-18（第 59 步）在瀏覽器（桌機）開、而且還沒登入時的畫面。
        跟 gate() 差在多一顆真的能按的鍵 —— 這一種狀況是【有救】的，
        只給一句「要從 LINE 裡面開」等於把有救的人擋在外面。 */
  function gateLogin(t1, t2, label) {
    gate('', t1 || '還沒登入', t2 || '你是在瀏覽器裡開的。按下面用 LINE 登入就好。');
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn';
    b.style.maxWidth = '280px';
    b.style.margin = '18px auto 0';
    b.textContent = label || '用 LINE 登入';
    b.onclick = function () {
      b.textContent = '正在開啟 LINE 登入…'; b.disabled = true;
      // ☢️ 失敗要把按鈕放回去。卡在「正在開啟…」而且按不動，
      //    看起來就像整頁當掉了。
      if (!window.FFF_AUTH.login()) { b.textContent = '開不起來，請改從 LINE 裡面開'; b.disabled = false; }
    };
    elGate.appendChild(b);
    var n = document.createElement('div');
    n.className = 'g2';
    n.style.marginTop = '10px';
    n.textContent = '會跳到 LINE 的登入畫面，登完自動回來。可以用手機掃 QR Code。';
    elGate.appendChild(n);
  }
  var toastTimer;
  function toast(msg, bad) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var d = document.createElement('div');
    d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg;
    document.body.appendChild(d);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ d.remove(); }, bad ? 4200 : 2200);
  }
  function money(n) {
    return String(n == null ? '' : n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  // 複製到剪貼簿。☢️ 一定要有退路 —— LINE 的內建瀏覽器在某些 Android 版本上
  //    沒有 navigator.clipboard，只寫新 API 的話會整顆鍵沒反應、而且不報錯。
  function copyTo(btn, text, okText) {
    var done = function () { btn.textContent = okText || '已複製 ✓'; };
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { btn.textContent = '複製不了，長按文字選取'; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, legacy);
    } else { legacy(); }
  }

  function tw(iso) {
    if (!iso) return '';
    var d = new Date(iso), p = function (n) { return n < 10 ? '0' + n : String(n); };
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ══ 綁不上的人 ══════════════════════════════════════════════
     ☢️ 這一塊的重點【不是】列出誰綁不上，是講出「卡在哪、下一步做什麼」。
        2026-08-17 林正明那件事，難的是診斷不是動作。
     ═══════════════════════════════════════════════════════════ */
  function loadSignups() {
    return DB.from('staff_signups')
      .select('line_user_id,typed_name,typed_phone,tries,updated_at,' +
              'registered_name,registered_nickname,why')
      .order('updated_at', { ascending: false })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        SIGNUPS = r.data || [];
      });
  }

  function sgCard(s) {
    var why = s.why, body = '', act = '';
    if (why === 'retry') {
      // ☢️ 2026-08-17 現場發現的：教練用這一頁建完客人之後，那筆留言簿
      //    【還會留著】—— 它要等客人真的綁成功才會自動消失。
      //    原本這種情況會掉進 name_mismatch，畫面就會說
      //    「請他改打『林正明』」，而他打的就是林正明 —— 自相矛盾。
      body = '<b>資料都對得上了，就差他再送一次。</b><br>' +
             '名單上是「<b>' + esc(s.registered_name) + '</b>」' +
             (s.registered_nickname ? '（暱稱「' + esc(s.registered_nickname) + '」）' : '') +
             '，手機也對。<br>' +
             '請他<b>用自己的手機重新綁定一次</b>，這張卡就會自動消失。';
    } else if (why === 'no_phone') {
      body = '<b>這支手機不在名單裡。</b><br>' +
             '他可能是新客人，或是登記時留的是別支手機。<br>' +
             '確定是新客人 → 按下面建檔，然後請他<b>再綁一次</b>。';
      act  = '<button type="button" class="sg-act" data-new="1" ' +
             'data-n="' + esc(s.typed_name) + '" data-p="' + esc(s.typed_phone) + '">' +
             '用這筆資料去建客人<span class="ar"></span></button>';
    } else if (why === 'name_mismatch') {
      // ☢️ 2026-08-18：比對放寬成「姓名或暱稱對上任一個就過」之後，
      //    這段話一定要跟著把【兩個】名字都講出來。只講登記姓名的話，
      //    教練會去叫客人改打 A，而其實打 B 也會過 —— 白繞一圈。
      var ok = [s.registered_name];
      if (s.registered_nickname) ok.push(s.registered_nickname);
      body = '<b>手機對得上，姓名對不上。</b><br>' +
             '名單上是「<b>' + esc(s.registered_name) + '</b>」' +
             (s.registered_nickname ? '，暱稱「<b>' + esc(s.registered_nickname) + '</b>」' : '') +
             '。<br>' +
             '☢️ 客人打的姓名要<b>包含</b>其中一個 —— 多寫沒關係，少寫不行。<br>' +
             '請他改打「' + esc(ok.join('」或「')) + '」再送一次就會過。';
    } else if (why === 'taken') {
      body = '<b>這筆客人已經被另一支 LINE 綁走了。</b><br>' +
             '可能是他換手機、或家人幫他綁過。<b>這個要找 Jerec 處理</b>，' +
             '教練這邊改不了（改綁的權限故意沒有開）。';
    } else {
      body = '<b>這位客人被停用了。</b>要找 Jerec 確認是不是誤設。';
    }
    return '<div class="card sg ' + why + '">' +
      '<div class="sg-h">' +
        '<span class="sg-n">' + esc(s.typed_name) + '</span>' +
        '<span class="sg-p">' + esc(s.typed_phone) + '</span>' +
        '<span class="sg-t">試 ' + s.tries + ' 次　·　' + tw(s.updated_at) + '</span>' +
      '</div>' +
      '<div class="sg-why">' + body + '</div>' + act +
      '<button type="button" class="sg-tell" data-tell="' + esc(s.line_user_id) + '">' +
        '通知他<span class="ar"></span></button>' +
      '<div class="tellbox" hidden></div>' +
    '</div>';
  }

  /* ══ 一鍵通知 ═══════════════════════════════════════════════
     ☢️ 2026-08-18 Jerec 要的：卡片上直接按一下就能通知客人。
        原本教練得自己想「這個人卡在哪、要跟他說什麼」，再切到別的 App 打字。

     ☢️ 為什麼是簡訊不是 LINE：
        · 我們手上有的是他【打錯或打對的手機】，不是可以主動發訊的管道。
        · 用 LINE 官方帳號推播要走 Messaging API，每一則都吃月額度 ——
          而 8/16 量到 2,217/3,000，推估 8/22 見底。拿來做客服通知會更快燒完。
        · 簡訊是手機自己開，不經過我們的伺服器，也不佔任何額度。
     ☢️ 「複製」是退路：LINE 內建瀏覽器在某些機型上不讓 sms: 開出去，
        那時候至少文字還在剪貼簿裡，貼到哪都行。
     ═══════════════════════════════════════════════════════════ */
  var SHOP = '諧動空間 Fusion Force';
  var SHOP_TEL = '(02) 2356-9462';

  function noticeText(s) {
    if (s.why === 'retry') {
      return '您好，這裡是' + SHOP + '。\n' +
             '您的資料我們已經確認好了，麻煩您再打開 LINE 綁定一次就完成了。\n' +
             '造成不便，很不好意思。';
    }
    if (s.why === 'no_phone') {
      // ☢️ 這支手機【不在名單裡】—— 有可能根本不是我們的客人，也可能是他打錯一個數字。
      //    所以這一則【絕對不能】出現任何其他客人的姓名或資料。
      return '您好，這裡是' + SHOP + '。\n' +
             '我們收到您的預約系統綁定申請，但系統查不到這支手機號碼。\n' +
             '方便告訴我們您當初在櫃檯登記時留的手機嗎？或直接回覆這則訊息，我們幫您處理。';
    }
    if (s.why === 'name_mismatch') {
      var ok = [s.registered_name];
      if (s.registered_nickname) ok.push(s.registered_nickname);
      return '您好，這裡是' + SHOP + '。\n' +
             '綁定時的「姓名」欄，麻煩您打「' + ok.join('」或「') + '」，再送出一次就會過。\n' +
             '手機號碼不用改。';
    }
    if (s.why === 'taken') {
      return '您好，這裡是' + SHOP + '。\n' +
             '您的資料目前綁在另一個 LINE 帳號上。為了避免別人看到您的紀錄，我們不會自動換掉 ——\n' +
             '麻煩您回覆這則訊息，或來電 ' + SHOP_TEL + '，我們協助您處理。';
    }
    return '您好，這裡是' + SHOP + '。\n' +
           '您的帳號目前是停用狀態，麻煩您回覆這則訊息或來電 ' + SHOP_TEL + '，我們確認一下。';
  }

  function wireNotify(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-tell]'), function (b) {
      b.onclick = function () {
        var card = b.parentNode, box = card.querySelector('.tellbox');
        if (!box.hidden) { box.hidden = true; b.innerHTML = '通知他<span class="ar"></span>'; return; }

        var s = SIGNUPS.filter(function (x) {
          return String(x.line_user_id) === b.getAttribute('data-tell');
        })[0];
        if (!s) return;

        var t = noticeText(s);
        // ☢️ 手機號碼是客人自己打的，可能有橫線或空白 —— sms: 前面要清乾淨
        var tel = String(s.typed_phone || '').replace(/\D/g, '');
        box.innerHTML =
          '<div class="tellt">' + esc(t).replace(/\n/g, '<br>') + '</div>' +
          '<div class="tella">' +
            (tel ? '<a class="tellb go" href="sms:' + esc(tel) + '?body=' +
                   encodeURIComponent(t) + '">傳簡訊給 ' + esc(tel) + '</a>' : '') +
            '<button type="button" class="tellb cp">複製訊息</button>' +
          '</div>';
        box.hidden = false;
        b.textContent = '收起';
        box.querySelector('.cp').onclick = function () {
          copyTo(box.querySelector('.cp'), t, '已複製 ✓');
        };
      };
    });
  }

  function loadPurchaseBits() {
    // ☢️ 這兩個讀不到不該擋住整個後台 —— 綁定診斷跟購課是兩件事。
    return Promise.all([
      // ☢️ 2026-08-22（第 93 步之三）：條件從 product='GT' 改成 sellable。
      //    原本寫死只賣團體課，所以【私人課的卡開不出來】——
      //    db/68 讓「扣預收」扣得動了，卻沒有卡可以扣。
      //    ☢️ 不能只是把 GT 那個條件拿掉：那樣單堂品項（PT 單堂、PGT 單堂、
      //       企業包班費率）也會冒出來，而單堂的錢【已經在服務登記那側收了】——
      //       在這裡再賣一次就是同一筆收入記兩遍。sellable 是資料庫裡的明確旗標。
      DB.from('products').select('code,label,credits,price,sort_order,product,headcount')
        .eq('sellable', true).eq('is_active', true).order('product').order('sort_order')
        .then(function (r) { PRODUCTS = (!r.error && r.data) ? r.data : []; },
              function () { PRODUCTS = []; }),
      (ME && ME.role === 'owner'
        ? DB.from('staff_recent_purchases')
            .select('ledger_id,created_at,customer_name,phone_tail,credits,amount,' +
                    'pay_method,paid_at,note,created_by_name,voided,void_reason,voided_by_name')
            .order('created_at', { ascending: false }).limit(20)
            .then(function (r) { RECENT = (!r.error && r.data) ? r.data : []; },
                  function () { RECENT = []; })
        : Promise.resolve()),
      DB.from('staff_unpaid')
        .select('ledger_id,created_at,customer_name,phone_tail,credits,amount,created_by_name,waited_days')
        .order('created_at', { ascending: true })
        .then(function (r) { UNPAID = (!r.error && r.data) ? r.data : []; },
              function () { UNPAID = []; }),

      // 人數超過上限的課。正常情況這是空的 —— 空的就完全不會出現在畫面上。
      DB.from('staff_overbooked')
        .select('session_id,session_date,start_time,title,coach_name,capacity,people,booking_rows,over_by')
        .then(function (r) { OVER = (!r.error && r.data) ? r.data : []; },
              function () { OVER = []; })
    ]);
  }

  // 待入帳。☢️ 只有匯款、而且還沒確認的才會進來 ——
  //    搬遷進來的舊資料 paid_at 也是 null，但那是「不知道」不是「還沒收」。
  function unpaidBlock() {
    if (!UNPAID.length) return '';
    var rows = UNPAID.map(function (u) {
      var d = Number(u.waited_days || 0);
      return '<div class="up">' +
        '<div class="upl"><b>' + esc(u.customer_name) + '</b> <span>' + esc(u.phone_tail) + '</span>' +
          '<i>' + u.credits + ' 堂　·　NT$' + (u.amount == null ? '—' : u.amount) +
          '　·　' + esc(u.created_by_name || '') + ' 入的' +
          (d > 0 ? '　·　等 ' + d + ' 天' : '') + '</i></div>' +
        '<button type="button" class="upb" data-paid="' + esc(u.ledger_id) + '">錢到了</button>' +
      '</div>';
    }).join('');
    return '<div class="sec hot">💰 匯款待入帳（' + UNPAID.length + '）</div>' +
           '<div class="card">' + rows +
           '<div class="hint" style="margin-top:8px">☢️ 這些人的<b>堂數已經給了</b>，只差錢還沒確認進帳戶。' +
           '按「錢到了」＝確認入帳，不會改動堂數。</div></div>';
  }

  // 人數超過上限的課。
  // ☢️ 這不是「額滿」，額滿是正常的（我們本來就不擋額滿報名）。
  //    這是【超過上限】—— 團體課一班最多 12 人，出現 13 人以上代表資料有問題：
  //    可能是重複報名、也可能是教練點名時「另外帶了 N 位」按太多。
  //    系統不會自動改任何東西，只把它指出來給人看。
  function overBlock() {
    if (!OVER.length) return '';
    var rows = OVER.map(function (o) {
      var d = String(o.session_date || '').slice(5).replace('-', '/');
      var t = String(o.start_time || '').slice(0, 5);
      return '<div class="up">' +
        '<div class="upl"><b>' + d + ' ' + t + '　' + esc(o.title || '') + '</b>' +
          '<i>上限 ' + o.capacity + ' 人　·　實際 <b>' + o.people + '</b> 人' +
          '（超出 ' + o.over_by + ' 人）　·　' + o.booking_rows + ' 筆報名' +
          (o.coach_name ? '　·　' + esc(o.coach_name) : '') + '</i></div>' +
      '</div>';
    }).join('');
    return '<div class="sec hot">☢️ 人數超過上限（' + OVER.length + ' 堂）</div>' +
           '<div class="card">' + rows +
           '<div class="hint" style="margin-top:8px">團體課一班上限 <b>12</b> 人。' +
           '這幾堂的實際人數超過了 —— <b>不是額滿，是資料對不上</b>。<br>' +
           '常見原因：同一個人被重複報名、或點名時「另外帶了 N 位」按多了。' +
           '請到點名頁把那堂的名單看一次。</div></div>';
  }

  // 最近的購課。☢️ 只有 owner 看得到 —— 這一塊是沖銷的入口。
  function recentBlock() {
    if (!ME || ME.role !== 'owner') return '';
    var rows = RECENT.map(function (x) {
      var t = new Date(x.created_at), p2 = function (n) { return (n < 10 ? '0' : '') + n; };
      var when = (t.getMonth()+1) + '/' + t.getDate() + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes());
      var pay = x.pay_method === 'cash' ? '現金' : (x.paid_at ? '匯款・已入帳' : '匯款・待入帳');
      return '<div class="pv' + (x.voided ? ' off' : '') + '">' +
        '<div class="pvl">' +
          '<b>' + esc(x.customer_name) + '</b> <span>' + esc(x.phone_tail) + '</span>' +
          '<i>' + when + '　·　' + esc(x.note || '') + '　·　＋' + x.credits +
            ' 堂　·　NT$' + (x.amount == null ? '—' : x.amount) + '　·　' + pay +
            '　·　' + esc(x.created_by_name || '') + ' 入的</i>' +
          (x.voided ? '<u>已沖銷　·　' + esc(x.voided_by_name || '') + '：' +
                      esc(x.void_reason || '') + '</u>' : '') +
        '</div>' +
        (x.voided ? '<span class="pvx">已沖銷</span>'
                  : '<button type="button" class="pvb" data-void="' + esc(x.ledger_id) + '" ' +
                    'data-n="' + esc(x.customer_name) + '" data-c="' + x.credits + '" ' +
                    'data-a="' + (x.amount == null ? '' : x.amount) + '">沖銷</button>') +
      '</div>';
    }).join('');

    // ☢️ Jerec 的第 4 點：使用時機要寫在按鈕【旁邊】，不是寫在手冊裡。
    //    沖銷最大的風險不是被亂按，是【被用在不該用的地方】——
    //    尤其是拿來當退費，那會讓帳上看起來退了、錢其實還在店裡。
    // ☢️ 說明本身沒有變短，但它現在收起來 —— 展開一次讀完就好，
    //    不用每次進後台都先捲過一整頁的注意事項才看得到紀錄。
    return '<div class="sec">最近的購課</div><div class="card">' +
      '<details class="whenuse"><summary>什麼時候該用沖銷？（點開）</summary>' +
        '<b>沖銷用在這三種狀況：</b>' +
        '<ul><li>按錯人（幫 A 買成 B）</li>' +
            '<li>按錯方案（單堂按成買 10 送 2）</li>' +
            '<li>手滑重複按了兩次</li></ul>' +
        '<b class="no">☢️ 這三種不要用沖銷：</b>' +
        '<ul><li><b>客人要退費</b> —— 那要真的把錢退給他。沖銷只會讓帳上看起來退了、錢其實還在店裡。</li>' +
            '<li><b>客人上課上到負數</b> —— 那是他該補買，不是這一筆買錯。</li>' +
            '<li><b>匯款一直沒進來</b> —— 那是「待入帳」的事，先去確認，不要直接抹掉。</li></ul>' +
        '<span class="mini">共同點：沖銷是在說「<b>這件事根本沒發生過</b>」。' +
        '只要事情真的發生過，就不該用它。</span>' +
      '</details>' +
      (RECENT.length ? rows : '<div class="empty">還沒有任何購課紀錄</div>') +
    '</div>';
  }

  // 幫某一位客人購課。☢️ 兩段式：先選方案＋付款方式，再確定。
  //    一鍵直接入帳太快了 —— 這是動到錢的地方，跟點名不一樣。
  function buyPanel(c) {
    if (!PRODUCTS.length) return '<div class="hint">讀不到方案，重新整理看看。</div>';
    // ☢️ 分組。品項從兩個變成四個之後，團體課 400 元和私人課 20,000 元
    //    排在同一串裡，眼睛會滑過去 —— 而按錯的代價是一筆五位數的帳。
    var last = '';
    var body = PRODUCTS.map(function (p) {
      var head = '';
      if (p.product !== last) {
        last = p.product;
        head = '<div class="bgrp">' +
          (p.product === 'GT' ? '團體課' : p.product === 'PT' ? '私人課' : esc(p.product)) +
          '</div>';
      }
      return head +
        '<div class="brl"><b>' + esc(p.label) + '</b><i>＋' + p.credits + ' 堂</i></div>' +
        ['cash','transfer'].map(function (m) {
          return '<button type="button" class="buyb" data-buy="' + esc(c.id) + '" ' +
            'data-code="' + esc(p.code) + '" data-m="' + m + '" ' +
            'data-label="' + esc(p.label) + '" data-price="' + p.price + '" ' +
            'data-credits="' + p.credits + '">NT$' + money(p.price) + '</button>';
        }).join('');
    }).join('');
    return '<div class="buy" data-for="' + esc(c.id) + '">' +
      '<span></span><span class="bhd">現金</span><span class="bhd">匯款</span>' +
      body + '<div class="buyc" hidden></div></div>';
  }

  /* ══ 畫面 ══════════════════════════════════════════════════
     ☢️ 2026-08-17 Jerec：「購課區似乎藏的太深，介面似乎不太直覺」。
        舊順序：待入帳 → 綁不上的人 → 新增客人 → 最近的購課 → 查客人／購課。
        購課在整頁最底下，量出來要捲 2600px 才看得到 ——
        而那是櫃檯【每天都在做】的事，其他幾塊是偶爾才處理一次的。

        新順序：提醒條 → 購課 → 新增客人（收合）→ 待入帳 → 綁不上的人 → 最近的購課。
        ☢️ 警示往下移不能等於看不見 —— 所以最上面那條提醒條照樣講出
           「還有幾件事」，按下去直接捲過去。
     ═══════════════════════════════════════════════════════════ */

  /* 導覽磚。

        ☢️ 官網不在磚裡，它在頂部列 —— 那是「離開後台」，不是後台的一個功能。
        ☢️ 帳務那一組【不是把鍵藏起來就算了】——

  function navBlock() {
    var fin = !!(ME && ME.can_finance);
    var h = '<div class="sec">日常</div><div class="navg">' +

        '<i>團體課出席、扣堂、開課</i></a>' +

        '<i>私人課、企業包班、外派</i></a>' +
      // ☢️ 2026-08-22（第 93 步）：整列。教練看「我的學員」，
      //    負責人和財務在同一頁改歸屬 —— 同一份名單，權限不同而已。
      '<a class="tile wide" href="clients.html"><b>' +
        (fin ? '學員與教練' : '我的學員') + '<span class="ar"></span></b>' +

    }
    // ☢️ 官網不放在這裡 —— 它是「另開分頁離開後台」，跟其他磚的意思不一樣。

    return h;

  // 一行講完還剩幾件事。沒事就整條不出現。
  function alertBar() {
    var bits = [];
    if (UNPAID.length)  bits.push('💰 ' + UNPAID.length + ' 筆匯款待入帳');
    if (SIGNUPS.length) bits.push('⚠️ ' + SIGNUPS.length + ' 人綁不上');
    if (!bits.length) return '';
    return '<div class="alerts"><span>' + bits.join('　·　') + '</span>' +
      '<button type="button" class="algo" data-go="' +
      (UNPAID.length ? 'unpaidBox' : 'stuckBox') + '">去處理<span class="ar"></span></button></div>';
  }

  // ☢️ 2026-08-18 Jerec：「提醒條不是即時的，要按重新整理」。
  //    原因：購課／確認入帳／沖銷做完之後，只重畫了「待入帳」那一塊，
  //    最上面那條提醒條沒人動它，所以數字還停在打開頁面當下。
  //    ☢️ 不能整頁重畫 —— 那會把剛剛的成功訊息一起洗掉（犯過四次了）。
  //       所以包一層固定的 #alertBox，只換它的內容。
  function refreshAlerts() {
    var box = document.getElementById('alertBox');
    if (!box) return;
    box.innerHTML = alertBar();
    wireGo(box);
  }

  // 「去處理」：捲到對應那一區
  function wireGo(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () {
        var t = document.getElementById(b.getAttribute('data-go'));
        if (t) t.scrollIntoView({ behavior:'smooth', block:'start' });
      };
    });
  }

  function stuckBlock() {
    var html = '<div class="sec' + (SIGNUPS.length ? ' hot' : '') + '">' +
      (SIGNUPS.length ? '⚠️ 綁不上的人（' + SIGNUPS.length + '）' : '綁不上的人') + '</div>';
    html += SIGNUPS.length
      ? SIGNUPS.map(sgCard).join('')
      : '<div class="card"><div class="empty">目前沒有人卡住 ✓</div></div>';
    // ☢️ 多位教練同時開這一頁的時候，畫面【不會自己更新】。
    //    別人剛處理掉的那一筆，在你這邊還看得到 —— 不講的話，
    //    兩個人會同時去聯絡同一位客人。
    if (SIGNUPS.length) {
      html += '<div class="hint" style="margin:-2px 3px 0">☢️ 這份清單是<b>打開頁面當下</b>的。' +
              '其他教練同時在處理的話，按上面的<b>重新整理</b>才會看到最新的。</div>';
    }
    return html;
  }

      '<div class="foldb">' +
        '<label for="nName">姓名　<i class="req">*必填</i></label>' +
        '<input id="nName" type="text" placeholder="請輸入中文完整姓名，例如：王曉明" autocomplete="off">' +
        // ☢️ 2026-08-18 這段提示【整個換掉】了。

        '<div class="hint">登記<b>完整中文姓名</b>。他習慣被叫的英文名或綽號填到下面的<b>暱稱</b>，' +
          '客人綁定時<b>打哪一個都會過</b>。</div>' +
        '<label for="nNick">暱稱　<i class="req">*必填</i></label>' +
        '<input id="nNick" type="text" placeholder="例：曉明、Ming" autocomplete="off">' +
        '<label for="nPhone">手機　<i class="req">*必填</i></label>' +
        '<input id="nPhone" type="tel" inputmode="numeric" placeholder="0912345678" autocomplete="off">' +
        '<div class="hint">要跟他綁定時打的<b>完全一樣</b>。</div>' +
        '<button type="button" class="btn" id="nGo">建立客人</button>' +
        '<div class="hint" style="margin-top:9px">☢️ 建出來是 <b>0 堂</b>。' +
          '有買方案的話，建完會直接給你一顆「去幫他購課」。</div>' +
        '<div id="nRes"></div>' +
      '</div></details>';
  }

  /* ══ 課程轉讓 ══════════════════════════════════════════════ */
  function xfPerson(label, who, qid, hid) {
    if (who) {
      return '<label>' + label + '</label><div class="picked2">' + esc(who.name) +
        '<span>' + esc(who.phone_tail || '') + '</span>' +
        '<button type="button" data-xfclr="' + esc(qid) + '">換一個</button></div>';
    }
    return '<label>' + label + '</label>' +
      '<input id="' + qid + '" type="search" placeholder="打名字或手機後三碼" autocomplete="off">' +
      '<div id="' + hid + '" class="xfhits"></div>';
  }

  function xfPlanList() {
    if (!XF.from) return '';
    if (!XF.plans.length) {
      return '<div class="hint" style="margin-top:8px">☢️ 這個人名下沒有可以轉讓的方案。' +
             '（單堂、已經用完的、PGT 都不能轉）</div>';
    }
    return '<label style="margin-top:11px">要轉哪一張</label>' +
      XF.plans.map(function (p) {
        var on = XF.plan && XF.plan.id === p.id;
        return '<div class="xfp' + (on ? ' on' : '') + '" data-xfplan="' + esc(p.id) + '">' +
          '<b>' + esc(p.opened_on) + '</b>　' + esc(p.product) +
          (p.product_label ? '・' + esc(p.product_label) : '') +
          '　<b>剩 ' + p.remaining + ' 堂</b>（共 ' + p.total_credits + '）' +
          (p.basis_status === 'pending'
            ? '<i>☢️ 這批算不出每堂業績基礎（搬遷進來的舊帳）</i>' : '') +
        '</div>';
      }).join('');
  }

  function transferFold() {
    if (!ME || !ME.can_finance) return '';
    var ready = XF.from && XF.plan && XF.to;
    return '<details class="fold" id="xfFold"' + (XFOPEN ? ' open' : '') + '>' +
      '<summary>課程轉讓<span class="cap">把剩餘堂數換人</span><span class="ar"></span></summary>' +
      '<div class="foldb">' +
        xfPerson('誰要轉出', XF.from, 'xfQ', 'xfHits') +
        xfPlanList() +
        (XF.plan ? xfPerson('轉給誰', XF.to, 'xfQ2', 'xfHits2') : '') +
        (XF.plan && XF.to
          ? '<label>備註（選填）</label><input id="xfNote" type="text" placeholder="例：學員不再上課，轉給家人">'
          : '') +
        '<button type="button" class="btn" id="xfGo"' + (ready ? '' : ' disabled') + '>' +
          (ready ? '確認轉讓 ' + XF.plan.remaining + ' 堂' : '選好轉出人、方案、接收人') + '</button>' +
        '<div class="hint" style="margin-top:9px">☢️ 轉讓<b>不產生收入也不產生業績</b>，' +
        '方案編號不變、只換擁有人。原擁有人會永久留在紀錄上。<br>' +
        'PGT 不可轉讓；單堂課程不可轉讓。</div>' +
        '<div id="xfRes"></div>' +
      '</div></details>';
  }

  /* 轉讓的搜尋與按鈕。
     ☢️ 這一段自己搜自己的，不共用上面「幫學員購課」那個 search() ——
        那一支會畫出「購課」按鈕，混進轉讓流程裡人會按錯。 */
  function xfSearch(v, box, pick) {
    var digits = /^\d+$/.test(v);
    var COLS = 'id,name,nickname,phone_tail,balance,is_active';
    var qy = digits
      ? DB.from('staff_customers').select(COLS).limit(8).like('phone', '%' + v)
      : Promise.all([
          DB.from('staff_customers').select(COLS).limit(8).ilike('name', '%' + v + '%'),
          DB.from('staff_customers').select(COLS).limit(8).ilike('nickname', '%' + v + '%')
        ]).then(function (rs) {
          var bad = rs.filter(function (r) { return r.error; })[0];
          if (bad) return { error: bad.error, data: null };
          var seen = {}, out = [];
          rs.forEach(function (r) {
            (r.data || []).forEach(function (c) {
              if (seen[c.id]) return; seen[c.id] = 1; out.push(c);
            });
          });
          return { error: null, data: out.slice(0, 8) };
        });

    qy.then(function (r) {
      if (r.error) { box.innerHTML = '<div class="empty">查不動：' + esc(r.error.message) + '</div>'; return; }
      var d = r.data || [];
      if (!d.length) { box.innerHTML = '<div class="empty">沒有這個人</div>'; return; }
      box.innerHTML = d.map(function (c) {
        return '<div class="xfhit" data-xfpick="' + esc(c.id) + '" data-nm="' + esc(c.name) +
          '" data-tl="' + esc(c.phone_tail || '') + '"><b>' + esc(c.name) + '</b>' +
          // ☢️ 標明是團體課。私人課的卡開始存在之後，
          //    一個沒有前綴的「剩 8 堂」會被當成全部的堂數。
          '<span>' + esc(c.phone_tail || '') + '</span><i>團 ' +
          (c.balance == null ? '—' : c.balance) + ' 堂</i></div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('[data-xfpick]'), function (el) {
        el.onclick = function () {
          pick({ id: el.getAttribute('data-xfpick'),
                 name: el.getAttribute('data-nm'),
                 phone_tail: el.getAttribute('data-tl') });
        };
      });
    }, function (e) {
      box.innerHTML = '<div class="empty">查不動：' + esc(e && e.message || e) + '</div>';
    });
  }

  function xfLoadPlans() {
    // ☢️ 只列【真的能轉】的：還有剩、不是單堂、不是 PGT。
    //    列出來卻按不下去，比不列出來更討厭。
    return DB.from('staff_plans')
      .select('id,product,product_code,product_label,product_kind,total_credits,remaining,basis_status,opened_on')
      .eq('owner_customer_id', XF.from.id)
      .gt('remaining', 0)
      .order('opened_on')
      .then(function (r) {
        var d = (!r.error && r.data) ? r.data : [];
        XF.plans = d.filter(function (p) {
          return p.product !== 'PGT' && p.product_kind !== 'single';
        });
      }, function () { XF.plans = []; });
  }

  function wireTransfer() {
    var fold = document.getElementById('xfFold');
    if (fold) fold.addEventListener('toggle', function () { XFOPEN = fold.open; });

    var t1;
    var q1 = document.getElementById('xfQ');
    if (q1) q1.oninput = function () {
      clearTimeout(t1);
      var v = q1.value.trim();
      var box = document.getElementById('xfHits');
      if (v.length < 1) { box.innerHTML = ''; return; }
      t1 = setTimeout(function () {
        xfSearch(v, box, function (who) {
          XF.from = who; XF.plan = null; XF.to = null; XFOPEN = true;
          xfLoadPlans().then(render);
        });
      }, 260);
    };

    var t2;
    var q2 = document.getElementById('xfQ2');
    if (q2) q2.oninput = function () {
      clearTimeout(t2);
      var v = q2.value.trim();
      var box = document.getElementById('xfHits2');
      if (v.length < 1) { box.innerHTML = ''; return; }
      t2 = setTimeout(function () {
        xfSearch(v, box, function (who) { XF.to = who; XFOPEN = true; render(); });
      }, 260);
    };

    Array.prototype.forEach.call(elMain.querySelectorAll('[data-xfclr]'), function (b) {
      b.onclick = function () {
        if (b.getAttribute('data-xfclr') === 'xfQ') { XF.from = null; XF.plans = []; XF.plan = null; XF.to = null; }
        else { XF.to = null; }
        XFOPEN = true; render();
      };
    });

    Array.prototype.forEach.call(elMain.querySelectorAll('[data-xfplan]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-xfplan');
        XF.plan = XF.plans.filter(function (p) { return p.id === id; })[0] || null;
        XFOPEN = true; render();
      };
    });

    var go = document.getElementById('xfGo');
    if (go) go.onclick = doTransfer;
  }

  function doTransfer() {
    if (XF.busy || !XF.from || !XF.plan || !XF.to) return;
    var note = (document.getElementById('xfNote') || {}).value || '';
    var go = document.getElementById('xfGo');
    XF.busy = true; if (go) { go.disabled = true; go.textContent = '轉讓中…'; }

    DB.rpc('transfer_plan', { p_plan: XF.plan.id, p_to: XF.to.id, p_note: note })
      .then(function (r) {
        XF.busy = false;
        if (r.error) throw new Error(r.error.message);
        // ☢️ 規則擋下來不是錯誤，走 ok:false。訊息是資料庫寫的，直接給人看。
        if (!r.data || r.data.ok === false) throw new Error((r.data && r.data.msg) || '轉不了');
        toast(r.data.credits + ' 堂已從 ' + r.data.from + ' 轉給 ' + r.data.to);
        XF = { from: null, plans: [], plan: null, to: null, busy: false };
        XFOPEN = true;
        return load().then(render);
      })
      .catch(function (e) {
        XF.busy = false;
        toast(String(e && e.message || e), true);
        XFOPEN = true; render();
      });
  }

  function render() {
    elGate.hidden = true; elMain.hidden = false;

    var html = '<div id="alertBox">' + alertBar() + '</div>';

    // ① 購課 —— 櫃檯最常做的事，放最上面、框起來
    html +=
      '<div class="lead">' +
        '<h2>幫學員購課兼查詢</h2>' +
        '<div class="lh">打<b>姓名</b>，或<b>手機後三碼</b>　→　按右邊的<b>購課</b></div>' +
        '<input id="q" type="search" placeholder="例：王小明　或　040" autocomplete="off">' +
        '<div id="hits" style="margin-top:10px"></div>' +
      '</div>';

    // ② 去哪一頁 —— 導覽磚，照用途分組
    html += navBlock();

    // ③ 偶爾才用的兩塊，收起來
    html += '<div class="sec">偶爾才用</div>';
    html += newCustomerFold();
    html += transferFold();

    // ④ 待處理：正常的時候這幾塊【完全不存在】，出現就是有事要辦
    html += '<div id="overBox">' + overBlock() + '</div>';
    html += '<div id="unpaidBox">' + unpaidBlock() + '</div>';
    html += '<div id="stuckBox">' + stuckBlock() + '</div>';
    html += '<div id="recentBox">' + recentBlock() + '</div>';

    elMain.innerHTML = html;
    wire();
  }

  function wire() {
    // 摺疊區記住開闔 —— 重畫之後才不會把剛剛的成功訊息收進去
    var fold = document.getElementById('newFold');
    if (fold) fold.addEventListener('toggle', function () { NEWOPEN = fold.open; });
    wireTransfer();

    wireGo(elMain);
    wireNotify(elMain);

    Array.prototype.forEach.call(elMain.querySelectorAll('[data-new]'), function (b) {
      b.onclick = function () {
        // ☢️ 新增客人現在是收合的。先打開再填，不然填了看不到。
        var f = document.getElementById('newFold');
        if (f) { f.open = true; NEWOPEN = true; }
        document.getElementById('nName').value  = b.getAttribute('data-n');
        document.getElementById('nPhone').value = b.getAttribute('data-p');
        document.getElementById('nName').scrollIntoView({ behavior:'smooth', block:'center' });
        // ☢️ 故意【不】直接建。姓名那一欄正是最常出問題的地方，
        //    要讓教練有機會把「廖庭均 Teresa」改成「廖庭均」再送。
        setTimeout(function () { document.getElementById('nName').focus({ preventScroll:true }); }, 420);
        toast('資料帶好了，確認姓名再按建立');
      };
    });

    document.getElementById('nGo').onclick = createOne;
    wirePaid(elMain);
    wireVoid(elMain);
    wireGoBuy(elMain);

    // ☢️ 2026-08-18：切回來的時候由 liff-auth.js 呼叫，等同按一下「重新整理」。
    //    ☢️ 不重載頁面 —— 新增客人的表單、沖銷的原因欄可能正打到一半。
    window.FFF_AUTH.onResume = function () {
      var b = document.getElementById('reload');
      if (b && DB && ME) b.onclick();
    };

    var rl = document.getElementById('reload');
    if (rl) rl.onclick = function () {
      if (!DB) return;
      rl.disabled = true;
      Promise.all([loadSignups(), loadPurchaseBits()])
        .then(function () { render(); toast('已更新'); },
                         function (e) { toast(String(e.message || e), true); })
                   .then(function () { var r2 = document.getElementById('reload');
                                       if (r2) r2.disabled = false; });
    };

    // 登出：只在瀏覽器裡露出來。☢️ 要按兩下 —— 它就在「重新整理」旁邊，
    //       誤按的代價是整個被丟出去，而教練可能正在幫學員購課。
    var lo = document.getElementById('logout');
    if (lo && window.FFF_AUTH.canLogout) {
      lo.hidden = false;
      lo.onclick = function () {
        if (lo.getAttribute('data-armed') !== '1') {
          lo.setAttribute('data-armed', '1');
          lo.textContent = '確定登出？';
          setTimeout(function () {
            if (lo.getAttribute('data-armed') === '1') {
              lo.removeAttribute('data-armed'); lo.textContent = '登出';
            }
          }, 4000);
          return;
        }
        lo.textContent = '登出中…'; lo.disabled = true;
        window.FFF_AUTH.logout();
      };
    }

    var q = document.getElementById('q'), hits = document.getElementById('hits'), t;
    q.oninput = function () {
      clearTimeout(t);
      var v = q.value.trim();
      if (!v) { hits.innerHTML = ''; return; }
      t = setTimeout(function () { search(v, hits); }, 260);
    };
  }

  // ☢️ 沖銷是兩段：先填原因（必填），再確定。
  //    這裡【故意】比購課還多一道 —— 購課是往前記一件剛發生的事，
  //    沖銷是往回改一件已經記進帳的事。
  function wireVoid(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-void]'), function (b) {
      b.onclick = function () {
        var row = b.parentNode;
        if (row.querySelector('.vf')) { row.querySelector('.vf').remove(); return; }
        var box = document.createElement('div');
        box.className = 'vf';
        box.innerHTML =
          '<div class="vfh">沖銷「' + esc(b.getAttribute('data-n')) + '」的 ＋' +
            b.getAttribute('data-c') + ' 堂' +
            (b.getAttribute('data-a') ? '（NT$' + b.getAttribute('data-a') + '）' : '') + '</div>' +
          '<input type="text" class="vfi" placeholder="為什麼要沖銷？（必填，例：按錯人）" ' +
            'maxlength="60" autocomplete="off">' +
          '<div class="vfa">' +
            '<button type="button" class="vfno">取消</button>' +
            '<button type="button" class="vfgo">確定沖銷</button>' +
          '</div>' +
          '<div class="vfr"></div>';
        row.appendChild(box);
        var inp = box.querySelector('.vfi');
        inp.focus({ preventScroll: true });
        box.querySelector('.vfno').onclick = function () { box.remove(); };
        box.querySelector('.vfgo').onclick = function () {
          doVoid(b.getAttribute('data-void'), inp.value, box);
        };
      };
    });
  }

  function doVoid(ledgerId, why, box) {
    var go = box.querySelector('.vfgo'), res = box.querySelector('.vfr');
    if (String(why || '').trim().length < 2) {
      res.innerHTML = '<div class="res bad">☢️ 一定要填原因。沒有原因的沖銷，' +
                      '三個月後跟「資料被人動過」長得一模一樣。</div>';
      return;
    }
    go.disabled = true; go.textContent = '沖銷中…';
    DB.rpc('void_purchase', { p_ledger: ledgerId, p_why: why })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (!d.ok) {
          var m = { need_reason:'一定要填原因。', not_found:'找不到這一筆。',
                    not_purchase:'這一筆不是購課，不能沖銷。',
                    already_voided:'這一筆已經沖銷過了。' }[d.why] || d.why;
          res.innerHTML = '<div class="res bad">' + esc(m) + '</div>';
          go.disabled = false; go.textContent = '確定沖銷';
          return;
        }
        toast(d.name + '　已沖銷 ' + d.credits + ' 堂　·　現在剩 ' + d.balance + ' 堂');
        // ☢️ 按鈕不能停在「沖銷中…」。做完了就要說做完了 ——
        //    停在進行式會讓人以為卡住，然後再按一次。
        go.textContent = '已沖銷';
        var no = box.querySelector('.vfno');
        if (no) no.textContent = '關閉';

        // ☢️ Jerec：「同時告訴你也可以，雙重保險」—— 給一段可以直接複製的紀錄。
        //    ☢️ 這一段【一定要留在畫面上】。第一版寫完就去重畫整個清單，
        //       結果這句話連同輸入框一起被洗掉 —— 而它正是他要的那份保險。
        res.innerHTML = '<div class="res ok">已沖銷。' +
          '<br><b>傳給 Claude 的話，複製這一段：</b>' +
          '<code class="cp">沖銷　' + esc(d.name) + '　' + d.credits + ' 堂　NT$' +
          (d.amount == null ? '—' : d.amount) + '　原因：' + esc(d.reason) +
          '　→ 現在剩 ' + d.balance + ' 堂</code>' +
          '<button type="button" class="cpb">複製</button></div>';
        res.querySelector('.cpb').onclick = function () {
          copyTo(res.querySelector('.cpb'), res.querySelector('.cp').textContent);
        };

        // ☢️ 就地把那一列改成「已沖銷」，不要重畫整塊 —— 重畫會把上面那段洗掉。
        var row = box.parentNode;
        if (row) {
          row.classList.add('off');
          var btn = row.querySelector('.pvb');
          if (btn) {
            var sp = document.createElement('span');
            sp.className = 'pvx'; sp.textContent = '已沖銷';
            btn.parentNode.replaceChild(sp, btn);
          }
          var u = document.createElement('u');
          u.textContent = '已沖銷　·　' + (ME ? ME.display_name : '') + '：' + d.reason;
          var l = row.querySelector('.pvl');
          if (l) l.appendChild(u);
        }
        RECENT.forEach(function (x) {
          if (x.ledger_id === ledgerId) {
            x.voided = true; x.void_reason = d.reason;
            x.voided_by_name = ME ? ME.display_name : '';
          }
        });

        // 待入帳可能少一筆（沖銷的是匯款的話），那一塊可以安全重畫
        return loadPurchaseBits().then(function () {
          var ub = document.getElementById('unpaidBox');
          if (ub) { ub.innerHTML = unpaidBlock(); wirePaid(ub); }
          refreshAlerts();
        });
      })
      .catch(function (e) {
        res.innerHTML = '<div class="res bad">' + esc(String(e.message || e)) + '</div>';
        go.disabled = false; go.textContent = '確定沖銷';
      });
  }

  /* 調整堂數。
     ☢️ 跟沖銷同一個做法：兩段式，而且理由必填。
        沖銷是「這件事根本沒發生過」，調整是「這件事發生了，但數字記錯了」——
        兩者都是往回改已經記進帳的東西，所以都不給一鍵。
     ☢️ 這裡【不重畫整個清單】。改完就地把「剩 N 堂」換掉，
        因為使用者常常要連續調好幾個人（例如一堂課漏扣四位），
        每改一次就重查一次會把他打到一半的搜尋字清掉。 */
  function wireAdjust(box) {
    Array.prototype.forEach.call(box.querySelectorAll('[data-adj]'), function (b) {
      b.onclick = function () {
        var wrap = b.closest('.hitwrap');
        var old = wrap.querySelector('.vf');
        if (old) { old.remove(); return; }
        var f = document.createElement('div');
        f.className = 'vf';
        f.innerHTML =
          '<div class="vfh">調整「' + esc(b.getAttribute('data-n')) + '」的堂數' +
            '　·　現在剩 ' + b.getAttribute('data-b') + ' 堂</div>' +
          '<input type="number" class="vfi ajn" inputmode="numeric" ' +
            'placeholder="要加減幾堂？補扣打 -1，補回打 1">' +
          '<input type="text" class="vfi ajw" maxlength="80" autocomplete="off" ' +
            'placeholder="為什麼？（必填，要寫得出是哪一天哪一堂）">' +
          '<div class="vfa"><button type="button" class="vfno">取消</button>' +
            '<button type="button" class="vfgo">確定調整</button></div>' +
          '<div class="vfr"><div class="res" style="background:var(--surface2);color:var(--dim);border:1px solid var(--line)">' +
            '☢️ 這一筆會留下你的名字和理由，而且<b>不能刪除</b>。' +
            '寫「調整一下」會被資料庫擋下來 —— 三個月後那句話查不出任何東西。</div></div>';
        wrap.appendChild(f);
        f.querySelector('.ajn').focus({ preventScroll: true });
        f.querySelector('.vfno').onclick = function () { f.remove(); };
        f.querySelector('.vfgo').onclick = function () {
          doAdjust(b.getAttribute('data-adj'), f, b);
        };
      };
    });
  }

  function doAdjust(id, f, btn) {
    var go = f.querySelector('.vfgo'), res = f.querySelector('.vfr');
    var n = Number(f.querySelector('.ajn').value);
    var why = String(f.querySelector('.ajw').value || '').trim();
    if (!n) {
      res.innerHTML = '<div class="res bad">☢️ 要加或要扣幾堂？補扣打 -1，補回打 1。</div>'; return;
    }
    if (why.length < 4) {
      res.innerHTML = '<div class="res bad">☢️ 理由至少四個字，而且要寫得出「為什麼」。' +
                      '例：<b>2026-07-31 Jessica 交叉肌力訓練課後漏扣</b></div>'; return;
    }
    go.disabled = true; go.textContent = '調整中…';
    DB.rpc('adjust_credits', { p_customer: id, p_delta: n, p_why: why })
      .then(function (r) {
        // ☢️ 錯誤不能吞掉（規則 14）。吞掉的話畫面就是「按了沒反應」。
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (!d.ok) {
          res.innerHTML = '<div class="res bad">☢️ ' + esc(d.msg || d.why || '調整不了') + '</div>';
          go.disabled = false; go.textContent = '確定調整';
          return;
        }
        toast(d.name + '　' + (d.delta > 0 ? '＋' : '') + d.delta + ' 堂　·　現在剩 ' + d.after + ' 堂');
        go.textContent = '已調整';
        var no = f.querySelector('.vfno'); if (no) no.textContent = '關閉';
        res.innerHTML = '<div class="res ok">' + esc(d.name) + '：' + d.before + ' → <b>' + d.after +
          ' 堂</b>' + (d.negative ? '　☢️ <b>調完是負的</b> —— 確認一下是不是還有一筆沒補' : '') +
          '<br><span class="mini">理由：' + esc(why) + '　·　登記人：' + esc(ME.display_name) + '</span></div>';
        // 就地把清單上的「剩 N 堂」換掉，不重畫整個搜尋結果
        var bal = btn.parentNode.querySelector('.bal');
        if (bal) {
          bal.textContent = '剩 ' + d.after + ' 堂';
          bal.className = 'bal' + (d.after <= 0 ? ' low' : '');
        }
        btn.setAttribute('data-b', d.after);
      })
      .catch(function (e) {
        res.innerHTML = '<div class="res bad">☢️ ' + esc(String(e && e.message || e)) + '</div>';
        go.disabled = false; go.textContent = '確定調整';
      });
  }

  function wireHits(box) {
    wireAdjust(box);
    Array.prototype.forEach.call(box.querySelectorAll('[data-open]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-open');
        var w = document.getElementById('buy-' + id);
        if (!w) return;
        if (!w.hidden) { w.hidden = true; b.innerHTML = '購課<span class="ar"></span>'; return; }
        var c = HITS.filter(function (x) { return x.id === id; })[0];
        w.innerHTML = buyPanel(c);
        w.hidden = false;
        b.textContent = '收起';
        wireBuy(w);
      };
    });
  }

  function wireBuy(w) {
    Array.prototype.forEach.call(w.querySelectorAll('[data-buy]'), function (b) {
      b.onclick = function () {
        var box = w.querySelector('.buyc');
        Array.prototype.forEach.call(w.querySelectorAll('.buyb'), function (x) {
          x.classList.remove('on');
        });
        b.classList.add('on');
        var m = b.getAttribute('data-m') === 'cash' ? '現金' : '匯款';
        box.hidden = false;
        // ☢️ 一定要再確定一次。這是動到錢的地方 ——
        //    點名按錯只是堂數，這裡按錯是【錢和堂數一起錯】。
        box.innerHTML =
          '<div class="buysum">' + esc(b.getAttribute('data-label')) + '　·　' + m +
            '　·　<b>NT$' + money(b.getAttribute('data-price')) + '</b>　→　加 <b>' +
            b.getAttribute('data-credits') + ' 堂</b>' +
            (b.getAttribute('data-m') === 'transfer'
              ? '<br><span class="warn2">☢️ 匯款：堂數現在就給，會進「待入帳」清單，錢到了要回來按確認。</span>'
              : '') +
          '</div>' +
          '<button type="button" class="buygo">確定，入帳</button>';
        box.querySelector('.buygo').onclick = function () {
          doBuy(b.getAttribute('data-buy'), b.getAttribute('data-code'),
                b.getAttribute('data-m'), box);
        };
      };

  function doBuy(customerId, code, method, box) {
    var go = box.querySelector('.buygo');
    if (!go || go.disabled) return;
    go.disabled = true; go.textContent = '入帳中…';
    DB.rpc('add_purchase', { p_customer: customerId, p_code: code, p_method: method })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (!d.ok) {
          var m = { bad_method:'付款方式不對。', bad_product:'找不到這個方案。',
                    no_customer:'找不到這位客人。', inactive:'這位客人已停用。' }[d.why] || d.why;
          box.innerHTML = '<div class="res bad">' + esc(m) + '</div>';
          return;
        }
        // ☢️ 一定要講清楚是【哪一種】堂數。買了私人課卻寫「現在剩 12 堂」，
        //    櫃檯會以為那是團課 —— 兩種堂數在系統裡是完全分開的兩本帳。
        var kind = d.product === 'GT' ? '團體課'
                 : d.product === 'PT' ? ('私人課' + (d.headcount === 2 ? '（一對二）' : '（一對一）'))
                 : (d.product || '');
        box.innerHTML = '<div class="res ok">' +
          esc(d.name) + '　＋' + d.credits + ' 堂　·　NT$' + d.price +
          '<br>' + esc(kind) + '現在剩 <b>' + d.balance + ' 堂</b>' +
          (d.pending ? '<br>☢️ 已列入<b>待入帳</b>，錢到了記得回來確認。' : '') +
          '</div>';
        toast(d.name + '　＋' + d.credits + ' 堂　·　' + kind + '剩 ' + d.balance + ' 堂');

        // ☢️ 不要整頁重畫。第一版就是這樣，結果剛按完的那句「＋1 堂、現在剩 7 堂」
        //    連同搜尋結果一起被洗掉 —— 教練會不確定自己到底有沒有按成功。
        //    只更新兩塊：這一列的餘額、上面的待入帳清單。
        var row = document.querySelector('#buy-' + customerId);
        var hit = row && row.previousElementSibling;
        // ☢️ add_purchase 回的 balance 是【剛買的那個產品別】的餘額。
        //    以前只賣團體課，所以直接寫進 .bal 沒問題；
        //    現在買一張私人課的卡也會回一個數字 ——
        //    寫進團課那一格的話，畫面會顯示「團課剩 10 堂」而那是私人課的堂數。
        var isGT = (d.product === 'GT');
        var balEl = hit && hit.querySelector(isGT ? '.bal' : '.balpt');
        if (balEl) {
          balEl.textContent = (isGT ? '團 ' : '私 ') + d.balance + ' 堂';
          balEl.hidden = false;
          if (isGT) balEl.classList.toggle('low', Number(d.balance) <= 0);
        }
        HITS.forEach(function (x) {
          if (x.id !== customerId) return;
          if (isGT) x.balance = d.balance; else x.balance_pt = d.balance;
        });

        if (!d.pending) return;                       // 現金：待入帳沒變，不用重讀
        return loadPurchaseBits().then(function () {
          var box = document.getElementById('unpaidBox');
          if (box) { box.innerHTML = unpaidBlock(); wirePaid(box); }
          refreshAlerts();          // ☢️ 提醒條要跟著動，不然要等到下次重新整理才看得到
        });
      })
      .catch(function (e) {
        box.innerHTML = '<div class="res bad">' + esc(String(e.message || e)) + '</div>';
      });
  }

  function wirePaid(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-paid]'), function (b) {
      b.onclick = function () { markPaid(b.getAttribute('data-paid'), b); };

  function markPaid(ledgerId, btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '確認中…';
    DB.rpc('confirm_payment', { p_ledger: ledgerId })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (!d.ok) throw new Error(d.why || '沒有成功');
        toast(d.name + '　已確認入帳');
        return loadPurchaseBits().then(function () {
          var box = document.getElementById('unpaidBox');
          if (box) { box.innerHTML = unpaidBlock(); wirePaid(box); }
          refreshAlerts();
        });
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = '錢到了';
        toast(String(e.message || e), true);
      });
  }

  function createOne() {
    var bn = document.getElementById('nGo'), res = document.getElementById('nRes');
    var name = document.getElementById('nName').value.trim();
    var nick = document.getElementById('nNick').value.trim();
    var phone = document.getElementById('nPhone').value.trim();
    res.innerHTML = '';

    // ☢️ 三欄都必填，而且要在按下去【之前】就講清楚缺哪一個。
    //    等資料庫回「bad_name」再顯示，教練已經多等了一個來回。
    var miss = null;
    if (!name)  miss = ['nName',  '請填姓名（完整中文姓名）。'];
    else if (!nick)  miss = ['nNick',  '請填暱稱 —— 他習慣被叫的那個稱呼。'];
    else if (!phone) miss = ['nPhone', '請填手機。'];
    if (miss) {
      res.innerHTML = '<div class="res bad">' + miss[1] + '</div>';
      document.getElementById(miss[0]).focus();
      return;
    }

    bn.disabled = true; bn.textContent = '建立中…';

    // ☢️ 必填擋在表單這一層，資料庫那一欄【允許空白】——
    //    既有 93 位客人一個暱稱都沒有，資料庫設 NOT NULL 會直接失敗；
    //    而且 Jerec 已經決定「既有已綁定的無需追討」，那它實務上就不是必填。
    DB.rpc('create_customer', { p_name: name, p_phone: phone, p_nickname: nick })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        var d = r.data || {};
        if (d.ok) {
          res.innerHTML = '<div class="res ok">已建立：<b>' + esc(d.name) + '</b>（' + esc(d.phone_tail) + '）' +
            '<br>☢️ 目前 <b>0 堂</b>。請他<b>用自己的手機</b>再綁定一次。</div>' +
            // 十之八九下一步就是幫他購課 —— 不要叫人自己往上捲、再打一次名字
            '<button type="button" class="gobuy" data-buyname="' + esc(d.name) + '">' +
            '去幫他購課<span class="ar"></span></button>';
          document.getElementById('nName').value = '';
          document.getElementById('nNick').value = '';
          document.getElementById('nPhone').value = '';
          // 建完把留言簿重讀一次 —— 那個人應該還在（要等他真的綁成功才會消失）
          return loadSignups().then(function () {
            var keep = document.getElementById('nRes').innerHTML;
            NEWOPEN = true;                 // ☢️ 重畫前先鎖住「展開」，否則成功訊息會被收進去
            render();
            document.getElementById('nRes').innerHTML = keep;
            wireGoBuy(document.getElementById('nRes'));
          });
        }
        var m = { bad_phone:'手機格式不對，要是 09 開頭的 10 碼。',
                  bad_name:'姓名至少要兩個字。' }[d.why];
        if (d.why === 'phone_taken') {
          // ☢️ race = 另一位教練在這幾毫秒之間先建好了。
          //    那不是錯誤，結果就是我們要的 —— 訊息要講成「已經有人建好了」，
          //    不要講成「你做錯了」。
          m = d.race
            ? '<b>剛剛有別的教練同時建好了同一位。</b><br>' +
              '名單上現在是「<b>' + esc(d.name) + '</b>」，不用再建一次。'
            : '這支手機已經是「<b>' + esc(d.name) + '</b>」了' +
              (d.bound ? '，而且已經綁過 LINE' : '，還沒綁 LINE') + '。<br>' +
              '不要重複建 —— 如果是同一個人，請他用<b>這個名字</b>去綁。';
        }
        res.innerHTML = '<div class="res bad">' + (m || esc(d.why || '沒有建立')) + '</div>';
      })
      .catch(function (e) {
        res.innerHTML = '<div class="res bad">' + esc(String(e.message || e)) + '</div>';
      })
      .then(function () {
        var b2 = document.getElementById('nGo');
        if (b2) { b2.disabled = false; b2.textContent = '建立客人'; }
      });
  }

  // 建完客人之後那顆捷徑：把名字填進上面的搜尋框並捲過去

  /* ══ 封存堂數等候區 ═══════════════════════════════════════════
     ☢️ 這一塊存在的理由：孤兒之所以出現，就是因為當初有人把
        「資料不齊的人」放在系統【外面】的資料夾，交接時忘了。
        近期不會再來的人如果留在 Excel，就是用同樣的方式製造
        下一批孤兒。所以他們進系統 —— 只是不進 customers。
     ☢️ 而這一塊真正的價值不是「存起來」，是【教練查名字時系統會自己講】。
        只放在 Excel 的話，要靠人記得去翻，而那正是失敗過一次的做法。
     ═══════════════════════════════════════════════════════════ */
  function legacyCards(rows, custs) {

          }).join('')
        : '<div class="lgnote">這個人系統裡還沒有 —— ' +
          '請先用下面的<b>新增客人</b>建檔（要手機），建完再回來這裡按轉入。</div>';
      return '<div class="lg">' +
        '<div class="lgh">封存區　<b>' + esc(g.name) + '</b>　<span>' + g.credits + ' 堂</span></div>' +
        '<div class="lgm">' + esc(g.source || '舊表') +
          '　·　☢️ 堂數還有效，只是這個人還沒建檔</div>' +
        '<div class="lga">' + opts + '</div>' +
        '<div class="lgr"></div>' +
      '</div>';
    }).join('');
  }

  function search(v, box) {
    var digits = /^\d+$/.test(v);
    var COLS = 'id,name,nickname,phone_tail,balance,balance_pt,bound,is_active';

    // ☢️ 姓名和暱稱各查一次再合併，【不用】PostgREST 的 or() ——
    //    or() 是把條件塞進網址的字串，客人名字裡只要有逗號或括號就會把它拆壞。
    //    兩次查詢多一個來回，但沒有「某些名字會查不動」這種難查的坑。
    var qy = digits
      ? DB.from('staff_customers').select(COLS).limit(10).like('phone', '%' + v)
      : Promise.all([
          DB.from('staff_customers').select(COLS).limit(10).ilike('name', '%' + v + '%'),
          DB.from('staff_customers').select(COLS).limit(10).ilike('nickname', '%' + v + '%')
        ]).then(function (rs) {
          var bad = rs.filter(function (r) { return r.error; })[0];
          if (bad) return { error: bad.error, data: null };
          var seen = {}, out = [];
          rs.forEach(function (r) {
            (r.data || []).forEach(function (c) {
              if (seen[c.id]) return;
              seen[c.id] = 1; out.push(c);
            });
          });
          return { error: null, data: out.slice(0, 10) };
        });

    // ☢️ 封存區只有名字，沒有手機 —— 所以只在「用名字查」的時候才查它。
    var lq = digits
      ? Promise.resolve([])
      : DB.from('staff_legacy').select('legacy_id,name,credits,source,claimed')
          .eq('claimed', false).ilike('name', '%' + v + '%').limit(5)
          .then(function (r) { return (!r.error && r.data) ? r.data : []; },
                function () { return []; });

    qy.then(function (r) {
      // ☢️ 查不動要說出來（規則 14）。空白畫面跟「查無此人」意思完全不同。
      if (r.error) { box.innerHTML = '<div class="res bad">查不動：' + esc(r.error.message) + '</div>'; return; }
      var rows = r.data || [];

      HITS = rows;
      lq.then(function (lg) { paintHits(rows, lg, box); });
    });
  }

  function paintHits(rows, lg, box) {
      box.innerHTML = rows.map(function (c) {
        var b = Number(c.balance);
        return '<div class="hitwrap">' +
          '<div class="hit">' +
            '<span class="hl">' +
              '<span class="hn">' + esc(c.name) +
                (c.nickname ? '<i class="nk">' + esc(c.nickname) + '</i>' : '') +
                (c.is_active === false ? '（已停用）' : '') + '</span>' +
              '<span class="hm">' +
                '<span class="tl">' + esc(c.phone_tail) + '</span>' +
                '<span class="bd ' + (c.bound ? 'y">已綁定' : 'n">未綁定') + '</span>' +
                // ☢️ 團課和私人課【分兩格寫】，不要加起來 ——
                //    一堂團課 333 元、一堂私人課 1,500～2,000 元，
                //    加總出來的那個數字不代表任何東西。
                //    私人課 0 堂的人不畫（223 位裡目前每一位都是 0）。
                '<span class="bal' + (b <= 0 ? ' low' : '') + '">團 ' + b + ' 堂</span>' +
                '<span class="bal balpt"' + (Number(c.balance_pt) ? '' : ' hidden') + '>私 ' +
                  Number(c.balance_pt || 0) + ' 堂</span>' +
                // ☢️ 調整堂數是【財務限定】。一堂等於錢，而且它沒有課次名單背書，
                //    只有理由 —— 所以跟薪資、對帳同一道牆。
                ((ME && ME.can_finance && c.is_active !== false)
                  ? '<button type="button" class="adjb" data-adj="' + esc(c.id) +
                    '" data-n="' + esc(c.name) + '" data-b="' + b + '">調整</button>' : '') +
              '</span>' +
            '</span>' +
            (c.is_active === false ? '' :
              '<button type="button" class="hitbuy" data-open="' + esc(c.id) + '">購課<span class="ar"></span></button>') +
          '</div>' +
          '<div class="buywrap" id="buy-' + esc(c.id) + '" hidden></div>' +
        '</div>';
      }).join('') + legacyCards(lg, rows);
      if (!rows.length && !lg.length) box.innerHTML = '<div class="empty">沒有符合的人</div>';
      wireHits(box);
      wireLegacy(box);
  }

  /* ══ 開場 ══════════════════════════════════════════════════ */
  function boot() {
    if (!window.FFF_AUTH || !window.FFF_AUTH.ready) {
      gate('err', '身分程式沒載進來', 'liff-auth.js 沒跑起來'); return;
    }
    window.FFF_AUTH.ready.then(function () {
      var st = window.FFF_AUTH.state;
      if (st === 'browsing') {
        elSub.textContent = '未登入';
        // ☢️ browsing 有三種原因，只有「在瀏覽器、還沒登入」這一種按一下就能救。
        if (window.FFF_AUTH.canLogin) { gateLogin(); return; }
        gate('err', '要從 LINE 裡面開', '請在 LINE 的聊天室點連結，不要複製到瀏覽器'); return;
      }
      // ☢️ 2026-08-18：state 還停在 checking，代表 liff-auth 正要跳去 LINE 重新登入。
      //    以前這裡沒擋 —— 程式會【直接往下走】把整個後台畫出來，
      //    彷彿已經登入。實際上憑證是壞的，查詢會全部回空 ——
      //    畫面看起來正常，資料卻是空的，那比一個明白的錯誤更糟。
      if (st === 'checking') {
        elSub.textContent = '重新登入中';
        gate('', '正在重新登入…', '登入過期了，馬上跳到 LINE 幫你換一張');
        return;
      }
      if (st === 'error') {
        elSub.textContent = '辨識失敗';
        // ☢️ 2026-08-18：本來這裡只丟出 FFF_AUTH.error（例如 line_verify_failed）——
        //    一行看不懂的英文，而且沒有任何可以按的東西。
        //    憑證過期是【按一下就能救】的，errorNote 有寫給人看的那一句。
        if (window.FFF_AUTH.canLogin) {
          gateLogin('登入過期了',
                    (window.FFF_AUTH.errorNote || '按下面重新登入就好。') +
                    '（' + (window.FFF_AUTH.error || '') + '）',
                    '重新登入');
          return;
        }
        gate('err', '辨識失敗',
             (window.FFF_AUTH.errorNote ? window.FFF_AUTH.errorNote + '　' : '') +
             (window.FFF_AUTH.error || '')); return;
      }
      if (!window.fffDB) { gate('err', '資料庫連線沒建立', 'no_fffDB'); return; }
      DB = window.fffDB;

      DB.auth.getUser().then(function (u) {
        if (u.error || !u.data || !u.data.user) {
          gate('err', '拿不到登入身分', (u.error && u.error.message) || 'no_user'); return;
        }
        return DB.from('employees')
          .select('id,display_name,role,is_active,can_finance')
          .eq('auth_user_id', u.data.user.id)
          .then(function (r) {
            if (r.error) throw new Error(r.error.message);
            if (!r.data || !r.data.length) {
              // ☢️ 2026-08-17 現場發現：原本只寫「先開 staff.html」，
              //    但畫面上沒有連結、也沒有代號 —— 等於叫人自己去記網址。
              //    未開通的人【本來就沒辦法】照做，這種指示形同沒有。
              elSub.textContent = '未開通';
              elGate.className = 'gate err';
              elGate.innerHTML =
                '<div class="g1">你的帳號還沒開通</div>' +
                '<div class="g2">按下面拿到你的登入代號，傳給 Jerec 就可以開通。</div>' +
                '<a class="btn" style="max-width:280px;margin:16px auto 0;display:block;' +
                'text-align:center;text-decoration:none" href="staff.html">拿我的登入代號<span class="ar"></span></a>';
              elGate.hidden = false; elMain.hidden = true;
              return;
            }
            ME = r.data[0];
            if (ME.is_active === false) {
              gate('err', ME.display_name + '　已停用', '如果這是誤設，請找 Jerec'); return;
            }
            elWho.textContent = ME.display_name;
            elSub.textContent = '教練後台';
            // ☢️ 帳務那三塊改由 navBlock() 依 ME.can_finance 決定要不要畫出來。
            //    藏起來只是不要讓人白按 —— 真正的牆在資料庫的 is_finance()。
            gate('', '讀取中…', '');
            return loadSignups()
              .then(loadPurchaseBits)
              .then(render, function (e) {
                gate('err', '讀不到留言簿', String(e.message || e));
              });
          });
      }).catch(function (e) {
        gate('err', '出事了', String(e.message || e));
      });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
