<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>薪資報表 · FFF</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  薪資報表 —— 第 80 步 · 2026-08-20

  網址：https://liff.line.me/2011063116-QOxXN30h/payroll.html

  ☢️ 這一頁【改不動任何一塊錢的薪水】。它會寫三種東西 ——
     結算、重開、記薪水發了沒 —— 但那三件事都不會改變「該發多少」。
     算薪水的工具改得動薪水，就沒有意義了。

  ☢️ 第 94 步起，數字來自 month_report(月份)，不是 payroll_month()。
     結過的月份它回【結算當下封存的那一份】，沒結過才即時算。
     這是整個月結的重點：發給教練的那張紙，跟三個月後打開這一頁看到的，
     必須是同一組數字。

  ☢️ 權限的牆在【資料庫】。month_report() 第一件事就是 is_finance()，
     不是財務的人就算自己打這個網址進來，也是一筆都拿不到。
     前端擋一次只是為了給看得懂的訊息。

  ☢️ 這一頁【用月份，不用日期區間】。
     規則文件第六篇 1：「每月為一個結算週期」，而且 80,000 元的抽成門檻
     是【當月累計】—— 抓半個月來看，門檻會算錯，而且錯得很合理，
     不會有任何地方報錯。所以這裡沒有起訖日，只有月份。
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0E2A3B; --ink2:#1C4257; --blue:#2E86AB; --teal:#6FBAC9;
    --bg:#F4F8FA; --surface:#FFF; --surface2:#EDF4F7;
    --line:#DCE8EE; --dim:#587589; --faint:#93AEBD;
    --ok:#2F6B54; --ok-bg:#E4F0EA; --ok-line:#B9D8C8;
    --warn:#B4661F; --warn-bg:#FBEFE2; --warn-line:#EBC4A0;
    --err:#A4211A; --err-bg:#FBE9E7; --err-line:#F3C9C5;
  }
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:44px}

  .top{background:var(--ink);color:#fff;padding:13px 13px;display:flex;align-items:center;gap:6px}
  .who{font-size:16px;font-weight:800;letter-spacing:.03em}
  .sub{font-size:11px;color:#A9C6D4;margin-top:1px}
  .sp{flex:1}
  .who,.sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ar{display:inline-block;flex:0 0 auto;width:9px;height:9px;
    border-right:2.6px solid currentColor;border-top:2.6px solid currentColor;
    border-radius:1.5px;transform:rotate(45deg);
    font-size:0;line-height:0;vertical-align:middle;margin:0 3px 1px 5px}
  .iconbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;
    padding:9px 10px;font-family:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;flex:0 0 auto;
    cursor:pointer;line-height:1.5}
  .iconbtn:active{background:rgba(255,255,255,.25)}

  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 13px;margin-bottom:12px}
  .h{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint);margin:16px 3px 8px}

  /* ── 月份挑選 ── */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;
    font-family:inherit;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .dates{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
  .dates input{flex:1;min-width:0;font-family:inherit;font-size:14px;color:var(--ink);
    background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px}

  /* ── 合計 ── */
  .sums{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .sum{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
  .sum .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
  .sum .v{font-size:21px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
  .sum .n{font-size:11.5px;color:var(--faint);margin-top:-2px}
  .sum.big{grid-column:1 / -1;background:var(--ok-bg);border-color:var(--ok-line)}
  .sum.big .v{color:var(--ok);font-size:26px}
  .sum.bad{grid-column:1 / -1;background:var(--err-bg);border-color:var(--err-line)}
  .sum.bad .v{color:var(--err);font-size:17px}

  /* ── 每位教練 ── */
  .pc{border-top:1px solid var(--line);padding:10px 2px}
  .pc:first-child{border-top:0}
  .pc-h{display:flex;align-items:baseline;gap:7px;cursor:pointer}
  .pc-nm{font-size:15px;font-weight:800}
  .pc-tot{margin-left:auto;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .pc-br{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--dim);margin-top:2px}
  .pc-br b{font-variant-numeric:tabular-nums;color:var(--ink2)}
  .pc-fold{margin-top:8px;border-left:2px solid var(--line);padding-left:9px}
  .ln{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--dim);
    padding:3px 0;border-top:1px dotted var(--line)}
  .ln:first-child{border-top:0}
  .ln-w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ln-a{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2)}
  .ln.held{color:var(--err)}

  .kind{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;
    border:1px solid var(--line);background:var(--surface2);color:var(--ink2);margin-right:5px}
  .kind.gt{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .kind.perf{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

  .prob{border-top:1px solid var(--line);padding:8px 2px;font-size:12.5px}
  .prob:first-child{border-top:0}
  .prob b{font-size:13.5px}
  .prob .why{color:var(--dim);font-size:11.5px}

  .btn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:11px;
    padding:14px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .btn:active{background:var(--ink2)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--line);
    font-size:13.5px;padding:11px;margin-top:10px}

  /* 第 84 步：職級與加給的設定。☢️ 類別名一律 cfg- 開頭 ——
     動手前搜過整份檔案確定沒撞名（第 62 步被 .lg 撞過，版面壞掉又不報錯）。 */
  .cfg-box{margin-top:16px}
  .cfg-box>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    font-size:13.5px;font-weight:800;color:var(--ink2)}
  .cfg-box>summary::-webkit-details-marker{display:none}
  .cfg-cap{font-weight:400;font-size:11.5px;color:var(--faint)}
  .cfg-ar{margin-left:auto;display:inline-block;width:8px;height:8px;
    border-right:2.4px solid var(--faint);border-bottom:2.4px solid var(--faint);
    border-radius:1.5px;transform:rotate(45deg);transition:transform .15s}
  .cfg-box[open]>summary .cfg-ar{transform:rotate(-135deg)}
  .cfg-r{border-top:1px solid var(--line);padding:9px 2px;display:flex;align-items:baseline;gap:7px;
    flex-wrap:wrap}
  .cfg-r:first-child{border-top:0}
  .cfg-nm{font-size:14px;font-weight:800}
  .cfg-t{font-size:11.5px;color:var(--dim)}
  .cfg-t b{color:var(--ink2)}
  .cfg-x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--ink2);font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer}
  .cfg-x:active{background:var(--surface2)}
  .cfg-f{width:100%;margin-top:7px;padding:10px;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;display:grid;gap:7px}
  .cfg-f label{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em}
  .cfg-f input,.cfg-f select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  .cfg-go{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px;
    font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .cfg-go:disabled{opacity:.5}
  .cfg-no{background:none;border:0;color:var(--dim);font-family:inherit;font-size:12px;
    cursor:pointer;padding:4px}
  .cfg-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
  .cfg-tag.sup{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}

  /* 第 94 步：月結。☢️ 類別名一律 mc- 開頭 —— 動手前搜過整份檔案確定沒撞名。 */
  .mc-box{border-radius:14px;padding:13px;margin-bottom:12px;border:1px solid var(--line);
    background:var(--surface)}
  .mc-box.done{background:var(--ok-bg);border-color:var(--ok-line)}
  .mc-box.live{background:var(--warn-bg);border-color:var(--warn-line)}
  .mc-t{font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .mc-box.done .mc-t{color:var(--ok)}
  /* ☢️ 同上：var(--warn) 壓在 --warn-bg 上量出來只有 3.82:1。
     這一行是整塊裡最重要的字，壓深到 #8F5017（5.58:1）。 */
  .mc-box.live .mc-t{color:#8F5017}
  .mc-t small{font-weight:600;font-size:11.5px;color:var(--dim)}
  .mc-w{font-size:12.5px;margin-top:7px;padding:7px 9px;border-radius:9px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
  .mc-w.stop{background:var(--err-bg);border-color:var(--err-line);color:var(--err);font-weight:700}
  .mc-w+.mc-w{margin-top:5px}
  .mc-go{width:100%;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:11px;
    padding:13px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer}
  .mc-go:disabled{opacity:.45}
  /* ☢️ 不能直接用 var(--warn) #B4661F —— 白字壓上去只有 4.34:1，
     而這顆鍵的字是 14.5px 粗體（還構不上「大字」的門檻，要 4.5:1）。
     壓深到 #8F5017 才夠。實際量的是【算圖後的像素】，不是宣告的色碼。 */
  .mc-go.warnish{background:#8F5017}
  .mc-un{background:none;border:1px solid var(--line);color:var(--dim);border-radius:9px;
    font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;margin-top:9px;cursor:pointer}
  .mc-f{width:100%;margin-top:9px;padding:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;display:grid;gap:7px}
  .mc-f label{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em}
  .mc-f input,.mc-f select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  .mc-p{border-top:1px solid var(--line);padding:9px 2px;display:flex;align-items:baseline;
    gap:7px;flex-wrap:wrap}
  .mc-p:first-child{border-top:0}
  .mc-nm{font-size:14px;font-weight:800}
  .mc-amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .mc-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;
    border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn)}
  .mc-tag.paid{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
  .mc-x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--ink2);font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer}

  .note{font-size:11.5px;color:var(--dim);margin-top:8px}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:16px 4px}
  .gate{padding:56px 20px;text-align:center}
  .gate .g1{font-size:17px;font-weight:800;color:var(--ink)}
  .gate.err .g1{color:var(--err)}
  .gate .g2{font-size:12.5px;color:var(--dim);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;
    font-size:13px;font-weight:600;max-width:88%;text-align:center;z-index:50}
  .toast.bad{background:var(--err)}
  [hidden]{display:none !important}

  @media (min-width:1000px){
    :root{--col:640px}
    .top,.wrap{zoom:1.22}
    .wrap{max-width:var(--col)}
    .top{padding-inline:max(13px, calc((100% - var(--col)) / 2 + 14px))}
  }
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="who" id="who">薪資報表</div>
    <div class="sub" id="whoSub">辨識中…</div>
  </div>
  <div class="sp"></div>
  <a class="iconbtn" href="staff-tools.html">後台<span class="ar"></span></a>
  <button type="button" class="iconbtn" id="reload">重新整理</button>
</div>

<div class="wrap">
  <div id="gate" class="gate"><div class="g1">辨識中…</div><div class="g2">跟資料庫確認你是誰</div></div>
  <div id="main" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="liff-auth.js"></script>
<script src="xlsx-lite.js"></script>

<script>
(function () {
  'use strict';

  var DB = null, ME = null, DATA = null, BUSY = false, OPEN = {};
  // 第 84 步：職級與加給的設定資料。☢️ 讀不到不該擋住薪資報表 ——
  //    設定是「偶爾才動」的東西，薪資是「每個月一定要看」的東西。
  var EMPS = [], GRADES = [], ALLOW = [], CFGFORM = null, CFGBUSY = false;
  var CFGOPEN = false;   // 摺疊區是不是展開的（render 之後要記得還原）
  // 第 94 步：月結。REP 是 month_report 的整包回傳，DATA 只是它裡面的 payroll。
  var REP = null, MCFORM = null, MCBUSY = false;
  var elGate = document.getElementById('gate');
  var elMain = document.getElementById('main');
  var elWho  = document.getElementById('who');
  var elSub  = document.getElementById('whoSub');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function gate(cls, t1, t2) {
    elGate.className = 'gate' + (cls ? ' ' + cls : '');
    elGate.innerHTML = '<div class="g1">' + esc(t1) + '</div><div class="g2">' + esc(t2||'') + '</div>';
    elGate.hidden = false; elMain.hidden = true;
  }
  var toastTimer;
  function toast(msg, bad) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var d = document.createElement('div');
    d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg;
    document.body.appendChild(d);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ d.remove(); }, bad ? 4200 : 2200);
  }
  function money(n) { return 'NT$' + Number(n || 0).toLocaleString('en-US'); }

  /* ☢️ 一律用【台北時間的今天】算月份，不是 toISOString()。
        toISOString() 給 UTC —— 每個月 1 號的凌晨 0 點到 8 點之間，
        它會回上個月。那正好是「月初來算上個月薪水」最可能發生的時段。 */
  function twToday() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
  }
  function twMonth() { return twToday().slice(0, 7); }              // YYYY-MM
  function prevMonth(ym) {
    var y = +ym.slice(0,4), m = +ym.slice(5,7) - 1;
    if (m === 0) { y -= 1; m = 12; }
    return y + '-' + (m < 10 ? '0' + m : m);
  }
  function twStamp(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return String(iso).slice(5, 16).replace('T', ' ');
    return d.toLocaleString('zh-TW', { timeZone:'Asia/Taipei', month:'2-digit', day:'2-digit',
                                       hour:'2-digit', minute:'2-digit', hour12:false });
  }

  /* ☢️ 新系統的帳從 2026-08 開始。
     在那之前的月份，系統裡只有搬遷進來的課次 —— 沒有職務加給、沒有服務紀錄、
     沒有職級核定。硬算會跑出一個【看起來像答案的錯數字】，而且沒有任何地方
     會說它不完整。
     決定（Jerec 2026-08-20）：八月起正式計算，舊的封存在系統外的檔案庫。 */
  var SYSTEM_START = '2026-08';

  function monthFirst() { return twMonth() + '-01'; }

  var MONTH = twMonth();

  var KINDS = { perf:'抽成', gt:'GT', event:'活動', allowance:'加給' };

  /* ══ 畫面 ══════════════════════════════════════════════════════ */
  function pickerBlock() {
    var cur = twMonth(), prev = prevMonth(cur);
    // ☢️ 上個月如果早於系統起點，那顆鍵不要出現 —— 出現卻按不出正確答案更糟
    var showPrev = prev >= SYSTEM_START;
    return '<div class="card">' +
      '<div class="chips">' +
        '<button type="button" class="chip' + (MONTH===cur?' on':'') + '" data-m="' + cur + '">這個月</button>' +
        (showPrev
          ? '<button type="button" class="chip' + (MONTH===prev?' on':'') + '" data-m="' + prev + '">上個月</button>'
          : '') +
      '</div>' +
      '<div class="dates"><span>月份</span>' +
        '<input type="month" id="dM" value="' + esc(MONTH) + '" ' +
          'min="' + esc(SYSTEM_START) + '" max="' + esc(cur) + '">' +
      '</div>' +
    '</div>';
  }

  // ☢️ input 的 min 只是「不好挑」，不是「挑不到」——
  //    手動打字、或瀏覽器不支援 min 的時候還是進得來。所以這裡再擋一次。
  function tooEarlyBlock() {
    if (MONTH >= SYSTEM_START) return '';
    return '<div class="card" style="background:var(--err-bg);border-color:var(--err-line)">' +
      '<div style="font-size:14px;font-weight:800;color:var(--err)">☢️ ' + esc(MONTH) +
        ' 在新系統上線之前，這個數字不能拿來計薪</div>' +
      '<div class="note">系統的帳從 <b>' + SYSTEM_START + '</b> 開始。在那之前只有搬遷進來的課次 ——' +
        '<b>沒有職務加給、沒有服務紀錄、沒有職級核定</b>。' +
        '下面算得出東西，但它不完整，而且不完整的地方不會自己顯示出來。<br>' +
        '舊月份的薪資在系統外的檔案庫。</div></div>';
  }

  function sumsBlock() {
    var r = DATA.rows || [];
    var perf = 0, gt = 0, ev = 0, al = 0, tot = 0;
    r.forEach(function (x) {
      perf += x.perf; gt += x.gt; ev += x.event; al += x.allowance; tot += x.total;
    });
    var nHold = (DATA.holds || []).length, nWarn = (DATA.warns || []).length;
    var h = '<div class="sums">' +
      '<div class="sum"><div class="k">PT＋PGT 抽成</div><div class="v">' + money(perf) + '</div>' +
        '<div class="n">含外派與企業包班</div></div>' +
      '<div class="sum"><div class="k">GT 鐘點費</div><div class="v">' + money(gt) + '</div>' +
        '<div class="n">按每堂到場人數</div></div>' +
      '<div class="sum"><div class="k">活動鐘點費</div><div class="v">' + money(ev) + '</div>' +
        '<div class="n">諧動外派活動</div></div>' +
      '<div class="sum"><div class="k">固定加給</div><div class="v">' + money(al) + '</div>' +
        '<div class="n">不影響抽成級距</div></div>' +
      '<div class="sum big"><div class="k">' + esc(DATA.month) + ' 全部教練合計</div>' +
        '<div class="v">' + money(tot) + '</div>' +
        '<div class="n">' + r.length + ' 位教練</div></div>';
    if (nHold) {
      h += '<div class="sum bad"><div class="k">有東西算不出來</div>' +
           '<div class="v">' + nHold + ' 筆暫停自動計薪</div>' +
           '<div class="n">☢️ 這些【沒有】算進上面的合計，要人工核定</div></div>';
    }
    if (nWarn) {
      h += '<div class="sum" style="grid-column:1 / -1;background:var(--warn-bg);border-color:var(--warn-line)">' +
           '<div class="k" style="color:var(--warn)">要看一眼</div>' +
           '<div class="v" style="color:var(--warn);font-size:17px">' + nWarn + ' 筆到場但沒扣堂</div>' +
           '<div class="n">已經算進合計了。體驗／免費／贈課是正常的</div></div>';
    }
    return h + '</div>';
  }

  function coachBlock() {
    var r = DATA.rows || [];
    if (!r.length) return '<div class="card"><div class="empty">這個月沒有任何可計薪的紀錄</div></div>';
    var byCoach = {};
    (DATA.lines || []).forEach(function (l) {
      (byCoach[l.coach_name] = byCoach[l.coach_name] || []).push(l);
    });
    return '<div class="card">' + r.map(function (x) {
      var open = !!OPEN[x.coach_name];
      var br = [];
      if (x.perf)      br.push('抽成 <b>' + money(x.perf) + '</b>（業績 ' + money(x.perf_base) + '）');
      if (x.gt)        br.push('GT <b>' + money(x.gt) + '</b>（' + x.gt_classes + ' 堂・' + x.gt_heads + ' 人次）');
      if (x.event)     br.push('活動 <b>' + money(x.event) + '</b>（' + x.event_hours + ' 小時）');
      if (x.allowance) br.push('加給 <b>' + money(x.allowance) + '</b>');
      if (x.hold_n)    br.push('<span style="color:var(--err)">☢️ ' + x.hold_n + ' 筆暫停</span>');
      var lines = (byCoach[x.coach_name] || []).map(function (l) {
        return '<div class="ln' + (l.hold ? ' held' : '') + '">' +
          '<span class="ln-w"><span class="kind ' + esc(l.kind) + '">' +
            esc(KINDS[l.kind] || l.kind) + '</span>' +
            esc(twStamp(l.done_at)) + '　' + esc(l.label || '') +
            (l.kind === 'gt' ? '　' + l.qty + ' 人' : '') +
            (l.kind === 'allowance' ? '　' + l.qty + ' 天' : '') +
            (l.kind === 'perf' ? '　業績 ' + money(l.base) + ' × ' +
                                 Math.round(Number(l.rate) * 100) + '%↑' : '') +
            (l.kind === 'event' ? '　' + l.base + ' 小時 × 600' : '') +
          '</span>' +
          '<span class="ln-a">' + (l.hold ? '暫停' : money(Math.round(l.amount * 100) / 100)) + '</span>' +
        '</div>';
      }).join('');
      return '<div class="pc">' +
        '<div class="pc-h" data-coach="' + esc(x.coach_name) + '">' +
          '<span class="pc-nm">' + esc(x.coach_name) + '</span>' +
          '<span class="pc-tot">' + money(x.total) + '</span>' +
        '</div>' +
        '<div class="pc-br">' + br.join('　·　') + '</div>' +
        (open ? '<div class="pc-fold">' + (lines || '<div class="ln">沒有明細</div>') + '</div>' : '') +
      '</div>';
    }).join('') +
    '<div class="note">點教練名字展開逐筆明細。' +
    '☢️ 明細的金額是<b>原始精度</b>；上面的小計才是四捨五入後的數字，' +
    '而且是<b>四類各自</b>取整再相加（規則第六篇 1：不得逐筆取整）。</div></div>';
  }

  function holdBlock() {
    var h = DATA.holds || [];
    if (!h.length) return '';
    return '<div class="h">☢️ 暫停自動計薪（' + h.length + '）</div><div class="card">' +
      h.map(function (x) {
        return '<div class="prob"><b>' + esc(x.coach_name) + '</b>　' +
          esc(twStamp(x.done_at)) + '　' + esc(x.label || '') +
          '<div class="why">' + esc(x.hold_why || '') + '</div></div>';
      }).join('') +
      '<div class="note">規則第六篇 6：必要欄位待確認時<b>該筆暫不自動計薪</b>。' +
      '這些<b>沒有</b>算進任何人的合計 —— 處理完重新整理就會自己進去。</div></div>';
  }

  function warnBlock() {
    var w = DATA.warns || [];
    if (!w.length) return '';
    return '<div class="h">要看一眼（' + w.length + '）</div><div class="card">' +
      w.map(function (x) {
        return '<div class="prob"><b>' + esc(x.coach_name) + '</b>　' +
          esc(twStamp(x.done_at)) + '　' + esc(x.label || '') + '　·　' + esc(x.who || '') +
          '<div class="why">' + esc(x.why || '') + '</div></div>';
      }).join('') +
      '<div class="note">☢️ 這些<b>已經算進合計了</b>。規則第五篇 3：體驗、免費、贈課、補課' +
      '只要實際到場就要列入人數 —— 那些正好也是沒扣堂數的，所以系統分不出來，' +
      '只能列出來給你看。點名點錯的話要回點名頁改。</div></div>';
  }

  function downloadBlock() {
    return '<div class="h">下載</div><div class="card">' +
      '<button type="button" class="btn" id="dl">下載 Excel（4 個工作表）</button>' +
      '<div class="note">每人小計 ' + (DATA.rows||[]).length + ' 位　·　逐筆明細 ' +
        (DATA.lines||[]).length + ' 筆　·　暫停 ' + (DATA.holds||[]).length +
        ' 筆　·　提醒 ' + (DATA.warns||[]).length + ' 筆' +
        '<br>規則版本 ' + esc(DATA.rule_version) + '　·　資料時間 ' + esc(DATA.made_at) + '</div>' +
      (window.FFF_AUTH.canLogout
        ? '<button type="button" class="btn ghost" id="logout">登出這台電腦</button>' +
          '<div class="note">用完<b>公用電腦</b>請按這個。不按的話下一個開這個網址的人就是你。</div>'
        : '') +
    '</div>';
  }

  /* ══ 職級與加給（第 84 步）══════════════════════════════════════
     ☢️ 這兩張表【只有財務寫得進去】—— 牆在資料庫的 RLS，不在這一頁。
        前端把區塊藏起來只是不要讓人白按。

     ☢️ 職級存的是「從哪一天起」的異動史，不是一個開關。
        規則第五篇 2：「職級於月中生效或停止時，以生效日前後的實際業績
        分段套用相應比例。」直接改一個欄位的話，上個月已經結完的薪資
        會跟著一起變 —— 那是重算歷史，不是改設定。 */

  function gradeOn(empId, onDate) {
    var best = null;
    GRADES.forEach(function (g) {
      if (g.employee_id !== empId) return;
      if (g.effective_from > onDate) return;
      if (!best || g.effective_from > best.effective_from) best = g;
    });
    return best ? best.grade : 'regular';   // 查不到＝一般教練（規則第五篇 2）
  }

  function cfgGradeRows() {
    var d = twToday();
    return EMPS.filter(function (e) { return e.can_teach && e.is_active !== false; })
      .map(function (e) {
        var g = gradeOn(e.id, d);
        var mine = GRADES.filter(function (x) { return x.employee_id === e.id; })
          .sort(function (a, b) { return a.effective_from < b.effective_from ? 1 : -1; });
        var since = mine.length ? mine[0].effective_from : null;
        return '<div class="cfg-r">' +
          '<span class="cfg-nm">' + esc(e.display_name) + '</span>' +
          '<span class="cfg-tag' + (g === 'supervisor' ? ' sup' : '') + '">' +
            (g === 'supervisor' ? '主管階層 45%' : '一般教練 40%') + '</span>' +
          (since ? '<span class="cfg-t">' + esc(since) + ' 起</span>'
                 : '<span class="cfg-t">沒有核定紀錄</span>') +
          '<button type="button" class="cfg-x" data-grade="' + esc(e.id) + '">改職級</button>' +
          (CFGFORM === 'g:' + e.id ? cfgGradeForm(e, g) : '') +
        '</div>';
      }).join('');
  }

  function cfgGradeForm(e, cur) {
    return '<div class="cfg-f">' +
      '<div><label>職級</label>' +
        '<select id="cfGrade">' +
          '<option value="regular"' + (cur === 'regular' ? ' selected' : '') + '>一般教練　80,000 以內 40%</option>' +
          '<option value="supervisor"' + (cur === 'supervisor' ? ' selected' : '') + '>主管階層教練　80,000 以內 45%</option>' +
        '</select></div>' +
      '<div><label>從哪一天開始生效</label>' +
        '<input type="date" id="cfGradeFrom" value="' + esc(twToday()) + '"></div>' +
      '<div class="note">☢️ 這是<b>新增一筆異動</b>，不是改掉舊的。' +
        '生效日之前的業績仍然照舊職級計算 —— 已經結完的月份不會被動到。</div>' +
      '<button type="button" class="cfg-go" data-gsave="' + esc(e.id) + '">存起來</button>' +
      '<button type="button" class="cfg-no" data-cancel="1">取消</button>' +
    '</div>';
  }

  function cfgAllowRows() {
    if (!ALLOW.length) return '<div class="empty">還沒有任何職務加給</div>';
    return ALLOW.slice().sort(function (a, b) {
      return (a.emp_name || '') < (b.emp_name || '') ? -1 : 1;
    }).map(function (a) {
      return '<div class="cfg-r">' +
        '<span class="cfg-nm">' + esc(a.emp_name) + '</span>' +
        '<span class="cfg-t"><b>' + esc(a.item) + '</b>　' + money(a.monthly_amount) + ' ／月</span>' +
        '<span class="cfg-t">' + esc(a.from_date) + ' 起' +
          (a.to_date ? '　至 ' + esc(a.to_date) : '　<b>仍在任</b>') + '</span>' +
        (a.to_date ? '' :
          '<button type="button" class="cfg-x" data-end="' + esc(a.id) + '">結束</button>') +
        (CFGFORM === 'e:' + a.id ? cfgEndForm(a) : '') +
      '</div>';
    }).join('');
  }

  function cfgEndForm(a) {
    return '<div class="cfg-f">' +
      '<div><label>最後在任的那一天</label>' +
        '<input type="date" id="cfEnd" value="' + esc(twToday()) + '" min="' + esc(a.from_date) + '"></div>' +
      '<div class="note">☢️ 這一天<b>算在任</b>（規則第五篇 5：起訖日均列入）。' +
        '當月加給＝月加給 × 在任天數 ÷ 當月天數。</div>' +
      '<button type="button" class="cfg-go" data-esave="' + esc(a.id) + '">結束這筆加給</button>' +
      '<button type="button" class="cfg-no" data-cancel="1">取消</button>' +
    '</div>';
  }

  function cfgAddForm() {
    if (CFGFORM !== 'add') {
      return '<button type="button" class="cfg-x" style="margin-left:0;margin-top:9px" ' +
             'data-add="1">＋ 新增加給</button>';
    }
    return '<div class="cfg-f" style="margin-top:9px">' +
      '<div><label>誰</label><select id="cfWho">' +
        EMPS.filter(function (e) { return e.is_active !== false; })
            .map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.display_name) + '</option>'; })
            .join('') +
      '</select></div>' +
      '<div><label>項目</label><input type="text" id="cfItem" placeholder="例：店長加給"></div>' +
      '<div><label>每月金額</label><input type="number" id="cfAmt" inputmode="numeric" min="1" placeholder="5000"></div>' +
      '<div><label>從哪一天開始</label><input type="date" id="cfFrom" value="' + esc(monthFirst()) + '"></div>' +
      '<div class="note">☢️ 同一個人的同一項加給<b>不能有時間重疊的兩筆</b> —— ' +
        '資料庫會擋下來（重疊會在月結時發兩份）。</div>' +
      '<button type="button" class="cfg-go" data-asave="1">新增</button>' +
      '<button type="button" class="cfg-no" data-cancel="1">取消</button>' +
    '</div>';
  }

  /* ══ 月結（第 94 步）══════════════════════════════════════════════
     ☢️ 這一頁的數字現在是 month_report() 給的，不是 payroll_month()。
        結過的月份它回【當時封存的那一份】，沒結過才即時算。
        所以結完之後改設定、作廢紀錄，這一頁的上個月不會跟著變 ——
        那正是月結存在的理由。 */

  function closedBlock() {
    var pays = REP.payouts || [];
    var nPaid = pays.filter(function (p) { return p.paid_on; }).length;
    return '<div class="mc-box done">' +
      '<div class="mc-t">✓ ' + esc(REP.ym) + ' 已經結算' +
        '<small>' + esc(REP.closed_at) + '　' + esc(REP.closed_by || '') +
        (REP.reopens ? '　·　重開過 ' + REP.reopens + ' 次' : '') + '</small></div>' +
      (REP.note ? '<div class="mc-w">' + esc(REP.note) + '</div>' : '') +
      '<div class="mc-w">下面的數字是<b>結算當下封存的</b>。之後不管誰改了什麼，' +
        '它都不會再變 —— 發給教練的那張紙跟這裡永遠對得起來。' +
        (pays.length ? '　薪水已發 ' + nPaid + '/' + pays.length + ' 位。' : '') + '</div>' +
      (MCFORM === 'reopen' ? reopenForm()
        : '<button type="button" class="mc-un" data-mcreopen="1">重開這個月</button>') +
    '</div>';
  }

  function reopenForm() {
    return '<div class="mc-f">' +
      '<div><label>為什麼要重開</label>' +
        '<input type="text" id="mcWhy" placeholder="例：Peter 的鐘點費設定填錯，要重算"></div>' +
      '<div class="note">☢️ 這是把<b>已經發出去的數字</b>改掉。舊的那一份會整包留在紀錄裡，' +
        '三個月後查得出原本是多少 —— 但要寫得出為什麼。</div>' +
      '<button type="button" class="cfg-go" data-mcreopengo="1">確定重開</button>' +
      '<button type="button" class="cfg-no" data-mccancel="1">取消</button>' +
    '</div>';
  }

  function openBlock() {
    var c = REP.check || {};
    var blocks = c.blocks || [], warns = c.warns || [];
    var can = !!c.ok;
    return '<div class="mc-box live">' +
      '<div class="mc-t">' + esc(REP.ym) + ' 還沒結算' +
        '<small>下面的數字是現在重算的，一改設定就會跟著變</small></div>' +
      blocks.map(function (b) {
        return '<div class="mc-w stop">☢️ ' + esc(b) + '</div>';
      }).join('') +
      warns.map(function (w) {
        return '<div class="mc-w">' + esc(w) + '</div>';
      }).join('') +
      (MCFORM === 'close' ? closeForm()
        : '<button type="button" class="mc-go' + (warns.length && can ? ' warnish' : '') + '"' +
          (can ? '' : ' disabled') + ' data-mcclose="1">' +
          (can ? '結算 ' + esc(REP.ym) + '，把數字鎖起來' : '還不能結算') + '</button>') +
      (can ? '' : '<div class="note">上面紅色的處理完，這顆鍵就會亮起來。</div>') +
    '</div>';
  }

  function closeForm() {
    return '<div class="mc-f">' +
      '<div><label>備註（可以留白）</label>' +
        '<input type="text" id="mcNote" placeholder="例：八月薪資結算"></div>' +
      '<div class="note">☢️ 結算之後這個月的數字就<b>固定</b>了。要改的話得先「重開這個月」，' +
        '而且重開要寫原因。</div>' +
      '<button type="button" class="cfg-go" data-mcclosego="1">確定結算</button>' +
      '<button type="button" class="cfg-no" data-mccancel="1">取消</button>' +
    '</div>';
  }

  function mcBlock() {
    if (!REP) return '';
    // ☢️ 系統起點之前的月份不給結。那些數字本來就不完整（見上面的紅框），
    //    結起來只是把一個錯的數字鎖成「官方版本」。
    if (MONTH < SYSTEM_START) return '';
    return REP.closed ? closedBlock() : openBlock();
  }

  /* ── 薪水發了沒 ────────────────────────────────────────────────
     ☢️ 只有結算過的月份才出現。沒結算的話「應發多少」還會變，
        這時候記「發了多少」等於記一個明天就不成立的數字。 */
  function payoutBlock() {
    if (!REP || !REP.closed) return '';
    var rows = (DATA && DATA.rows) || [];
    if (!rows.length) return '';
    var byName = {};
    (REP.payouts || []).forEach(function (p) { byName[p.coach] = p; });
    var idByName = {};
    EMPS.forEach(function (e) { idByName[e.display_name] = e.id; });

    return '<div class="h">薪水發了沒</div><div class="card">' +
      rows.map(function (x) {
        var p = byName[x.coach_name];
        var id = idByName[x.coach_name] || '';
        var due = Math.round(x.total);
        return '<div class="mc-p">' +
          '<span class="mc-nm">' + esc(x.coach_name) + '</span>' +
          '<span class="mc-amt">' + money(due) + '</span>' +
          (p && p.paid_on
            ? '<span class="mc-tag paid">' + esc(p.paid_on) + ' 已發 ' +
              (p.method === 'cash' ? '現金' : '匯款') +
              (p.amount !== due ? '　實發 ' + money(p.amount) : '') + '</span>'
            : (p ? '<span class="mc-tag">登記了，還沒發</span>'
                 : '<span class="mc-tag">還沒登記</span>')) +
          (id ? '<button type="button" class="mc-x" data-mcpay="' + esc(id) + '">' +
                (p ? '改' : '登記') + '</button>' : '') +
          (MCFORM === 'p:' + id ? payForm(id, due, p) : '') +
        '</div>';
      }).join('') +
      '<div class="note">☢️ 應發金額是<b>結算當下封存的</b>那一份。' +
      '實發可以跟它不一樣（補款、扣款），系統只是<b>記下來</b>，不會回頭改薪資。</div></div>';
  }

  function payForm(id, due, p) {
    return '<div class="mc-f">' +
      '<div><label>實際發多少</label>' +
        '<input type="number" id="mcAmt" inputmode="numeric" min="0" value="' +
          esc(p ? p.amount : due) + '"></div>' +
      '<div><label>發放日（還沒發就留白）</label>' +
        '<input type="date" id="mcOn" max="' + esc(twToday()) + '" value="' +
          esc((p && p.paid_on) || '') + '"></div>' +
      '<div><label>怎麼發的</label><select id="mcHow">' +
        '<option value="">還沒發</option>' +
        '<option value="cash"' + (p && p.method === 'cash' ? ' selected' : '') + '>現金</option>' +
        '<option value="transfer"' + (p && p.method === 'transfer' ? ' selected' : '') + '>匯款</option>' +
      '</select></div>' +
      '<div><label>備註（可以留白）</label>' +
        '<input type="text" id="mcPn" value="' + esc((p && p.note) || '') + '"></div>' +
      '<button type="button" class="cfg-go" data-mcpaygo="' + esc(id) + '">存起來</button>' +
      '<button type="button" class="cfg-no" data-mccancel="1">取消</button>' +
    '</div>';
  }

  function settingsBlock() {
    return '<details class="cfg-box"' + (CFGOPEN ? ' open' : '') + ' id="cfgBox">' +
      '<summary>設定：職級與職務加給<span class="cfg-cap">偶爾才需要動</span>' +
        '<span class="cfg-ar"></span></summary>' +
      '<div class="h">職級</div><div class="card">' + cfgGradeRows() +
        '<div class="note">☢️ 規則第五篇 2：「職級以工作室正式核定與公告為準；' +
        '<b>未正式核定為主管者，適用一般教練比例</b>。」所以沒有紀錄＝一般教練，' +
        '那是對的狀態，不是待補。<br>只有<b>授課教練</b>會出現在這裡。</div></div>' +
      '<div class="h">職務加給</div><div class="card">' + cfgAllowRows() + cfgAddForm() +
        '<div class="note">加給<b>不屬於課程業績</b>，也不影響 80,000 元的抽成級距' +
        '（規則第五篇 5）。結束一筆加給是<b>填結束日</b>，不是刪掉 —— ' +
        '刪掉的話以前的月份會跟著少發。</div></div>' +
    '</details>';
  }

  function render() {
    elGate.hidden = true; elMain.hidden = false;
    elMain.innerHTML =
      pickerBlock() +
      (DATA ? (tooEarlyBlock() + mcBlock() + sumsBlock() + '<div class="h">每位教練</div>' + coachBlock() +
               holdBlock() + warnBlock() + payoutBlock() + settingsBlock() + downloadBlock())
            : '<div class="card"><div class="empty">讀取中…</div></div>');
    wire();
  }

  function wire() {
    Array.prototype.forEach.call(elMain.querySelectorAll('[data-m]'), function (b) {
      b.onclick = function () { MONTH = b.getAttribute('data-m'); load(); };
    });
    var m = document.getElementById('dM');
    if (m) m.onchange = function () { if (m.value) { MONTH = m.value; load(); } };

    Array.prototype.forEach.call(elMain.querySelectorAll('[data-coach]'), function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-coach');
        OPEN[k] = !OPEN[k];
        render();
      };
    });

    // ── 設定區（第 84 步）──────────────────────────────
    var box = document.getElementById('cfgBox');
    if (box) box.ontoggle = function () { CFGOPEN = box.open; };

    function on(attr, fn) {
      Array.prototype.forEach.call(elMain.querySelectorAll('[data-' + attr + ']'), function (b) {
        b.onclick = function (ev) { ev.preventDefault(); fn(b.getAttribute('data-' + attr), b); };
      });
    }
    on('grade',  function (id) { CFGFORM = (CFGFORM === 'g:' + id) ? null : 'g:' + id; render(); });
    on('end',    function (id) { CFGFORM = (CFGFORM === 'e:' + id) ? null : 'e:' + id; render(); });
    on('add',    function ()   { CFGFORM = 'add'; render(); });
    on('cancel', function ()   { CFGFORM = null;  render(); });
    on('gsave',  saveGrade);
    on('esave',  endAllow);
    on('asave',  addAllow);

    // ── 月結（第 94 步）────────────────────────────────
    on('mccancel',   function () { MCFORM = null; render(); });
    on('mcclose',    function () { MCFORM = 'close';  render(); });
    on('mcreopen',   function () { MCFORM = 'reopen'; render(); });
    on('mcclosego',  doClose);
    on('mcreopengo', doReopen);
    on('mcpay',      function (id) {
      MCFORM = (MCFORM === 'p:' + id) ? null : 'p:' + id;
      render();
    });
    on('mcpaygo',    doPay);

    var dl = document.getElementById('dl');
    if (dl) dl.onclick = download;
    var lo = document.getElementById('logout');
    if (lo) lo.onclick = function () {
      lo.textContent = '登出中…'; lo.disabled = true; window.FFF_AUTH.logout();
    };
  }

  /* ══ 設定的寫入（第 84 步）══════════════════════════════════════
     ☢️ 這三支直接寫表，沒有包成 RPC —— 因為 coach_grades / coach_allowances
        的 RLS policy 就是 is_finance()，牆已經在資料庫了。
        再包一層 definer 函式只會多一個要維護的東西，不會多一分安全。
     ☢️ 但錯誤一定要顯示出來。寫失敗卻靜靜地什麼都不做，
        使用者會以為存好了 —— 下個月才發現薪水算錯。 */

  function cfgDone(err, okMsg) {
    CFGBUSY = false;
    if (err) { toast(String(err.message || err), true); return false; }
    CFGFORM = null;
    toast(okMsg);
    loadConfig().then(render);
    return true;
  }

  function saveGrade(empId) {
    if (CFGBUSY) return;
    var g = (document.getElementById('cfGrade') || {}).value;
    var d = (document.getElementById('cfGradeFrom') || {}).value;
    if (!g || !d) { toast('職級和生效日都要填', true); return; }
    CFGBUSY = true;
    DB.from('coach_grades')
      .upsert({ employee_id: empId, grade: g, effective_from: d },
              { onConflict: 'employee_id,effective_from' })
      .then(function (r) { cfgDone(r.error, '職級已更新'); },
            function (e) { cfgDone(e); });
  }

  function endAllow(id) {
    if (CFGBUSY) return;
    var d = (document.getElementById('cfEnd') || {}).value;
    if (!d) { toast('要填最後在任的那一天', true); return; }
    CFGBUSY = true;
    DB.from('coach_allowances').update({ to_date: d }).eq('id', id)
      .then(function (r) { cfgDone(r.error, '已填上結束日'); },
            function (e) { cfgDone(e); });
  }

  function addAllow() {
    if (CFGBUSY) return;
    var who  = (document.getElementById('cfWho')  || {}).value;
    var item = ((document.getElementById('cfItem') || {}).value || '').trim();
    var amt  = parseInt((document.getElementById('cfAmt') || {}).value, 10);
    var from = (document.getElementById('cfFrom') || {}).value;
    if (!who || !item || !from) { toast('人、項目、起始日都要填', true); return; }
    if (!(amt > 0)) { toast('金額要大於 0', true); return; }
    CFGBUSY = true;
    DB.from('coach_allowances')
      .insert({ employee_id: who, item: item, monthly_amount: amt, from_date: from })
      .then(function (r) {
        // ☢️ 區間重疊會被資料庫的 exclusion constraint 擋下來 ——
        //    那個原文訊息看不懂，翻成人話。
        if (r.error && /exclusion|overlap|conflicting/i.test(r.error.message || '')) {
          cfgDone({ message: '這個人的同一項加給已經有時間重疊的一筆了。要改的話先把舊的填上結束日。' });
          return;
        }
        cfgDone(r.error, '加給已新增');
      }, function (e) { cfgDone(e); });
  }

  /* ══ 月結的三支寫入（第 94 步）══════════════════════════════════
     ☢️ 全部走 RPC，不直接寫表 —— 這三件事有規則要檢查（能不能結、
        重開要不要原因、發放日能不能是未來），規則放在資料庫才擋得住
        任何一條進來的路。
     ☢️ RPC 成功不等於做成功。這三支都會回 {ok:false, msg}，
        那是【規則擋下來】，不是錯誤。分不清楚的話畫面會說「已結算」，
        但資料庫其實什麼都沒做。 */

  function mcDone(err, res, okMsg) {
    MCBUSY = false;
    if (err) { toast(String(err.message || err), true); render(); return; }
    if (res && res.ok === false) { toast(res.msg || '做不了', true); render(); return; }
    MCFORM = null;
    toast(okMsg);
    load();
  }

  function doClose() {
    if (MCBUSY) return;
    var note = ((document.getElementById('mcNote') || {}).value || '').trim();
    MCBUSY = true;
    DB.rpc('close_month', { p_ym: MONTH + '-01', p_note: note || null })
      .then(function (r) { mcDone(r.error, r.data, MONTH + ' 結算完成，數字鎖起來了'); },
            function (e) { mcDone(e); });
  }

  function doReopen() {
    if (MCBUSY) return;
    var why = ((document.getElementById('mcWhy') || {}).value || '').trim();
    if (why.length < 4) { toast('重開要寫原因，至少四個字', true); return; }
    MCBUSY = true;
    DB.rpc('reopen_month', { p_ym: MONTH + '-01', p_why: why })
      .then(function (r) { mcDone(r.error, r.data, '已經打開，舊的那份留在紀錄裡'); },
            function (e) { mcDone(e); });
  }

  function doPay(coachId) {
    if (MCBUSY) return;
    var amt = parseInt((document.getElementById('mcAmt') || {}).value, 10);
    var on  = (document.getElementById('mcOn')  || {}).value || null;
    var how = (document.getElementById('mcHow') || {}).value || null;
    var nt  = ((document.getElementById('mcPn') || {}).value || '').trim();
    if (!(amt >= 0)) { toast('金額要填', true); return; }
    // ☢️ 前端先擋一次只是為了少跑一趟。真正的規則在 record_payout 裡。
    if (on && !how) { toast('已經發了就要選現金或匯款', true); return; }
    if (!on && how) { toast('選了發放方式就要填發放日', true); return; }
    MCBUSY = true;
    DB.rpc('record_payout', { p_ym: MONTH + '-01', p_coach: coachId, p_amount: amt,
                              p_paid_on: on, p_method: how, p_note: nt || null })
      .then(function (r) { mcDone(r.error, r.data, on ? '已記下發放' : '已登記，還沒發'); },
            function (e) { mcDone(e); });
  }

  // 設定資料。☢️ 讀不到【不該擋住薪資報表】—— 那是兩件事。
  function loadConfig() {
    return Promise.all([
      DB.from('employees').select('id,display_name,can_teach,is_active')
        .then(function (r) { return (!r.error && r.data) ? r.data : []; }, function () { return []; }),
      DB.from('coach_grades').select('id,employee_id,grade,effective_from')
        .then(function (r) { return (!r.error && r.data) ? r.data : []; }, function () { return []; }),
      // ☢️☢️ 一定要指名外鍵。coach_allowances 有【兩條】指向 employees：
      //    employee_id（誰領這筆加給）和 created_by（誰設定的）。
      //    只寫 employees(...) 的話 PostgREST 不知道走哪一條，整個查詢回錯 ——
      //    然後下面那個 (!r.error && r.data) 會把錯誤吞掉、回一個空陣列，
      //    畫面上顯示「還沒有任何職務加給」。☢️ 資料明明在，但看不到。
      //    ☢️ 這跟 line-notify 那個 bug 是【同一個】陷阱（見第 81 步）——
      //       兩天內踩兩次，所以規則要記死：<b>嵌套查詢一律指名外鍵</b>。
      DB.from('coach_allowances')
        .select('id,employee_id,item,monthly_amount,from_date,to_date,' +
                'employees!coach_allowances_employee_id_fkey(display_name)')
        .then(function (r) {
          if (r.error) { toast('讀不到加給設定：' + (r.error.message || ''), true); return []; }
          return r.data || [];
        }, function () { return []; })
    ]).then(function (all) {
      EMPS   = all[0] || [];
      GRADES = all[1] || [];
      ALLOW  = (all[2] || []).map(function (a) {
        a.emp_name = (a.employees && a.employees.display_name) || '（查無此人）';
        return a;
      });
    });
  }

  /* ══ 讀資料 ══════════════════════════════════════════════════ */
  function load() {
    if (BUSY) return;
    BUSY = true;
    render();
    // ☢️ 兩條線分開跑：設定讀不到不該擋住薪資報表。
    //    ☢️ 但設定回來之後【一定要再畫一次】—— 只呼叫不重畫的話，
    //       設定區永遠是空的，而且不會有任何錯誤。（實測踩到）
    loadConfig().then(function () { if (DATA) render(); });
    /* ☢️ 第 94 步改讀 month_report()，不是 payroll_month()。
          結過的月份它回【封存的那一份】，沒結過才即時算。
          直接叫 payroll_month 的話，結完之後改個設定，
          上個月的薪水就會偷偷跟著變 —— 而且沒有任何地方會說。 */
    DB.rpc('month_report', { p_ym: MONTH + '-01' })
      .then(function (r) {
        BUSY = false;
        // ☢️ 錯誤和「沒有資料」在 supabase-js 裡都是空的，意思完全相反。（規則 14）
        if (r.error) { gate('err', '算不出薪資', r.error.message || ''); return; }
        REP  = r.data || null;
        DATA = REP ? (REP.payroll || null) : null;
        if (!DATA) { gate('err', '算不出薪資', '回來的是空的'); return; }
        elSub.textContent = DATA.month + '　薪資' + (REP.closed ? '（已結算）' : '');
        render();
      }, function (e) {
        BUSY = false;
        gate('err', '算不出薪資', String(e && e.message || e));
      });
  }

  /* ══ 下載 ══════════════════════════════════════════════════════ */
  // ☢️ 檔名【只能用英數】。含中文的話 Chromium 會整個丟掉，
  //    存出來叫 download 而且連副檔名都沒有。（第 61 步實測過）
  function fileName() { return 'FFF_payroll_' + MONTH + '.xlsx'; }

  function download() {
    if (!DATA) { toast('還沒讀到資料', true); return; }
    var btn = document.getElementById('dl');
    btn.disabled = true; btn.textContent = '產生中…';
    try {
      var sheets = [
        { name:'每人小計',
          cols:[{t:'教練',w:12},{t:'PT+PGT抽成',w:13,money:true},{t:'GT鐘點費',w:12,money:true},
                {t:'活動鐘點費',w:12,money:true},{t:'固定加給',w:12,money:true},
                {t:'合計',w:13,money:true},{t:'抽成業績基礎',w:14,money:true},
                {t:'GT堂數',w:9,num:true},{t:'GT人次',w:9,num:true},
                {t:'活動時數',w:10,num:true},{t:'暫停筆數',w:10,num:true}],
          rows:(DATA.rows||[]).map(function (x) {
            return [x.coach_name, x.perf, x.gt, x.event, x.allowance, x.total,
                    x.perf_base, x.gt_classes, x.gt_heads, x.event_hours, x.hold_n];
          }) },
        { name:'逐筆明細',
          cols:[{t:'教練',w:12},{t:'類別',w:9},{t:'完成時間',w:14},{t:'項目',w:18},
                {t:'人數或天數',w:11,num:true},{t:'基礎',w:12,num:true},{t:'費率',w:8,num:true},
                {t:'金額（原始精度）',w:16,num:true},{t:'暫停',w:7},{t:'為什麼暫停',w:40}],
          rows:(DATA.lines||[]).map(function (x) {
            return [x.coach_name, KINDS[x.kind] || x.kind, twStamp(x.done_at), x.label,
                    x.qty, Number(x.base), x.rate == null ? '' : Number(x.rate),
                    Number(x.amount), x.hold ? '是' : '', x.hold_why];
          }) },
        { name:'暫停自動計薪',
          cols:[{t:'教練',w:12},{t:'完成時間',w:14},{t:'項目',w:18},{t:'原因',w:52}],
          rows:(DATA.holds||[]).map(function (x) {
            return [x.coach_name, twStamp(x.done_at), x.label, x.hold_why];
          }) },
        { name:'到場但沒扣堂',
          cols:[{t:'教練',w:12},{t:'完成時間',w:14},{t:'課程',w:18},{t:'客人',w:12},{t:'說明',w:52}],
          rows:(DATA.warns||[]).map(function (x) {
            return [x.coach_name, twStamp(x.done_at), x.label, x.who, x.why];
          }) }
      ];
      var blob = window.FFF_XLSX.build(sheets);
      var ok = window.FFF_XLSX.save(blob, fileName());
      btn.disabled = false; btn.textContent = '下載 Excel（4 個工作表）';
      toast(ok ? '已產生：' + fileName() : '存檔失敗，請改用電腦試試', !ok);
    } catch (e) {
      btn.disabled = false; btn.textContent = '下載 Excel（4 個工作表）';
      toast('產生失敗：' + (e && e.message || e), true);
    }
  }

  /* ══ 開場 ══════════════════════════════════════════════════════ */
  function boot() {
    if (!window.FFF_AUTH || !window.FFF_AUTH.ready) {
      gate('err', '身分程式沒載進來', 'liff-auth.js 沒跑起來'); return;
    }
    window.FFF_AUTH.ready.then(function () {
      var st = window.FFF_AUTH.state;
      if (st === 'browsing') {
        elSub.textContent = '未登入';
        gate('err', '要先登入', '請從教練登入頁進來（staff.html）'); return;
      }
      if (st === 'checking') {
        elSub.textContent = '重新登入中';
        gate('', '正在重新登入…', '登入過期了，馬上跳到 LINE 幫你換一張'); return;
      }
      if (st === 'error') {
        elSub.textContent = '辨識失敗';
        if (window.FFF_AUTH.canLogin) {
          gate('', '登入過期了',
               (window.FFF_AUTH.errorNote || '按下面重新登入就好。') +
               '（' + (window.FFF_AUTH.error || '') + '）');
          var rb = document.createElement('button');
          rb.type = 'button'; rb.className = 'btn';
          rb.style.cssText = 'max-width:280px;margin:18px auto 0';
          rb.textContent = '重新登入';
          rb.onclick = function () {
            rb.textContent = '正在開啟 LINE 登入…'; rb.disabled = true;
            if (!window.FFF_AUTH.login()) {
              rb.textContent = '開不起來，請改從 LINE 裡面開'; rb.disabled = false;
            }
          };
          elGate.appendChild(rb);
          return;
        }
        gate('err', '辨識失敗',
             (window.FFF_AUTH.errorNote ? window.FFF_AUTH.errorNote + '　' : '') +
             (window.FFF_AUTH.error || '')); return;
      }
      if (!window.fffDB) { gate('err', '資料庫連線沒建立', 'no_fffDB'); return; }
      DB = window.fffDB;

      DB.auth.getUser().then(function (u) {
        if (u.error || !u.data || !u.data.user) {
          gate('err', '拿不到登入身分', (u.error && u.error.message) || 'no_user'); return;
        }
        return DB.from('employees')
          .select('id,display_name,role,is_active,can_finance')
          .eq('auth_user_id', u.data.user.id)
          .then(function (r) {
            if (r.error) throw new Error(r.error.message);
            if (!r.data || !r.data.length) {
              elSub.textContent = '未開通';
              gate('err', '你的帳號還沒開通', '先開 staff.html 把登入代號給 Jerec'); return;
            }
            ME = r.data[0];
            if (ME.is_active === false) {
              gate('err', ME.display_name + '　已停用', '如果這是誤設，請找 Jerec'); return;
            }
            // ☢️ 這裡擋一次只是為了給看得懂的訊息。真正的牆在資料庫。
            if (!ME.can_finance) {
              elSub.textContent = '沒有權限';
              gate('err', '薪資報表只有負責人和財務看得到',
                   '如果你需要看，請找 Jerec 開權限'); return;
            }
            elWho.textContent = ME.display_name;
            elSub.textContent = '薪資報表';
            return load();
          }, function (e) {
            gate('err', '查不到員工名單', String(e && e.message || e));
          });
      });
    });
  }

  document.getElementById('reload').onclick = function () { if (DB) load(); };
  window.FFF_AUTH.onResume = function () { if (DB && ME) load(); };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
