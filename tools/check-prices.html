<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>價格對帳 · 諧動空間</title>
<style>
  :root{--bg:#0E0E10;--card:#17171B;--line:#26262C;--tx:#E9E9EC;--dim:#9A9AA4;
        --ok:#3FB27F;--bad:#D8342B;--teal:#2FB5AE}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:'Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;
       font-size:15px;line-height:1.7;padding:22px 16px 60px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 4px}
  .sub{color:var(--dim);font-size:.82rem;margin-bottom:20px}
  .big{border-radius:14px;padding:18px 20px;margin-bottom:18px;font-size:1.05rem;font-weight:700}
  .big.ok{background:rgba(63,178,127,.14);border:1px solid rgba(63,178,127,.5);color:#7FE0B4}
  .big.bad{background:rgba(216,52,43,.14);border:1px solid rgba(216,52,43,.5);color:#FF9A93}
  .big.wait{background:var(--card);border:1px solid var(--line);color:var(--dim)}
  .big small{display:block;font-weight:400;font-size:.8rem;margin-top:6px;opacity:.9}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:4px 0;margin-bottom:14px;overflow:hidden}
  .ttl{padding:12px 18px 8px;font-size:.8rem;color:var(--teal);letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:8px 18px;text-align:left;border-top:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:.75rem;border-top:none}
  td.n{font-family:ui-monospace,'JetBrains Mono',monospace}
  tr.bad td{background:rgba(216,52,43,.10)}
  .fl{display:inline-block;width:1.4em}
  .fl.ok{color:var(--ok)}
  .fl.bad{color:var(--bad)}
  .note{color:var(--dim);font-size:.78rem;padding:10px 18px 14px;border-top:1px solid var(--line)}
  button{background:var(--teal);color:#04211F;border:0;border-radius:10px;
         padding:10px 20px;font-size:.9rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>價格對帳</h1>
  <div class="sub">
    資料庫的 <b>products</b> 表是正本。這一頁去把官網、LIFF 價目表、備援檔裡寫死的數字全部挖出來，
    一個一個跟正本對。<br>
    ☢️ 改完價格推上去之後，就是來按這一頁 —— 全綠才算改完。
  </div>

  <div id="verdict" class="big wait">對帳中…</div>
  <div id="out"></div>
  <div style="text-align:center;margin-top:18px"><button onclick="location.reload()">重新對一次</button></div>
</div>

<script src="../line-prototype/supabase-config.js"></script>
<script src="price-extract.js"></script>
<script>
(function () {
  var X = window.FFF_PRICE_EXTRACT;
  var verdict = document.getElementById('verdict');
  var out = document.getElementById('out');

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getText(p) {
    return fetch(p, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
      return r.text();
    });
  }

  function getDB() {
    if (!window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY) {
      throw new Error('supabase-config.js 沒載到');
    }
    return fetch(window.SUPABASE_URL +
        '/rest/v1/products?select=code,price,headcount,product&is_active=eq.true', {
      headers: {
        apikey: window.SUPABASE_PUBLISHABLE_KEY,
        Authorization: 'Bearer ' + window.SUPABASE_PUBLISHABLE_KEY
      }
    }).then(function (r) {
      if (!r.ok) throw new Error('資料庫回 HTTP ' + r.status);
      return r.json();
    });
  }

  function render(rows, extra) {
    var by = {};
    rows.forEach(function (r) { (by[r.source] = by[r.source] || []).push(r); });
    var html = '';
    Object.keys(by).forEach(function (name) {
      var list = by[name], bad = list.filter(function (r) { return !r.ok; }).length;
      html += '<div class="card"><div class="ttl">' + esc(name) +
              '　' + (bad ? '❌ ' + bad + ' 項對不上' : '✅ ' + list.length + ' 項全對') + '</div>' +
              '<table><tr><th></th><th>商品代號</th><th>資料庫</th><th>這份檔案</th></tr>';
      list.forEach(function (r) {
        html += '<tr class="' + (r.ok ? '' : 'bad') + '">' +
          '<td><span class="fl ' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✓' : '✕') + '</span></td>' +
          '<td class="n">' + esc(r.code) + '</td>' +
          '<td class="n">' + esc(r.want) + '</td>' +
          '<td class="n">' + esc(r.got) + '</td></tr>';
      });
      html += '</table></div>';
    });
    if (extra.length) {
      var eb = extra.filter(function (r) { return !r.ok; }).length;
      html += '<div class="card"><div class="ttl">人數上限　' +
        (eb ? '❌ ' + eb + ' 項對不上' : '✅ ' + extra.length + ' 項全對') + '</div><table>' +
        '<tr><th></th><th>檢查項目</th><th>應該是</th><th>實際</th></tr>';
      extra.forEach(function (r) {
        html += '<tr class="' + (r.ok ? '' : 'bad') + '">' +
          '<td><span class="fl ' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✓' : '✕') + '</span></td>' +
          '<td>' + esc(r.code) + '</td><td class="n">' + esc(r.want) +
          '</td><td class="n">' + esc(r.got) + '</td></tr>';
      });
      html += '</table><div class="note">☢️ PGT 只賣到六人。七人以上是外派／企業包班，走不同的計價。</div></div>';
    }
    out.innerHTML = html;
  }

  Promise.all([
    getDB(),
    getText('../index.html'),
    getText('../line-prototype/pricing.html'),
    getText('../line-prototype/prices.js'),
    getText('../line-prototype/GT-booking.html')
  ]).then(function (r) {
    var dbRows = r[0], idx = r[1], pri = r[2], pjs = r[3], gtb = r[4];

    var db = {};
    dbRows.forEach(function (x) { db[x.code] = x.price; });

    var site = X.fromSiteData(idx);
    var rows = X.compare(db, [
      { name: 'prices.js 備援表（LIFF 讀不到資料庫時用的）', prices: X.fromFallback(pjs), expectAll: true },
      { name: '官網 index.html 的 FFDATA.pricing', prices: site.prices },
      { name: '官網 index.html 畫面上的數字', prices: X.fromDataP(idx) },
      { name: 'LIFF pricing.html 畫面上的數字', prices: X.fromDataP(pri) },
      { name: 'LIFF GT-booking.html 畫面上的數字', prices: X.fromDataP(gtb) }
    ]);

    // PGT 人數上限：資料庫裡最大的那個 headcount，就是實際賣到幾人
    var hc = dbRows.filter(function (x) { return x.product === 'PGT'; })
                   .map(function (x) { return x.headcount; });
    var dbMin = Math.min.apply(null, hc), dbMax = Math.max.apply(null, hc);
    var extra = [
      { code: '官網 pricing.pgt.min', want: dbMin, got: site.meta.pgtMin, ok: site.meta.pgtMin === dbMin },
      { code: '官網 pricing.pgt.max', want: dbMax, got: site.meta.pgtMax, ok: site.meta.pgtMax === dbMax },
      { code: 'prices.js PGT_MIN',    want: dbMin, got: pickNum(pjs, 'PGT_MIN'), ok: pickNum(pjs, 'PGT_MIN') === dbMin },
      { code: 'prices.js PGT_MAX',    want: dbMax, got: pickNum(pjs, 'PGT_MAX'), ok: pickNum(pjs, 'PGT_MAX') === dbMax }
    ];

    var bad = rows.filter(function (x) { return !x.ok; }).length +
              extra.filter(function (x) { return !x.ok; }).length;
    var all = rows.length + extra.length;

    verdict.className = 'big ' + (bad ? 'bad' : 'ok');
    verdict.innerHTML = bad
      ? '❌ ' + bad + ' 項對不上（共查 ' + all + ' 項）<small>下面紅色那幾行就是要改的地方。' +
        '「資料庫」那欄是對的，把檔案改成跟它一樣。</small>'
      : '✅ 全部一致（共查 ' + all + ' 項）<small>資料庫、官網、LIFF 三邊的價格完全相同。</small>';

    render(rows, extra);
  }).catch(function (e) {
    verdict.className = 'big bad';
    verdict.innerHTML = '⚠️ 對不了<small>' + esc(e && e.message ? e.message : e) +
      '<br>☢️ 這一頁要從網站上開（https://jerecyu.github.io/Fusion_Force_Fitness/tools/check-prices.html），' +
      '直接用檔案總管點開會被瀏覽器擋住讀不到別的檔案。</small>';
  });

  function pickNum(js, name) {
    var m = js.match(new RegExp(name + '\\s*=\\s*(\\d+)'));
    return m ? parseInt(m[1], 10) : null;
  }
})();
</script>
</body>
</html>
