<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════
  LINE 圖文選單底圖的「原始檔」 v5  →  assets/brand/fff-richmenu.png
  ══════════════════════════════════════════════════════════════════

  要改字、改配色、換分格：改這支 HTML，然後 `python3 shot.py`。

  ☢️ 尺寸不能亂改 —— 2500×1686，六宮格每格 833×843，
     LINE 後台的可點區域是照那個網格切的。

  ☢️☢️ 六格順序從 v3 起就沒變過，所以【照 v3 設好動作的話，這一版不用再改】：
       A 左上 私人課    → liff.line.me/2011063116-QOxXN30h/PT-booking.html
       B 中上 團體課    → …/GT-booking.html
       C 右上 私人團體  → …/PGT-booking.html
       D 左下 我的預約  → …/GT-booking.html?tab=m
       E 中下 價目表    → …/pricing.html
       F 右下 聯絡我們  → 文字「我想詢問」
     ☢️ 規則 18：LINE 裡的連結一律用 LIFF 網址。

  ── 版本史（每一版都是被上一版的缺點推出來的）──────────────
  v2  深藍底白字。字級太小（手機上副標 6.9pt，看不見）→ 加大。
  v3  Jerec 要「輕盈質感／修復風＋襯線體」→ 翻成淺底深字。
      ☢️ 但只取了一張 LOGO 的藍→青，整個綠色端沒用到。
  v4  補上第二張 LOGO 的萊姆綠、底色加漸層、LOGO 斜線當主圖形。
      ☢️ Jerec：「六宮格底色還是白的」—— 淺底再怎麼加漸層，
         在手機上仍然是一片白，品牌認不出來。
  v5  【底色回到 v2 的深藍】，但把 v3/v4 學到的東西全部留下：
      襯線體、萊姆綠、斜線圖形、算出來的裝飾位置、取樣驗對比。
      ☢️ 結論：深底不是「不夠輕盈」，是【對比預算大很多】——
         深底上白字有 5:1 以上，淺底上深字要一直閃避裝飾才勉強 4.7:1。
         顏色能放得更重，設計反而更自由。

  ── v5 的配色 ────────────────────────────────────────────────
  底：v2 那三階深藍（原版），但整組再壓深一點點。
     ☢️ 壓深的理由是【算出來的】，不是喜好：v2 的最亮那格 #2A7C9E，
        白字只有 4.70:1，而副標用的淡青 #CFE7EE 只有 3.65:1 ——
        v2 的註解只驗了白字，副標那一行【從來沒過關】。
  重點色：亮青 → 萊姆綠（第二張 LOGO 的綠端）。
     深藍底配萊姆綠是這個品牌自己的顏色，而且在小尺寸下最跳。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* ── 四個端點全部取自兩張 LOGO ── */
    --navy:#00448D;   /* B 版深藍   */
    --blue:#2C7EB0;   /* A 版主藍   */
    --cyan:#4FB3D9;   /* 兩版共有的亮青 */
    --lime:#C5D322;   /* B 版萊姆綠 */

    --ink:#FFFFFF;    /* 標題：白 */
    --sub:#E4F2F7;    /* 副標：極淡青白。☢️ 不能用 v2 的 #CFE7EE —— 那只有 3.65:1 */
    --hair:rgba(255,255,255,.16);
  }
  body{width:2500px;height:1686px;background:#0C2433;
    font-family:'Noto Serif CJK TC','Noto Serif TC',serif;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    overflow:hidden}

  .c{position:relative;padding:96px 78px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:inset -3px 0 0 var(--hair), inset 0 -3px 0 var(--hair)}
  .c:nth-child(3n){box-shadow:inset 0 -3px 0 var(--hair)}
  .c:nth-child(n+4){box-shadow:inset -3px 0 0 var(--hair)}
  .c:nth-child(6){box-shadow:none}

  /* ☢️ 光暈錨在【右下角外面】，左上（圖示與標題所在）保持乾淨。
        顏色放在文字不在的那一側 —— 這是能上色又不犧牲可讀性的唯一方法。 */
  .p1{background:
    radial-gradient(112% 86% at 116% 112%, rgba(197,211,34,.14) 0%, rgba(79,179,217,.16) 34%, rgba(0,0,0,0) 70%),
    linear-gradient(126deg,#12495F 0%,#1F657F 100%)}
  .p2{background:
    radial-gradient(112% 86% at 116% 112%, rgba(197,211,34,.13) 0%, rgba(79,179,217,.14) 34%, rgba(0,0,0,0) 70%),
    linear-gradient(126deg,#0F3A4E 0%,#175066 100%)}
  .p3{background:
    radial-gradient(112% 86% at 116% 112%, rgba(197,211,34,.15) 0%, rgba(79,179,217,.12) 34%, rgba(0,0,0,0) 70%),
    linear-gradient(126deg,#0C2433 0%,#123244 100%)}

  /* ☢️ LOGO 上那組【平行斜線】才是這個品牌最好認的形狀，
        而且它在小尺寸下活得下來 —— v3/v4 早期版本用曲線緞帶，
        縮到手機的 15.6% 之後【整條消失】，等於白畫。
        直線不會消失，這是選它的唯一理由。
     ☢️ 斜線壓在副標右端上面，所以顏色一定要【夠淡】。
        取樣檢查會直接否決太深的版本（副標要 4.5:1）。 */
  /* ☢️ 位置是【算出來的】，不是眼睛喬的：
        文字區塊到 y≈660 為止（圖示＋標題＋副標，垂直置中），
        所以裝飾的【上緣必須低於 690】才不會壓到副標。
        520 高、bottom:-370 → 上緣 843+370-520 = 693，剛好在下面。
        取樣檢查每次都會重驗這件事，喬歪了會當場中斷。 */
  .art{position:absolute;right:-60px;bottom:-370px;width:520px;height:520px;
    pointer-events:none;opacity:.55}
  .art rect{rx:14}

  .ico{width:96px;height:96px;margin-bottom:34px;display:block;flex:0 0 auto}
  .ico *{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico .fill{stroke:none}

  .t{font-size:148px;font-weight:600;color:var(--ink);letter-spacing:.04em;
    line-height:1.05;white-space:nowrap}
  .t::after{content:'';display:block;width:104px;height:5px;margin-top:26px;border-radius:3px}
  .s{margin-top:24px;font-size:84px;font-weight:500;color:var(--sub);
    letter-spacing:.05em;line-height:1.3;white-space:nowrap}

  /* 每一組的重點色：色帶上的三個區間 */
  /* ☢️ 深底上重點色要【亮】才看得見。三組都走青→綠，
        差別在綠的比重：越常按的越偏青（冷靜），資訊類偏綠（跳）。 */
  .p1 .ico *{stroke:#7FD0E8} .p1 .ico .fill{fill:#7FD0E8}
  .p1 .t::after{background:linear-gradient(90deg,#4FB3D9,#8FD0DA)}
  .p2 .ico *{stroke:#9BDCE4} .p2 .ico .fill{fill:#9BDCE4}
  .p2 .t::after{background:linear-gradient(90deg,#4FB3D9,#B9D97A)}
  .p3 .ico *{stroke:#C5D322} .p3 .ico .fill{fill:#C5D322}
  .p3 .t::after{background:linear-gradient(90deg,#8FD0DA,#C5D322)}
</style>
</head>
<body>

<!-- 共用漸層。☢️ 定義一次、六格共用 —— 每格各定義一份會撞 id（id 是整份文件唯一）。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%"  stop-color="#3E9FC8"/><stop offset="55%" stop-color="#6FC6DE"/>
    <stop offset="100%" stop-color="#A9DCE8"/></linearGradient>
  <linearGradient id="gB" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%"  stop-color="#4FB3D9"/><stop offset="55%" stop-color="#8FD0DA"/>
    <stop offset="100%" stop-color="#C8E39A"/></linearGradient>
  <linearGradient id="gC" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%"  stop-color="#6FC6DE"/><stop offset="52%" stop-color="#A8CE55"/>
    <stop offset="100%" stop-color="#C5D322"/></linearGradient>
</defs></svg>

  <!-- A ─ 私人教練課 ─────────────────────────────────────────── -->
  <div class="c p1">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gA)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gA)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gA)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gA)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M14 40 V60"/><path d="M86 40 V60"/>
      <rect x="27" y="30" width="15" height="40" rx="6"/>
      <rect x="58" y="30" width="15" height="40" rx="6"/>
      <path d="M42 50 H58"/>
    </svg>
    <div class="t">私人課</div>
    <div class="s">一對一・一對二</div>
  </div>

  <!-- B ─ 團體課預約 ────────────────────────────────────────── -->
  <div class="c p1">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gA)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gA)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gA)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gA)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <rect x="12" y="22" width="76" height="66" rx="10"/>
      <path d="M12 43 H88"/><path d="M32 12 V30"/><path d="M68 12 V30"/>
      <circle class="fill" cx="35" cy="62" r="5"/><circle class="fill" cx="65" cy="62" r="5"/>
    </svg>
    <div class="t">團體課</div>
    <div class="s">看課表・訂課</div>
  </div>

  <!-- C ─ 私人團體班 ────────────────────────────────────────── -->
  <div class="c p2">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gB)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gB)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gB)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gB)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <circle cx="50" cy="31" r="13"/>
      <path d="M26 80 A24 24 0 0 1 74 80"/>
      <circle cx="18" cy="43" r="9"/><path d="M6 80 A18 18 0 0 1 17 63"/>
      <circle cx="82" cy="43" r="9"/><path d="M94 80 A18 18 0 0 0 83 63"/>
    </svg>
    <div class="t">私人團體</div>
    <div class="s">三人以上成班</div>
  </div>

  <!-- D ─ 我的預約 ──────────────────────────────────────────── -->
  <div class="c p2">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gB)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gB)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gB)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gB)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M26 12 H74 A6 6 0 0 1 80 18 V86 L50 68 L20 86 V18 A6 6 0 0 1 26 12 Z"/>
      <path d="M37 40 H63"/>
    </svg>
    <div class="t">我的預約</div>
    <div class="s">剩幾堂・取消</div>
  </div>

  <!-- E ─ 價目表 ────────────────────────────────────────────── -->
  <div class="c p3">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gC)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gC)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gC)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gC)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M54 12 H84 A6 6 0 0 1 90 18 V48 L46 92 A6 6 0 0 1 37 92 L10 65
               A6 6 0 0 1 10 56 Z"/>
      <circle class="fill" cx="71" cy="31" r="7"/>
    </svg>
    <div class="t">價目表</div>
    <div class="s">方案與價格</div>
  </div>

  <!-- F ─ 聯絡我們 ──────────────────────────────────────────── -->
  <div class="c p3">
    <svg class="art" viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="8"  y="24" width="104" height="7.5" fill="url(#gC)"/><rect x="18" y="41" width="94"  height="7.5" fill="url(#gC)"/><rect x="30" y="58" width="82"  height="7.5" fill="url(#gC)"/><rect x="46" y="75" width="66"  height="7.5" fill="url(#gC)"/></g></svg>
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M14 26 A8 8 0 0 1 22 18 H78 A8 8 0 0 1 86 26 V62 A8 8 0 0 1 78 70
               H44 L26 85 V70 H22 A8 8 0 0 1 14 62 Z"/>
      <circle class="fill" cx="36" cy="44" r="5"/>
      <circle class="fill" cx="50" cy="44" r="5"/>
      <circle class="fill" cx="64" cy="44" r="5"/>
    </svg>
    <div class="t">聯絡我們</div>
    <div class="s">傳訊息給櫃檯</div>
  </div>
</body>
</html>
