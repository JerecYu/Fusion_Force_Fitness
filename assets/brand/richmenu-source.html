  ── v3 改了什麼（2026-08-22）─────────────────────────────────
  Jerec：「以品牌 logo 去發想，風格上走輕盈質感／修復風……
           字體上改用襯線體」，並且「拿掉最左上角最外層的裝飾用白邊」。

  ① 【反過來了：深底白字 → 淺底深字。】
     修復風的核心是留白與低彩度，深藍滿版做不出來。
     ☢️ 但對比不能因此變差 —— 深墨 #23414E 落在最深的那個底色上
        仍有 9:1，副標 #4E6B77 有 4.7:1（shot.py 會實際驗算，不過就中斷）。
  ② 【襯線體】'Noto Serif CJK TC'。
     ☢️ 襯線的橫畫很細，縮到手機上（15.6%）容易糊掉，
        所以副標從 72px 加到 84px（手機上 13pt），而且用 Medium 不用 Regular。
        標題維持 148px（23pt）。字級只能加不能減 —— v2 就是被 6~7pt 咬過。
  ③ 【拿掉 .lead::before 那條裝飾邊】。它在手機上看起來就是一條白邊，
     而且它想表達的「這格是主角」已經由順序表達了 —— 主角就是第一格。
  ④ 【LOGO 的緞帶曲線變成底紋】。原本是 LOGO 上那組斜切線，很硬；
     改成兩道相互穿插的 S 形曲線（就是 mark.png 上那兩道），
     淡到幾乎看不見，只當紙的紋理。
  ⑤ 三個色階仍然照【功能配對】，但差異縮到很小：
        A B 訂課（最常按）  暖象牙
        C D 我的／私團      淡霧藍
        E F 資訊            淡灰綠
     ☢️ 不是六個顏色 —— 六個顏色等於沒有顏色（v2 的結論，仍然成立）。
  ⑥ 圖示線條 9 → 5，顏色改成低彩度的青。粗線在淺底上會變成噪點。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* 取自 LOGO 的藍→青，但整組降彩度、提亮度 —— 那是「修復風」的做法 */
    --ink:#23414E;      /* 標題：深墨，不是純黑 */
    --sub:#4E6B77;      /* 副標：中灰藍 */
    --teal:#7FB3BF;     /* 圖示與細線：低彩度的青 */
    --hair:rgba(35,65,78,.10);
  }
  body{width:2500px;height:1686px;background:#FBF8F4;
    font-family:'Noto Serif CJK TC','Noto Serif TC',serif;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    overflow:hidden}

  /* ☢️ 格線用【極淡的墨線】，不是白線。
        淺底配白線等於沒有線；淺底配淡墨線才分得開，而且不刺眼。 */
  .c{position:relative;padding:96px 78px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:inset -3px 0 0 var(--hair), inset 0 -3px 0 var(--hair)}
  .c:nth-child(3n){box-shadow:inset 0 -3px 0 var(--hair)}
  .c:nth-child(n+4){box-shadow:inset -3px 0 0 var(--hair)}
  .c:nth-child(6){box-shadow:none}

  /* 配對上色 —— 三階，而且三階都很淡 */
  .p1{background:linear-gradient(140deg,#FDFBF8 0%,#F4EEE5 100%)}  /* A B 訂課 */
  .p2{background:linear-gradient(140deg,#F8FBFC 0%,#E9F2F5 100%)}  /* C D 我的／私團 */
  .p3{background:linear-gradient(140deg,#F6F8F6 0%,#E9EFEB 100%)}  /* E F 資訊 */

  /* LOGO 的緞帶：兩道互相穿插的 S 形，淡到只當紙紋 */
  /* ☢️ 兩道【一模一樣、並排】的 S 會被讀成兩個問號 —— 第一版就是這樣。
        改成【兩端都出框】的長弧線：看得到的只有中段，
        沒有起點也沒有終點，就不會被讀成任何字。 */
  .rb{position:absolute;right:-150px;bottom:-170px;width:700px;height:700px;
    opacity:.11;pointer-events:none;overflow:hidden}
  .rb path{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round}

  .ico{width:96px;height:96px;margin-bottom:34px;display:block;flex:0 0 auto}
  .ico *{stroke:var(--teal);stroke-width:5;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .ico .fill{fill:var(--teal);stroke:none}

  .t{font-size:148px;font-weight:600;color:var(--ink);letter-spacing:.04em;
    line-height:1.05;white-space:nowrap}
  /* 標題下面一道很細的青線 —— 取代 v2 那條粗白邊 */
  .t::after{content:'';display:block;width:96px;height:4px;margin-top:26px;
    background:var(--teal);opacity:.7}
  .s{margin-top:24px;font-size:84px;font-weight:500;color:var(--sub);
    letter-spacing:.05em;line-height:1.3;white-space:nowrap}
</style>
</head>
