<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════
  LINE 圖文選單底圖的「原始檔」— 【職員版】 →  assets/brand/fff-richmenu-staff.png

  ☢️ 這一張【只有八位職員看得到】。客人看到的還是 fff-richmenu.png。
     LINE 允許同一個官方帳號掛兩張圖文選單：一張是預設的（客人），
     另一張用 API 綁到特定的 userId（職員）。綁上去的人看到的就是這一張。

  ☢️ 前五格【必須跟客人版一模一樣】—— 教練也要訂課、也要看價目表。
     只有第六格不同：客人是「傳訊息給櫃檯」，職員是進教練工具。
     ☢️ 兩張圖要一起改。只改一張的話，教練跟客人講的畫面會對不上。
  ══════════════════════════════════════════════════════════════════

  要改字、改配色、換分格：改這支 HTML，然後重新截一張 2500×1686 的圖。

  重截方式（Playwright，viewport 設 2500×1686，deviceScaleFactor 1）：
      page.set_viewport_size({"width": 2500, "height": 1686})
      page.goto("file:///.../richmenu-source.html")
      page.screenshot(path="fff-richmenu.png")

  ☢️ 尺寸不能亂改 —— LINE 圖文選單大版位就是 2500×1686，
     六宮格每格 833×843，後台的可點區域是照那個網格切的。
     圖改了尺寸，六個按鈕的位置就會全部對不上。
     ☢️ 反過來說：只要尺寸和格線不變，換圖【不用重設六個動作】。

  ☢️ 六格的順序（左上→右下）必須和後台設定的 A~F 一致：
     A 團體課預約 / B 我的預約 / C 私人教練課
     D 私人團體班 / E 價目表   / F 聯絡我們

  ── v2 改了什麼（2026-08-16） ──────────────────────────────────
  手機上圖文選單的實際寬度大約 390pt，也就是說圖會被縮到 15.6%。
  v1 的字級換算到手機上是：標題 14.7pt、副標 6.9pt、英文標籤 6.2pt。
  ☢️ 6～7pt 在手機上是看不見的，不是「有點小」。

  v2 三件事：
  ① 標題 94px → 148px（手機上 23pt），副標 44px → 72px（11pt），
     英文標籤整個拿掉 —— 它是三行裡最不重要卻佔最多空間的一行。
  ② 字句砍短：標題一律 3～4 字，副標一律 6 字以內。
  ③ 六格全部上色，用 LOGO 的藍→青漸層家族，【照功能配對】：
        A B 亮藍  = 每天會用的（訂課、我的預約）
        C D 中藍  = 私人課系列
        E F 深藍  = 資訊類
     ☢️ 三階是照【閱讀順序由亮到暗】排的，不是隨便配。
        亮度和使用頻率同方向 —— 最常按的最亮，最少按的最暗。
     ☢️ 不是六個不同顏色 —— 六個顏色等於沒有顏色。
     v1 的橘和綠來自「課程難度」那套色票（入門/中階/進階），
     放在這裡沒有任何意義，只是看起來熱鬧。
  ④ 加圖示。☢️ 縮到 15% 之後，形狀比顏色好認，顏色比文字好認。

  白字對比都驗過（WCAG AA 小字 4.5:1 以上）：
     #1A6389 6.58 / #2A7C9E 4.69 / #17506B 8.76 / #1F6482 6.56
     #0E2A3B 14.9 / #163A4D 12.2
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* CIS：色階全部取自 LOGO 本身的藍→青漸層（#2478A8 → #6FBAC9） */
    --teal:#6FBAC9; --aqua:#CFE7EE;
    --seam:rgba(255,255,255,.22);
  }
  body{width:2500px;height:1686px;background:#0E2A3B;
    font-family:'Noto Sans CJK TC','Noto Sans CJK HK','Noto Sans CJK SC',sans-serif;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    overflow:hidden}

  .c{position:relative;padding:92px 74px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:inset -6px 0 0 var(--seam), inset 0 -6px 0 var(--seam)}
  .c:nth-child(3n){box-shadow:inset 0 -6px 0 var(--seam)}
  .c:nth-child(n+4){box-shadow:inset -6px 0 0 var(--seam)}
  .c:nth-child(6){box-shadow:none}

  /* ── 配對上色：同一組功能同一個色，不是六個顏色 ── */
  .p1{background:linear-gradient(126deg,#1A6389 0%,#2A7C9E 100%)}   /* A B 每天用 */
  .p2{background:linear-gradient(126deg,#17506B 0%,#1F6482 100%)}   /* C D 私人課 */
  .p3{background:linear-gradient(126deg,#0E2A3B 0%,#163A4D 100%)}   /* E F 資訊   */

  /* LOGO 上那組斜切線，很淡，只當材質 */
  .c::after{content:'';position:absolute;right:-120px;top:-120px;width:420px;height:420px;
    pointer-events:none;
    background:linear-gradient(115deg,transparent 46%,rgba(255,255,255,.05) 46%,
      rgba(255,255,255,.05) 59%,transparent 59%,transparent 70%,rgba(255,255,255,.05) 70%,
      rgba(255,255,255,.05) 81%,transparent 81%)}

  /* 主要那一格多一條青色亮邊，讓「訂課」一眼就是主角 */
  .lead::before{content:'';position:absolute;left:0;top:0;bottom:0;width:14px;
    background:linear-gradient(180deg,var(--teal),#A9D6E0)}

  .ico{width:104px;height:104px;margin-bottom:30px;display:block;flex:0 0 auto}
  .ico *{stroke:var(--teal);stroke-width:9;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .ico .fill{fill:var(--teal);stroke:none}

  .t{font-size:148px;font-weight:900;color:#fff;letter-spacing:.02em;line-height:1.05;
    white-space:nowrap}
  .s{margin-top:26px;font-size:72px;font-weight:500;color:var(--aqua);letter-spacing:.04em;
    line-height:1.35;white-space:nowrap}
  /* 職員版限定的第三行。☢️ 比副標再小一點，但不能小於 60px ——
     手機上圖會縮到 15.6%，60px 換算過去只有 9.4pt，已經是下限。
     ☢️ 顏色用 --teal 不用 --aqua：它要一眼看出「這一行跟上面不同類」。 */
  .s2{margin-top:14px;font-size:62px;font-weight:900;color:var(--teal);
    letter-spacing:.10em;line-height:1.2;white-space:nowrap}
</style>
</head>
<body>
  <!-- A ─ 團體課預約 ─────────────────────────────────────────── -->
  <div class="c p1 lead">
    <svg class="ico" viewBox="0 0 100 100">
      <rect x="10" y="20" width="80" height="70" rx="8"/>
      <path d="M10 42 H90"/><path d="M30 10 V28"/><path d="M70 10 V28"/>
      <circle class="fill" cx="34" cy="62" r="7"/><circle class="fill" cx="66" cy="62" r="7"/>
    </svg>
    <div class="t">團體課</div>
    <div class="s">看課表・訂課</div>
  </div>

  <!-- B ─ 我的預約 ──────────────────────────────────────────── -->
  <div class="c p1">
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M24 12 H76 A6 6 0 0 1 82 18 V88 L50 68 L18 88 V18 A6 6 0 0 1 24 12 Z"/>
      <path d="M36 40 H64"/>
    </svg>
    <div class="t">我的預約</div>
    <div class="s">剩幾堂・取消</div>
  </div>

  <!-- C ─ 私人教練課 ────────────────────────────────────────── -->
  <div class="c p2">
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M14 38 V62"/><path d="M86 38 V62"/>
      <rect x="26" y="28" width="16" height="44" rx="6"/>
      <rect x="58" y="28" width="16" height="44" rx="6"/>
      <path d="M42 50 H58"/>
    </svg>
    <div class="t">私人課</div>
    <div class="s">一對一・一對二</div>
  </div>

  <!-- D ─ 私人團體班 ────────────────────────────────────────── -->
  <div class="c p2">
    <svg class="ico" viewBox="0 0 100 100">
      <circle cx="50" cy="30" r="14"/>
      <path d="M24 82 A26 26 0 0 1 76 82"/>
      <circle cx="17" cy="42" r="10"/><path d="M4 82 A20 20 0 0 1 16 63"/>
      <circle cx="83" cy="42" r="10"/><path d="M96 82 A20 20 0 0 0 84 63"/>
    </svg>
    <div class="t">私人團體</div>
    <div class="s">三人以上成班</div>
  </div>

  <!-- E ─ 價目表 ────────────────────────────────────────────── -->
  <div class="c p3">
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M52 10 H86 A6 6 0 0 1 92 16 V50 L46 96 A6 6 0 0 1 37 96 L6 65
               A6 6 0 0 1 6 56 Z"/>
      <circle class="fill" cx="72" cy="30" r="9"/>
    </svg>
    <div class="t">價目表</div>
    <div class="s">方案與價格</div>
  </div>

  <!-- F ─ 聯絡我們 ──────────────────────────────────────────── -->
  <div class="c p3">
    <svg class="ico" viewBox="0 0 100 100">
      <path d="M12 24 A8 8 0 0 1 20 16 H80 A8 8 0 0 1 88 24 V64 A8 8 0 0 1 80 72
               H44 L24 88 V72 H20 A8 8 0 0 1 12 64 Z"/>
      <circle class="fill" cx="34" cy="44" r="6"/>
      <circle class="fill" cx="50" cy="44" r="6"/>
      <circle class="fill" cx="66" cy="44" r="6"/>
    </svg>
    <div class="t">聯絡我們</div>
    <div class="s">傳訊息給櫃檯</div>
    <div class="s2">★ STAFF 入口</div>
  </div>
</body>
</html>
